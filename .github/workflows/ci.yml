---
name: CI

# Path-filtered SIMT lane: skip when a change cannot affect cuda-oxide or the
# shared host crates. `cuda-oxide/**` is deliberately broad (prose as well as
# code) because guard scripts cross-check the book against the crates.
#
# Self-hosted runners reject pull_request. copy-pr-bot mirrors trusted PRs to
# pull-request/<n>, and this workflow triggers on that push
# (config: .github/copy-pr-bot.yaml).
on:
  push:
    # No workflow-level paths: filter; the changes job below gates the jobs.
    branches:
      - main
      - "pull-request/[0-9]+"

# Each commit on main gets its own group, so it starts at once. Any other ref
# still shares one group and cancels the older run.
concurrency:
  group: ci-gate-${{ github.ref_name }}${{ github.ref_name == 'main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

# Every other workflow in the repo pins this rather than inheriting whatever the
# repository default happens to be. This one is a pure caller today, so the four
# called workflows' own `contents: read` already bounds the token and this
# changes nothing. It matters for the next job added here directly: a `uses:`
# job carries the callee's permissions, an inline `steps:` job would carry the
# default instead, and that difference is invisible in review.
permissions:
  contents: read

jobs:
  # Path gate. copy-pr-bot creates pull-request/<n> at an existing SHA, and
  # GitHub often treats that push as having no path changes, so a workflow-level
  # `paths:` filter would skip the whole run. This job diffs against main
  # instead, as cutile-rs.yml does, and every job below runs when no file diff
  # is detected. Other events (schedule, workflow_dispatch) skip the gate.
  changes:
    if: github.event_name == 'push'
    runs-on: linux-amd64-cpu4
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
      any_changed: ${{ steps.changes.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad  # v3.0.4
        id: changes
        with:
          filters: |
            relevant:
              - 'cuda-oxide/**'
              - 'cuda-bindings/**'
              - 'cuda-core/**'
              - 'cuda-core-derive/**'
              - 'cuda-repr/**'
              - 'cuda-async/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/**'
              - '.github/actions/setup-cuda-container/**'
            # `*` covers a root file, `**` every nested path. Both false means
            # no file diff was detected.
            any_changed:
              - '*'
              - '**'

  fmt:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.changes.outputs.relevant == 'true' || needs.changes.outputs.any_changed != 'true') }}
    uses: ./.github/workflows/fmt.yml

  clippy:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.changes.outputs.relevant == 'true' || needs.changes.outputs.any_changed != 'true') }}
    uses: ./.github/workflows/clippy.yml

  unit-tests:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.changes.outputs.relevant == 'true' || needs.changes.outputs.any_changed != 'true') }}
    uses: ./.github/workflows/unit-tests.yml

  cargo-deny:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.changes.outputs.relevant == 'true' || needs.changes.outputs.any_changed != 'true') }}
    uses: ./.github/workflows/cargo-deny.yml
