---
name: clippy

# Runs as a job of the top-level CI workflow (.github/workflows/ci.yml),
# which is the single push/pull_request entry point. Concurrency is governed
# by CI's own group, so this workflow declares none of its own.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: "13.1.1"
          method: network
          sub-packages: '["nvcc", "cudart-dev"]'
          non-cuda-sub-packages: '["libcurand-dev"]'

      # `--all-targets` covers tests, benches and examples, matching the two
      # steps below and the `just clippy` recipe. Without it a lint that fires
      # only in a test target passes here and fails for anyone running the
      # recipe locally.
      - name: Run clippy (workspace crates)
        env:
          CUDA_TOOLKIT_PATH: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `rustc-codegen-cuda` and each example under examples/ are their own
      # standalone workspaces (the codegen backend is swapped in via
      # RUSTFLAGS, so they can't live in the root [workspace]). That's 60+
      # cargo invocations from different workspace roots. By default each
      # one materializes its own `target/` dir and rebuilds the whole dep
      # tree (proc-macro2, syn, bindgen, regex-automata, ...) from scratch,
      # which blows the GitHub-hosted runner's ~14 GB disk well before the
      # loop finishes.
      #
      # Point all of those invocations at one shared CARGO_TARGET_DIR under
      # ${RUNNER_TEMP}. Cargo fingerprints each unit by package + features
      # + workspace_root + toolchain, so co-located workspaces using the
      # same pinned nightly deduplicate on identical deps and compile each
      # one once. This is intentionally scoped *not* to cover the
      # `cargo clippy --workspace` step above, which already has a
      # well-defined `target/` at the repo root.
      - name: Run clippy (rustc-codegen-cuda)
        env:
          CUDA_TOOLKIT_PATH: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/clippy-shared-target
        working-directory: cuda-oxide/crates/rustc-codegen-cuda
        run: cargo clippy --all-targets -- -D warnings

      - name: Run clippy (rustc-codegen-cuda examples)
        env:
          CUDA_TOOLKIT_PATH: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/clippy-shared-target
        run: |
          set -e
          for ex in cuda-oxide/crates/rustc-codegen-cuda/examples/*/; do
            if [ ! -f "$ex/Cargo.toml" ]; then continue; fi
            name=$(basename "$ex")
            echo "::group::clippy: $name"
            (cd "$ex" && cargo clippy --all-targets -- -D warnings)
            echo "::endgroup::"
          done

          # The loop above is one level deep. A few examples nest a second
          # manifest that the parent's `--all-targets` cannot reach either,
          # because the parent does not list it in `[workspace] members`:
          # `cutile_inter_kernel/simt` and `interop_cubin_identity/device`
          # carry their own `[workspace]`, and `mathdx_ffi_test/libmathdx-sys`
          # is a plain path dependency, which cargo builds but never lints.
          # fmt.yml already reaches all three through its `**/Cargo.toml` glob;
          # this closes the same gap for clippy. Membership is the test rather
          # than a hardcoded list, so a new nesting is picked up automatically.
          while IFS= read -r manifest; do
            dir="$(dirname "${manifest}")"
            parent="$(dirname "${dir}")"
            sub="$(basename "${dir}")"
            # Skip anything the parent lists as a member: the loop above
            # already lints it through the parent. Two assumptions baked in:
            # members really are covered by that parent run, and no parent
            # carries a `[workspace] exclude` list, whose quoted names this
            # grep would match just like members and wrongly skip.
            if [ -f "${parent}/Cargo.toml" ] &&
               sed -n "/^\[workspace\]/,/^\[/p" "${parent}/Cargo.toml" |
               grep -q "\"${sub}\""; then
              continue
            fi
            echo "::group::clippy: ${dir#cuda-oxide/crates/rustc-codegen-cuda/examples/}"
            (cd "${dir}" && cargo clippy --locked --all-targets -- -D warnings)
            echo "::endgroup::"
          done < <(
            find cuda-oxide/crates/rustc-codegen-cuda/examples -mindepth 3 -name Cargo.toml \
              -not -path '*/target/*' | sort
          )

          # The `#[cuda_module]` device-only fixture is a workspace of its own
          # outside examples/, so neither loop above nor the root
          # `cargo clippy --workspace` reaches it. It is the only thing proving
          # the #701/#702 property that a kernel-only crate needs no host
          # surface, and check-device-only-build.sh runs `cargo check` on it but
          # never a lint.
          echo "::group::clippy: cuda-macros device-only fixture"
          (cd cuda-oxide/crates/cuda-macros/tests/device-only && cargo clippy --locked --all-targets -- -D warnings)
          echo "::endgroup::"
