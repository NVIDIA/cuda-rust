---
name: docs

# Path-filtered SIMT lane (same roots as ci.yml).
on:
  # Self-hosted runners reject pull_request. copy-pr-bot mirrors trusted PRs
  # to pull-request/<n>, and this workflow triggers on that push.
  push:
    # No workflow-level paths: filter; the changes job below gates the jobs.
    branches:
      - main
      - "pull-request/[0-9]+"

# Each commit on main gets its own group, so it starts at once. Any other ref
# still shares one group and cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}${{ github.ref_name == 'main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

# A container job's default shell is dash; these steps use bash.
defaults:
  run:
    shell: bash

# Gate rustdoc and doctests, which the `unit-tests` job does not cover (it runs
# `--lib --tests`, excluding doctests, and never builds docs). Keeps broken
# intra-doc links and uncompilable doc examples from accumulating silently.
jobs:
  # Path gate. copy-pr-bot creates pull-request/<n> at an existing SHA, and
  # GitHub often treats that push as having no path changes, so a workflow-level
  # `paths:` filter would skip the whole run. This job diffs against main
  # instead, as cutile-rs.yml does, and every job below runs when no file diff
  # is detected. Other events (schedule, workflow_dispatch) skip the gate.
  changes:
    if: github.event_name == 'push'
    runs-on: linux-amd64-cpu4
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
      any_changed: ${{ steps.changes.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad  # v3.0.4
        id: changes
        with:
          filters: |
            relevant:
              - 'cuda-oxide/**'
              - 'cuda-bindings/**'
              - 'cuda-core/**'
              - 'cuda-core-derive/**'
              - 'cuda-repr/**'
              - 'cuda-async/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/**'
              - '.github/actions/setup-cuda-container/**'
            # `*` covers a root file, `**` every nested path. Both false means
            # no file diff was detected.
            any_changed:
              - '*'
              - '**'

  rustdoc-and-doctests:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.changes.outputs.relevant == 'true' || needs.changes.outputs.any_changed != 'true') }}
    name: cargo doc + doctests
    runs-on: linux-amd64-cpu4
    # `cargo doc` compiles cuda-bindings' build-time bindgen, which needs
    # cuda.h. The devel image is CUDA 13.3.1, the same pin the toolkit
    # install used, and it has no rustup.
    container:
      image: nvidia/cuda:13.3.1-devel-ubuntu24.04
      env:
        DEBIAN_FRONTEND: noninteractive
    env:
      CUDA_TOOLKIT_PATH: /usr/local/cuda
    timeout-minutes: 30
    steps:
      # $/ installs git before checkout. The CUDA image has no git; without
      # it checkout stores a tarball.
      - uses: $/.github/actions/setup-cuda-container

      - name: Clone repository
        uses: actions/checkout@v4

      - name: Build docs (warning-free) and run doctests
        working-directory: cuda-oxide
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          sysroot="$(rustc --print sysroot)"
          export LIBRARY_PATH="${sysroot}/lib:${LIBRARY_PATH:-}"
          export LD_LIBRARY_PATH="${sysroot}/lib:${LD_LIBRARY_PATH:-}"

          # Docs must build warning-free (RUSTDOCFLAGS=-D warnings above).
          cargo doc --no-deps --workspace

          # Run doctests.
          cargo test --doc --workspace

      # `rustc-codegen-cuda` is its own [workspace] (it links against
      # rustc-private dylibs), so `--workspace` above never reaches it. fmt,
      # clippy and unit-tests each carry a dedicated step for that crate;
      # this gate did not, which is how four broken intra-doc links in its
      # crate-level documentation went unreported.
      - name: Build docs (warning-free) for rustc-codegen-cuda
        working-directory: cuda-oxide/crates/rustc-codegen-cuda
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          sysroot="$(rustc --print sysroot)"
          export LIBRARY_PATH="${sysroot}/lib:${LIBRARY_PATH:-}"
          export LD_LIBRARY_PATH="${sysroot}/lib:${LD_LIBRARY_PATH:-}"
          cargo doc --no-deps
