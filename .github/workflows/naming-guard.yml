---
name: naming-guard

# check-reserved-prefixes.sh searches only cuda-oxide/crates. The strings it
# looks for are the SIMT link-symbol prefixes owned by reserved-oxide-symbols;
# every other SIMT crate must use that crate's constants. cutile-rs and the
# shared host crates (cuda-bindings, cuda-core, cuda-core-derive, cuda-async)
# are outside that rule, so these paths omit them. Listing those directories
# here would rerun the same search; covering them means adding them to
# SEARCH_ROOTS in the script first.
on:
  push:
    branches: [main]
    paths:
      - 'cuda-oxide/crates/**'
      - 'cuda-oxide/scripts/check-reserved-prefixes.sh'
      - '.github/workflows/naming-guard.yml'
  pull_request:
    # Include PRs stacked on copy-pr-bot mirrors of their prerequisites.
    branches: [main, "pull-request/[0-9]+"]
    paths:
      - 'cuda-oxide/crates/**'
      - 'cuda-oxide/scripts/check-reserved-prefixes.sh'
      - '.github/workflows/naming-guard.yml'

# Each commit on main gets its own group, so it starts at once. Any other ref
# still shares one group and cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}${{ github.ref_name == 'main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  reserved-symbols-guard:
    name: reserved-oxide-symbols literal guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      # The search, its canary self-test, and the reasoning behind the exact
      # pattern all live in the script, so they can be run and mutation-tested
      # locally instead of only inside this job. That reasoning is worth
      # reading before changing the pattern: it records why bare
      # `cuda_oxide_` is deliberately not matched, and why a search that
      # cannot run has to fail rather than report an empty result.
      - name: Search for hardcoded reserved-prefix literals
        run: bash cuda-oxide/scripts/check-reserved-prefixes.sh
