[workspace]
resolver = "3"
members = [
    # Stable host-side crates shared by the Tile and SIMT components.
    # Package metadata and dependencies stay in each crate so this workspace
    # does not impose CUDA Oxide's nightly toolchain or edition.
    "cuda-bindings",
    "cuda-core",
    "cuda-core-derive",
    "cuda-async",
]
# Nested workspaces. Without these, Cargo treats crates under them as part of
# this workspace and `edition.workspace = true` in cuda-device (etc.) looks at
# this manifest, which has no [workspace.package].
exclude = [
    "cuda-oxide",
    "cutile-rs",
]
