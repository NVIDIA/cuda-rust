[workspace]
resolver = "3"
members = [
    # Stable host-side crates shared by the Tile and SIMT components.
    # Package metadata and dependencies stay in each crate so this workspace
    # does not impose CUDA Oxide's workspace toolchain pin or edition.
    "cuda-bindings",
    "cuda-core",
    "cuda-core-derive",
    "cuda-async",
    # no_std representation contracts shared by host and device crates.
    "cuda-repr",
    # Scalar storage formats and the DType bound. Usable without a toolkit.
    "cuda-dtype",
    # Staged obligation vocabulary shared by the compiler and the host launcher.
    "cuda-obligation",
]
# Nested workspaces. Without these, Cargo treats crates under them as part of
# this workspace and `edition.workspace = true` in cuda-device (etc.) looks at
# this manifest, which has no [workspace.package].
exclude = [
    "cuda-oxide",
    "cutile-rs",
]
