[package]
name = "cuda-core"
description = "Idiomatic CUDA API."
version = "0.5.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["Melih Elibol"]
repository = "https://github.com/NVIDIA/cuda-rust"
readme = "README.md"

[dependencies]
# Sibling paths, not the root workspace entries: those name the published
# release that cuda-oxide consumes, and inheriting them here would make this
# copy depend on a crates.io cuda-bindings instead of the one beside it.
cuda-bindings = { version = "=0.5.0", path = "../cuda-bindings" }
cuda-core-derive = { version = "=0.5.0", path = "../cuda-core-derive" }
cuda-repr = { version = "=0.5.0", path = "../cuda-repr" }
anyhow = "1"
# `NoUninit`/`AnyBitPattern` bound safe source/destination buffer casts.
# Re-exported at the crate root for downstream element types.
# `min_const_generics` gives `Pod` for arrays of every length.
bytemuck = { version = "1", features = ["min_const_generics"] }
# The `bytemuck` feature makes `f16` and `bf16` `Pod`, so a buffer or tensor
# can be reinterpreted as either of them.
half = { version = "2", features = ["bytemuck"] }
oxide-artifacts = { version = "0.2.1", features = ["object-read"] }

[dev-dependencies]
trybuild = "1"

[features]
# Nightly-only: DeviceCopy for the unstable f16 primitive.
f16 = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[lints.clippy]
all = { level = "deny", priority = -1 }
missing_safety_doc = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
single_range_in_vec_init = "allow"
