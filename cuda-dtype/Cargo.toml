[package]
name = "cuda-dtype"
version = "0.5.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["Melih Elibol"]
repository = "https://github.com/NVIDIA/cuda-rust"
description = "Storage formats for cuda-rust"

[dependencies]
half = { version = "2", features = ["bytemuck"] }
# The `impl_pod_newtype` macro emits `bytemuck::Zeroable` / `Pod` impls directly.
bytemuck = { version = "1", features = ["min_const_generics"] }
