[workspace]
resolver = "3"
members = [
    # CuTe frontend and semantic IR shared by every CuTe backend.
    "cute-rs-preview/cute-layout",
    "cute-rs-preview/cute-rs",
    "cute-rs-preview/ctm-rs",
    "cute-rs-preview/dialect-cute",
    # Core crates
    "crates/cuda-target-spec",
    "crates/cuda-intrinsics",
    "crates/cuda-intrinsics-gen",
    "crates/ptx-parse",
    "crates/ptx-schedule",
    "crates/dialect-ptx",
    "crates/cuda-device",
    "crates/cuda-artifact-finalizer",
    "crates/cuda-host",
    "crates/cuda-macros",
    "crates/llvm-export",
    "crates/cuda-oxide-mlir-export",
    "crates/dialect-mir",
    "crates/dialect-iket",
    "crates/dialect-nvvm",
    "crates/mir-importer",
    "crates/cuda-oxide-codegen",
    "crates/mir-lower",
    "crates/iket-lower",
    "crates/mir-transforms",
    "crates/nvvm-transforms",
    "crates/cargo-oxide",
    "crates/oxide-artifacts",
    "crates/oxide-tile-export",
    "crates/oxide-tilebc",
    # FFI bindings
    "crates/libnvvm-sys",
    "crates/nvjitlink-sys",
    # Internal naming contract (workspace-private; publish = false)
    "crates/reserved-oxide-symbols",
    # Differential codegen fuzzer support
    "crates/fuzzer",
]

[workspace.package]
edition = "2024"
authors = ["Nihal Pasham <nihalp@nvidia.com>"]
license = "Apache-2.0"
repository = "https://github.com/NVIDIA/cuda-rust"

# Note: crates/rustc-codegen-cuda is NOT a workspace member because it links
# against rustc_private (via rustc-dev and RUSTC_BOOTSTRAP=1) and uses a
# separate build process.
# Build and run examples with: cargo oxide run <example>
# Examples are in: crates/rustc-codegen-cuda/examples/ and cute-rs-preview/examples/
# Complete model workloads are in: cute-rs-preview/models/

[workspace.dependencies]
# Pliron MLIR framework, pinned to the published 0.20.0 release, retaining
# struct-layout, GEP no-wrap, volatile, global-constant, inline-asm, and generic
# LLVM attribute semantics.
# pliron-llvm uses default-features = false to keep llvm-sys (LLVM 23) out:
# cuda-oxide consumes the dialect modeling only, not the FFI bridge.
# `crates/rustc-codegen-cuda/Cargo.toml` MUST use the same registry source and
# exact release, or pliron resolves to distinct crates and types stop unifying.
pliron = { version = "=0.20.0" }
pliron-derive = { version = "=0.20.0" }
pliron-llvm = { version = "=0.20.0", default-features = false, features = [
    "std",
] }

# Internal crates
cuda-target-spec = { path = "crates/cuda-target-spec" }
llvm-export = { path = "crates/llvm-export" }
# Published printer; version-specific compatibility stays in the export adapter.
pliron-mlir-interop = { version = "=0.1.0" }
cuda-oxide-mlir-export = { path = "crates/cuda-oxide-mlir-export" }
cute-layout = { path = "cute-rs-preview/cute-layout" }
ctm-rs = { path = "cute-rs-preview/ctm-rs" }
dialect-cute = { path = "cute-rs-preview/dialect-cute" }
dialect-mir = { path = "crates/dialect-mir" }
dialect-iket = { path = "crates/dialect-iket" }
dialect-ptx = { path = "crates/dialect-ptx" }
dialect-nvvm = { path = "crates/dialect-nvvm" }
mir-lower = { path = "crates/mir-lower" }
iket-lower = { path = "crates/iket-lower" }
cuda-oxide-codegen = { path = "crates/cuda-oxide-codegen" }
mir-transforms = { path = "crates/mir-transforms" }
nvvm-transforms = { path = "crates/nvvm-transforms" }
cuda-device = { path = "crates/cuda-device" }
cuda-artifact-finalizer = { path = "crates/cuda-artifact-finalizer" }
cuda-host = { path = "crates/cuda-host" }
# No default features: `host` is opt-in per member, so that depending on
# cuda-device does not unify the host surface back on for kernel-only crates.
# `cuda-host` names `features = ["host"]`, so anything that loads or launches a
# module still gets it.
cuda-macros = { path = "crates/cuda-macros", default-features = false }
# Git-root host crates, consumed by path at tip of tree. No version
# requirement on purpose: a release of the host crates needs no edit here, and
# the crates that depend on them in this tree are not published, so nothing
# needs one (#1459). Examples path-depend on the same directories so the graph
# has one cuda_core (and one cuda-async / cuda-bindings). `cargo oxide new`
# names every CUDA crate from one git source for the same reason;
# scripts/check-shared-crate-pin.sh enforces both.
cuda-core = { path = "../cuda-core" }
cuda-async = { path = "../cuda-async" }
libnvvm-sys = { path = "crates/libnvvm-sys" }
nvjitlink-sys = { path = "crates/nvjitlink-sys" }
reserved-oxide-symbols = { path = "crates/reserved-oxide-symbols" }
# The crates.io release, not the in-tree path: the shared cuda-core (cutile-rs)
# reads artifact bundles through crates.io oxide-artifacts, and a path copy of
# the same version is a second crate to rustc. crates/oxide-artifacts
# stays in the workspace as the source this release is published from; bump,
# publish, then move this line.
# scripts/check-oxide-artifacts-parity.sh keeps them equal.
oxide-artifacts = "0.2.1"
# Tile export descriptions shared by `#[tile_export]`, the backend, and
# `cargo oxide tilelib`.
oxide-tile-export = { path = "crates/oxide-tile-export" }
# Tile IR bytecode for those descriptions: `cargo oxide tilelib` writes a
# tile library's interface and implementation halves with it. Pure Rust, so
# cargo-oxide stays toolkit-free.
oxide-tilebc = { path = "crates/oxide-tilebc" }
ptx-parse = { path = "crates/ptx-parse" }
ptx-schedule = { path = "crates/ptx-schedule" }

# Common dependencies
# No default features: cuda-device is `no_std` and is compiled for the device,
# and only the marker traits are wanted there, not `std` or the derive macros.
bytemuck = { version = "1", default-features = false }
thiserror = "2"
linkme = "0.3"
anyhow = "1.0"
once_cell = "1.18"
# Pliron 0.19 requires SourcePosition: Hash, introduced in combine 4.6.8.
combine = "4.6.8"
log = "0.4"
half = "2.7"
libloading = "0.8"
object = { version = "0.36", default-features = false, features = ["read", "std", "write"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tempfile = "3.9"
rustc-demangle = "0.1"

# llvm-export deps
rustc-hash = "2.0"
bitflags = "2.0"
dyn-clone = "1.0"

# cuda-macros deps
quote = "1.0"
syn = { version = "2.0", features = ["full", "visit", "visit-mut"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }

# `cargo oxide` runs through the workspace's dev-profile Cargo alias. Its
# backend fingerprint hashes a large debug shared object on every invocation;
# optimize only SHA-256 so exact content fingerprinting remains inexpensive.
[profile.dev.package.sha2]
opt-level = 3
