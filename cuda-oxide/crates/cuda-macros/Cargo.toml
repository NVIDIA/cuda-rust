[package]
name = "cuda-macros"
version = "0.2.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Procedural macros for CUDA kernel development (#[kernel], #[device], etc.)"
readme = "README.md"

[lib]
proc-macro = true

[features]
default = ["host"]
async = []
# Emit the host-side surface: the `#[cuda_module]` `LoadedModule` loader and
# launchers, and the `CudaKernel` impl for non-generic `#[kernel]`s. All of it
# names `::cuda_host` / `::cuda_core`, so a device-only kernel crate that never
# loads or launches anything still has to depend on `cuda-host` -> `cuda-core`
# -> `cuda-bindings` -> `cuda.h`. On by default; turn it off with
# `default-features = false` in a crate that only compiles kernels.
#
# Mixed graphs: proc-macro features unify globally per build graph. If any
# crate in the graph enables `cuda-macros/host`, every crate that expands
# these macros gets the host-emitting expansion, including a device-only
# kernel crate that took `default-features = false` and has no `cuda-host`
# to resolve the generated `cuda_host::` paths (E0433). A device-only kernel
# crate consumed by a host application must therefore forward the feature
# itself:
#
#   host = ["dep:cuda-host", "cuda-macros/host"]
#
# so the same switch that turns host emission on also adds the dependency
# that resolves it.
host = []

[dependencies]
quote = { workspace = true }
syn = { workspace = true }
proc-macro2 = { workspace = true }
reserved-oxide-symbols = { workspace = true }

[dev-dependencies]
trybuild = "1"
# Dev-only cycle (cargo allows it): the launch_requires_unsafe compile-fail
# test type-checks a real cuda_launch! expansion, which needs the host-side
# launch types.
# Keep the async host surface available to trybuild crates when this proc-macro
# package is tested with `--features async`.
cuda-host = { workspace = true, features = ["async"] }
cuda-core = { workspace = true }
cuda-device = { workspace = true }
