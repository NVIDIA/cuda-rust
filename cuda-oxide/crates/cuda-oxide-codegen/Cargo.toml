[package]
name = "cuda-oxide-codegen"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Rustc-independent cuda-oxide PTX backend"
readme = "README.md"

# Records the LLVM major this crate's textual IR is written for (#1300).
# cuda-target-spec has no dependencies of its own, so it is safe here and
# keeps one `rustc -vV` parser in the tree.
[build-dependencies]
cuda-target-spec = { workspace = true }

[dependencies]
cuda-target-spec = { workspace = true }
pliron = { workspace = true }
ptx-parse = { workspace = true }
thiserror = { workspace = true }
dialect-mir = { workspace = true }
dialect-iket = { workspace = true }
dialect-nvvm = { workspace = true }
iket-lower = { workspace = true }
mir-lower = { workspace = true }
mir-transforms = { workspace = true }
llvm-export = { workspace = true }
libnvvm-sys = { workspace = true }
nvvm-transforms = { workspace = true }
tempfile = { workspace = true }
rustc-demangle = { workspace = true }
