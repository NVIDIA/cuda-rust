[package]
name = "bf16_value_types"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Standalone crate, not part of the parent workspace.
[workspace]

# Typed bfloat16 values (`Bf16`, `Bf16x2`) as kernel element types.
# Build with:
#   cargo oxide run bf16_value_types

[dependencies]
cuda-core = { path = "../../../../../cuda-core" }
cuda-device = { path = "../../../cuda-device" }
cuda-host = { path = "../../../cuda-host" }
