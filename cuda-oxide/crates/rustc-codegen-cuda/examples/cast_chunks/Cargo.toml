[package]
name = "cast_chunks"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"

# Mark as standalone crate (not part of parent workspace)
[workspace]

# This example demonstrates DeviceBuffer::cast_chunks, the length-adjusting
# reinterpret that lets a flat f32 buffer feed a kernel taking an over-aligned
# vector element type.
# Build with:
#   cargo oxide run cast_chunks

[dependencies]
# Device-side intrinsics (thread indexing, barriers, etc.)
cuda-device = { path = "../../../cuda-device" }

# Host-side utilities (CudaKernel trait, etc.)
cuda-host = { path = "../../../cuda-host" }

# Host-side CUDA runtime
cuda-core = "0.3.1"
