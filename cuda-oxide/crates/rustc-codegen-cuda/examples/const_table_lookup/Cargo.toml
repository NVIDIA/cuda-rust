[package]
name = "const_table_lookup"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"

# Mark as standalone crate (not part of parent workspace)
[workspace]

# Measures what a compile-time lookup table costs per PTX address space:
# a bare array constant (.local), the same data behind a reference (.global),
# and ConstantMemory (.const). Build with:
#   cargo oxide run const_table_lookup

[dependencies]
# Device-side intrinsics (thread indexing, constant memory, etc.)
cuda-device = { path = "../../../cuda-device" }

# Host-side utilities (CudaKernel trait, etc.)
cuda-host = { path = "../../../cuda-host" }

# Host-side CUDA runtime
cuda-core = "0.3.1"
