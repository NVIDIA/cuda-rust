[package]
name = "constant_memory_table"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"

# Mark as standalone crate (not part of parent workspace)
[workspace]

# Measures reading a ConstantMemory table at a runtime index -- get() by value
# against get_ref() in place -- and which address space suits a divergent versus
# a warp-uniform index. Build with:
#   cargo oxide run constant_memory_table

[dependencies]
# Device-side intrinsics (thread indexing, constant memory, etc.)
cuda-device = { path = "../../../cuda-device" }

# Host-side utilities (CudaKernel trait, etc.)
cuda-host = { path = "../../../cuda-host" }

# Host-side CUDA runtime
cuda-core = "0.3.1"
