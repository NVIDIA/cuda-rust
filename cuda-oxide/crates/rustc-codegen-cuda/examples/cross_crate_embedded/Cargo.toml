[package]
name = "cross_crate_embedded"
version = "0.1.0"
edition = "2024"
authors = ["Nihal Pasham <nihalp@nvidia.com>"]
license = "Apache-2.0"

# Standalone workspace so the nested kernel crate can be a workspace member.
[workspace]
members = ["embedded-kernel-lib"]

[dependencies]
# Named distinctly from cross_crate_kernel's `kernel-lib`: CI builds all
# examples into one shared CARGO_TARGET_DIR, and two local crates with the
# same (name, version) alias each other's cache slot there, so the second
# example links whichever library was compiled first.
embedded-kernel-lib = { path = "embedded-kernel-lib" }
cuda-device  = { path = "../../../cuda-device" }
cuda-host    = { path = "../../../cuda-host" }
cuda-core = "0.3.1"
