[package]
name = "cutile_inter_kernel"
version = "0.1.0"
edition = "2024"
authors = ["NVIDIA CORPORATION"]
license = "Apache-2.0"

[package.metadata.cuda-oxide.interop]
kind = "inter-kernel-t2s"

[[package.metadata.cuda-oxide.device-crates]]
manifest-path = "simt/Cargo.toml"
ptx-dir = "simt"

[workspace]
resolver = "2"

[dependencies]
cutile = "0.3.1"
cutile-compiler = "0.3.1"
cuda-async = "0.3.1"
cutile-cuda-core = { version = "0.3.1", package = "cuda-core" }
tokio = { version = "1", features = ["full"] }
