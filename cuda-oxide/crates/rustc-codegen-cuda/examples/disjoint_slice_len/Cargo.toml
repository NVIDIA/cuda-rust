cargo-features = ["profile-rustflags"]

[package]
name = "disjoint_slice_len"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace]

[dependencies]
cuda-device = { path = "../../../cuda-device" }
cuda-host = { path = "../../../cuda-host" }
cuda-core = "0.3.1"

# The mir-importer intercepts `DisjointSlice::len` only when rustc's MIR
# inliner leaves the call intact; at default release settings the call is
# inlined into the kernel and the issue #343 pattern this example guards
# disappears. Scoping the flag to this one crate keeps the guard while the
# shared dependency tree stays identical to every other example. (A global
# RUSTFLAGS entry re-keys every dependency unit and forces a full second
# dependency-tree build in CI.)
[profile.release.package.disjoint_slice_len]
rustflags = ["-Zinline-mir=no"]
