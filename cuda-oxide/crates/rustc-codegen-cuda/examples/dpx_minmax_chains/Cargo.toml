[package]
name = "dpx_minmax_chains"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Mark as standalone crate (not part of parent workspace)
[workspace]

# Regression coverage for the DPX-shaped integer min/max chains of issue #338
# Phase 4: plain Rust min/max/add chains must reach PTX as native min.*/max.*
# instructions, the shape ptxas fuses into DPX (VIMNMX) SASS on sm_90+.
# Build with:
#   cargo oxide run dpx_minmax_chains

[dependencies]
cuda-device = { path = "../../../cuda-device" }
cuda-host = { path = "../../../cuda-host" }
cuda-core = "0.3.1"
