cargo-features = ["profile-rustflags"]

[package]
name = "drop_glue"
version = "0.1.0"
edition = "2024"
authors = ["Nihal Pasham <nihalp@nvidia.com>"]
license = "Apache-2.0"

[workspace]

[dependencies]
cuda-core = { path = "../../../../../cuda-core" }
cuda-device = { path = "../../../cuda-device" }
cuda-host = { path = "../../../cuda-host" }

# The compile-only probes need each destructor's own MIR to reach the importer:
# a CFG cycle in `LoopingDrop::drop`, the recursive call in `RecursiveDrop::drop`
# and the two-way branch in `DiamondDrop::drop`. At default release settings
# rustc's MIR inliner folds the empty callees into the destructors and the
# destructors into their glue first. `#[inline(never)]` is not the answer:
# it is carried to LLVM as `noinline`, so the destructors would stay real PTX
# functions and the optimized kernels would call them instead of showing the
# store-then-self-loop that verify-code-shape.sh checks. Switching MIR inlining
# off for this one crate keeps the calls for LLVM to inline. Scoping the flag
# to this package keeps the shared dependency tree identical to every other
# example; a global RUSTFLAGS entry would re-key every dependency unit and
# force a full second dependency-tree build in CI.
[profile.release.package.drop_glue]
rustflags = ["-Zinline-mir=no"]
