[package]
name = "enum_table_lookup"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"

# Mark as standalone crate (not part of parent workspace)
[workspace]

# Measures a field-less enum constant table read at a runtime index against the
# equivalent u32 table, which is the shape the enum one should already cost.
# Build with:
#   cargo oxide run enum_table_lookup

[dependencies]
# Device-side intrinsics (thread indexing, constant memory, etc.)
cuda-device = { path = "../../../cuda-device" }

# Host-side utilities (CudaKernel trait, etc.)
cuda-host = { path = "../../../cuda-host" }

# Host-side CUDA runtime
cuda-core = "0.3.1"
