[package]
name = "f16_stress"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace]

[dependencies]
cuda-device = { path = "../../../cuda-device" }
cuda-host = { path = "../../../cuda-host" }
# Primitive `f16` is nightly-only, so the shared crate gates its `DeviceCopy`
# impl behind this feature; `half::f16` needs nothing extra.
cuda-core = { version = "0.3.1", features = ["f16"] }
