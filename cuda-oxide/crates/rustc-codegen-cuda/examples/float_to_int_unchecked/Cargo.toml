[package]
name = "float_to_int_unchecked"
version = "0.1.0"
edition = "2024"
authors = ["Daniel Veljjanoski <danielveljanoski@gmail.com>"]
license = "Apache-2.0"

# Mark as standalone crate (not part of parent workspace)
[workspace]

# Exercises f32/f64::to_int_unchecked, which calls
# core::intrinsics::float_to_int_unchecked.
# Build with:
#   cargo oxide run float_to_int_unchecked --arch sm_86

[dependencies]
# Device-side intrinsics (thread indexing, barriers, etc.)
cuda-device = { path = "../../../cuda-device" }

# Host-side utilities (CudaKernel trait, etc.)
cuda-host = { path = "../../../cuda-host" }

# Host-side CUDA runtime
cuda-core = { path = "../../../../../cuda-core" }
