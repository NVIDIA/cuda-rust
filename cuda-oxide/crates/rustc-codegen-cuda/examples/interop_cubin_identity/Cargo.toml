[package]
name = "interop_cubin_identity"
version = "0.1.0"
edition = "2024"
authors = ["NVIDIA CORPORATION"]
license = "Apache-2.0"

# End-to-end coverage for the native-artifact interop path: the device
# crate is finalized to a cubin (libNVVM + nvJitLink) instead of PTX, a
# versioned .identity sidecar is written, and the deliberately hyphenated
# bin target exercises cargo's uplifted dep-info naming.
[[package.metadata.cuda-oxide.device-crates]]
manifest-path = "device/Cargo.toml"
artifact-dir = "device"
artifact-name = "scale_offset_device"
artifact-kind = "cubin"
source-identity = true
bin = "scale-offset-device"

[workspace]
resolver = "2"

[dependencies]
cuda-core = "0.3.1"
sha2 = "0.10"
