[package]
name = "interop-cubin-identity-kernels"
version = "0.1.0"
edition = "2024"
authors = ["NVIDIA CORPORATION"]
license = "Apache-2.0"

# Two binary targets on purpose: the host metadata selects
# `scale-offset-device` with `bin = ...`, so cargo-oxide must build only
# that target and derive every artifact and sidecar name from it.
[[bin]]
name = "scale-offset-device"
path = "src/bin/scale_offset_device.rs"

[workspace]
resolver = "2"

[dependencies]
cuda-device = { path = "../../../../cuda-device" }
cuda-host = { path = "../../../../cuda-host" }
cuda-core = "0.3.1"
