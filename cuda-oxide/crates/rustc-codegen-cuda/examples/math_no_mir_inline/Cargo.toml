cargo-features = ["profile-rustflags"]

[package]
name = "math_no_mir_inline"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Standalone crate (not part of parent workspace).
[workspace]

[dependencies]
cuda-device = { path = "../../../cuda-device" }
cuda-host = { path = "../../../cuda-host" }
cuda-core = "0.3.1"

# `x.atan()` and every other float method is a one-line `#[inline]` wrapper in
# `std`. At default release settings rustc's MIR inliner folds that wrapper
# into the kernel, so the collector only ever sees the function underneath it
# and this example would test nothing. Switching MIR inlining off keeps the
# wrapper call in the kernel, which is what every `-C incremental` build
# (cargo's dev profile, `cargo oxide test`, `CARGO_INCREMENTAL=1`) does by
# itself. Scoping the flag to this one crate keeps the shared dependency tree
# identical to every other example; a global RUSTFLAGS entry would re-key every
# dependency unit and force a full second dependency-tree build in CI.
[profile.release.package.math_no_mir_inline]
rustflags = ["-Zinline-mir=no"]
