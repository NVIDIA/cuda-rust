[package]
name = "ptr_without_provenance"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Standalone crate, not part of the parent workspace.
[workspace]

# Exercises non-null integer-to-pointer constants:
# - `core::ptr::without_provenance::<T>(N)` / `without_provenance_mut`
#
# Build and run with:
#   cargo oxide run ptr_without_provenance

[dependencies]
cuda-device = { path = "../../../cuda-device" }
cuda-host = { path = "../../../cuda-host" }
cuda-core = "0.3.1"
