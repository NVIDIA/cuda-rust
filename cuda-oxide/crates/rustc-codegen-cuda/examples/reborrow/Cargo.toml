cargo-features = ["profile-rustflags"]

[package]
name = "reborrow"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace]

[dependencies]
cuda-device = { path = "../../../cuda-device" }
cuda-host = { path = "../../../cuda-host" }
cuda-core = "0.3.1"

# The importer's `Rvalue::Reborrow` arm has a `Mutability::Mut` half that only
# exists in unoptimized MIR: GVN folds a mutable reborrow into a plain copy at
# mir-opt-level>0. Scoping level 0 to this one crate keeps that half reachable
# in every build of this example, without borrowing the device debug mode for
# it. (A global RUSTFLAGS entry would re-key every dependency unit and force a
# full second dependency-tree build in CI; see disjoint_slice_len.)
[profile.release.package.reborrow]
rustflags = ["-Zmir-opt-level=0"]
