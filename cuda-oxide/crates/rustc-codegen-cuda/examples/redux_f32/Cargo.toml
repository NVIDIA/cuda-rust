[package]
name = "redux_f32"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Mark as standalone crate (not part of parent workspace)
[workspace]

# This example demonstrates the single-instruction warp f32 reductions
# `redux.sync.{min,max}{.abs}{.NaN}.f32` (Blackwell family 10x). Build with:
#   cargo oxide build redux_f32 --arch=sm_100a

[dependencies]
# Device-side intrinsics (warp::redux_sync_min_f32, _max_abs_nan_f32, ...)
cuda-device = { path = "../../../cuda-device" }

# Host-side utilities (CudaKernel trait, etc.)
cuda-host = { path = "../../../cuda-host" }

# Host-side CUDA runtime
cuda-core = "0.3.1"
