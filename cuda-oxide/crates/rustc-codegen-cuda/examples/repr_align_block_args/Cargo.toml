[package]
name = "repr_align_block_args"
version = "0.1.0"
edition = "2024"
authors = ["Nihal Pasham <nihalp@nvidia.com>"]
license = "Apache-2.0"

# Mark as standalone crate (not part of parent workspace)
[workspace]

# Guards repr(align(N)) recovery for values in block-arg positions
# (function params, mem2reg join/loop args). The dialect conversion
# driver may convert block-argument types before any per-op rewrite runs
# (pliron PR #182 made this eager), so mir-lower must recover the ABI
# alignment of stored/referenced block args from the OperandsInfo
# conversion history rather than from live types. These kernels put
# over-aligned aggregates into exactly those positions; a lost stamp
# shows up as a missing `align 16` in the emitted .ll.
# Run with:
#   cargo oxide run repr_align_block_args

[dependencies]
cuda-device = { path = "../../../cuda-device" }
cuda-host = { path = "../../../cuda-host" }
cuda-core = "0.3.1"
