[package]
name = "scoped_atomic_load_store"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Mark as standalone crate (not part of parent workspace)
[workspace]

# Regression example for scoped atomic load/store and fences under libNVVM.
# Build and run with:
#   cargo oxide run scoped_atomic_load_store --materialize-cubin

[dependencies]
cuda-device = { path = "../../../cuda-device" }
cuda-host = { path = "../../../cuda-host" }
cuda-core = "0.3.1"
