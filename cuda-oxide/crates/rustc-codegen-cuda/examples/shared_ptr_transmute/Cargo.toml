[package]
name = "shared_ptr_transmute"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Mark as standalone crate (not part of parent workspace)
[workspace]

# Regression test for issue #874: `core::mem::transmute` on a value that
# is a shared-memory (addrspace(3)) pointer. Scalar forms bridge through
# the CUDA generic address space: pointer -> usize genericizes before
# ptrtoint, usize -> pointer re-enters through inttoptr-to-generic plus
# addrspacecast, and pointer -> pointer is a direct addrspacecast.
# Build with:
#   cargo oxide run shared_ptr_transmute

[dependencies]
# Device-side intrinsics (thread indexing, barriers, etc.)
cuda-device = { path = "../../../cuda-device" }

# Host-side utilities (CudaKernel trait, etc.)
cuda-host = { path = "../../../cuda-host" }

# Host-side CUDA runtime
cuda-core = "0.3.1"
