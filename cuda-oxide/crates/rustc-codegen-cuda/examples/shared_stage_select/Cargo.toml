[package]
name = "shared_stage_select"
version = "0.1.0"
edition = "2024"
authors = ["Nihal Pasham <nihalp@nvidia.com>"]
license = "Apache-2.0"

# Mark as standalone crate (not part of parent workspace)
[workspace]

# Regression example: a runtime `match` selecting per-stage shared-memory
# buffers must not become a `.global` lookup table of `.shared` addresses.
# Build with:
#   cargo oxide run shared_stage_select

[dependencies]
cuda-device = { path = "../../../cuda-device" }
cuda-host = { path = "../../../cuda-host" }
cuda-core = "0.3.1"
