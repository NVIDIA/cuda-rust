[package]
name = "tuple_field_lookup"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"

# Mark as standalone crate (not part of parent workspace)
[workspace]

# Measures reading one field of a tuple array element, which used to copy the
# whole array to a stack slot first. Build with:
#   cargo oxide run tuple_field_lookup

[dependencies]
# Device-side intrinsics (thread indexing, constant memory, etc.)
cuda-device = { path = "../../../cuda-device" }

# Host-side utilities (CudaKernel trait, etc.)
cuda-host = { path = "../../../cuda-host" }

# Host-side CUDA runtime
cuda-core = "0.3.1"
