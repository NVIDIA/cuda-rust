[package]
name = "unchecked_indexing"
version = "0.1.0"
edition = "2024"
authors = ["Nihal Pasham <nihalp@nvidia.com>"]
license = "Apache-2.0"

# Mark as standalone crate (not part of parent workspace)
[workspace]

# Demonstrates the opt-in bounds-check elision switch:
#   #[kernel(unchecked_indexing)]  /  CUDA_OXIDE_UNCHECKED_INDEXING=1
# Build with:
#   cargo oxide run unchecked_indexing

[dependencies]
# Device-side intrinsics (thread indexing, barriers, etc.)
cuda-device = { path = "../../../cuda-device" }

# Host-side utilities (CudaKernel trait, etc.)
cuda-host = { path = "../../../cuda-host" }

# Host-side CUDA runtime
cuda-core = "0.3.1"
ptx-parse = { path = "../../../ptx-parse" }
