<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" width="1240" height="740" role="img"
  aria-label="Static tile library flow: Left column builds relu.tilelib from #[tile_export], middle column compiles the Tile caller to prog.tilebc, and right column links both in tileiras to produce kernel.cubin">
<style>
  :root, svg {
  --bg: #f4f6f8; --fg: #1a232e; --muted: #5d6b7a; --line: #9aa7b4; --panel: #ffffff;
  --meta: #0e7c72; --meta-fill: #d9f3ef; --code: #b4560a; --code-fill: #fdebd2;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
 }
  @media (prefers-color-scheme: dark) { :root, svg {
  --bg: #0f151b; --fg: #e4ebf2; --muted: #9fb0c0; --line: #4d5b6a; --panel: #171f28;
  --meta: #5fe3d2; --meta-fill: #0f3a37; --code: #f6b544; --code-fill: #3b2a0c;
 } }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" style="fill: var(--fg)"/>
  </marker>
</defs>

<rect x="0" y="0" width="1240" height="740" style="fill: var(--bg)"/>

<!-- Title & Subtitle -->
<text x="40" y="34" text-anchor="start" style="font: 600 17px var(--sans); fill: var(--fg)">Static tile library: calling a fixed-size Rust SIMT function from a Tile kernel</text>
<text x="40" y="56" text-anchor="start" style="font: 400 12.5px var(--sans); fill: var(--muted)">1. cargo oxide tilelib packages code + metadata into .tilelib   ·   2. Tile frontend emits preview$call   ·   3. tileiras links both into one cubin</text>

<!-- Column Headers -->
<text x="40" y="92" text-anchor="start" style="font: 600 11px var(--sans); fill: var(--muted)">1 · RUST BUILD  (cargo oxide tilelib)</text>
<text x="445" y="92" text-anchor="start" style="font: 600 11px var(--sans); fill: var(--muted)">2 · TILE CALLER  (cuTile Python or Tile C++)</text>
<text x="840" y="92" text-anchor="start" style="font: 600 11px var(--sans); fill: var(--muted)">3 · TILE COMPILER  (tileiras, CUDA 13.5+)</text>

<!-- ================= COLUMN 1: RUST BUILD ================= -->
<rect x="40" y="108" width="350" height="62" rx="6" style="fill: var(--panel); stroke: var(--line); stroke-width: 1.2"/>
<text x="54" y="132" text-anchor="start" style="font: 600 12px var(--mono); fill: var(--meta)">#[tile_export(tile_shape = 128)]</text>
<text x="54" y="154" text-anchor="start" style="font: 400 12px var(--mono); fill: var(--fg)">pub fn relu(x: f32) -&gt; f32 { .. }</text>

<line x1="110" y1="170" x2="110" y2="204" marker-end="url(#arrow)" style="stroke: var(--fg); stroke-width: 1.4"/>
<text x="122" y="191" text-anchor="start" style="font: 400 11px var(--mono); fill: var(--muted)">cargo oxide tilelib relu --arch sm_120</text>

<!-- Group box for the 3 generated artifacts -->
<rect x="40" y="206" width="350" height="156" rx="6" stroke-dasharray="4 3" style="fill: var(--panel); stroke: var(--line); stroke-width: 1.2"/>
<text x="54" y="225" text-anchor="start" style="font: 600 10.5px var(--sans); fill: var(--muted)">EMITTED ARTIFACTS (3 FILES)</text>

<rect x="52" y="234" width="326" height="34" rx="5" style="fill: var(--meta-fill); stroke: var(--meta); stroke-width: 1.2"/>
<text x="64" y="255" text-anchor="start" style="font: 600 12px var(--mono); fill: var(--fg)">relu.iface.tilebc</text>
<text x="366" y="255" text-anchor="end" style="font: 400 11px var(--sans); fill: var(--muted)">declaration: @relu(tile&lt;128xf32&gt;)</text>

<rect x="52" y="274" width="326" height="34" rx="5" style="fill: var(--meta-fill); stroke: var(--meta); stroke-width: 1.2"/>
<text x="64" y="295" text-anchor="start" style="font: 600 12px var(--mono); fill: var(--fg)">relu.impl.tilebc</text>
<text x="366" y="295" text-anchor="end" style="font: 400 11px var(--sans); fill: var(--muted)">fragment map: 128 x 1 elem</text>

<rect x="52" y="314" width="326" height="34" rx="5" style="fill: var(--code-fill); stroke: var(--code); stroke-width: 1.2"/>
<text x="64" y="335" text-anchor="start" style="font: 600 12px var(--mono); fill: var(--fg)">relu.ltoir</text>
<text x="366" y="335" text-anchor="end" style="font: 400 11px var(--sans); fill: var(--muted)">SIMT code: void relu_impl(..)</text>

<line x1="110" y1="362" x2="110" y2="396" marker-end="url(#arrow)" style="stroke: var(--fg); stroke-width: 1.4"/>
<text x="122" y="384" text-anchor="start" style="font: 400 11px var(--mono); fill: var(--muted)">tileiras --preview-create-tile-lib</text>

<!-- Packaged .tilelib box -->
<rect x="40" y="398" width="350" height="96" rx="6" style="fill: var(--panel); stroke: var(--line); stroke-width: 1.6"/>
<text x="54" y="420" text-anchor="start" style="font: 600 12.5px var(--mono); fill: var(--fg)">relu.tilelib</text>
<text x="376" y="420" text-anchor="end" style="font: 400 11px var(--sans); fill: var(--muted)">packaged static library</text>

<rect x="54" y="432" width="8" height="12" rx="2" style="fill: var(--meta)"/>
<text x="70" y="442" text-anchor="start" style="font: 400 11px var(--mono); fill: var(--fg)">.nvtlifc</text>
<text x="148" y="442" text-anchor="start" style="font: 400 11px var(--sans); fill: var(--muted)">interface declaration</text>

<rect x="54" y="452" width="8" height="12" rx="2" style="fill: var(--meta)"/>
<text x="70" y="462" text-anchor="start" style="font: 400 11px var(--mono); fill: var(--fg)">.nvtl.0</text>
<text x="148" y="462" text-anchor="start" style="font: 400 11px var(--sans); fill: var(--muted)">implementation &amp; fragmap</text>

<rect x="54" y="472" width="8" height="12" rx="2" style="fill: var(--code)"/>
<text x="70" y="482" text-anchor="start" style="font: 400 11px var(--mono); fill: var(--fg)">.nvtl.1</text>
<text x="148" y="482" text-anchor="start" style="font: 400 11px var(--sans); fill: var(--muted)">compiled LTOIR bitcode</text>


<!-- ================= COLUMN 2: TILE CALLER ================= -->
<rect x="445" y="108" width="340" height="78" rx="6" style="fill: var(--panel); stroke: var(--line); stroke-width: 1.2"/>
<text x="459" y="130" text-anchor="start" style="font: 600 11.5px var(--sans); fill: var(--fg)">Tile kernel call site</text>
<text x="459" y="150" text-anchor="start" style="font: 400 11px var(--mono); fill: var(--fg)">tp.foreign_call(symbol_name="relu", ...)</text>
<text x="459" y="168" text-anchor="start" style="font: 400 11px var(--mono); fill: var(--muted)">// or C++: relu(xs.load(0), ys.load(0))</text>

<line x1="615" y1="186" x2="615" y2="218" marker-end="url(#arrow)" style="stroke: var(--fg); stroke-width: 1.4"/>
<text x="627" y="206" text-anchor="start" style="font: 400 11px var(--sans); fill: var(--muted)">Tile frontend emits</text>

<rect x="445" y="220" width="340" height="60" rx="6" style="fill: var(--meta-fill); stroke: var(--meta); stroke-width: 1.2"/>
<text x="459" y="243" text-anchor="start" style="font: 600 12.5px var(--mono); fill: var(--fg)">prog.tilebc</text>
<text x="459" y="263" text-anchor="start" style="font: 400 11.5px var(--mono); fill: var(--fg)">preview$call @relu(%x, %out)</text>

<rect x="445" y="302" width="340" height="60" rx="6" stroke-dasharray="4 3" style="fill: var(--panel); stroke: var(--line); stroke-width: 1.2"/>
<text x="459" y="325" text-anchor="start" style="font: 400 11.5px var(--sans); fill: var(--muted)">The Tile frontend only emits preview$call @relu</text>
<text x="459" y="344" text-anchor="start" style="font: 400 11.5px var(--sans); fill: var(--muted)">and passes relu.tilelib to tileiras.</text>


<!-- ================= ARROWS INTO COLUMN 3 ================= -->
<!-- Arrow 1: prog.tilebc (Col 2) -> tileiras (Col 3) -->
<line x1="785" y1="250" x2="838" y2="250" marker-end="url(#arrow)" style="stroke: var(--fg); stroke-width: 1.4"/>
<text x="811" y="242" text-anchor="middle" style="font: 400 10.5px var(--sans); fill: var(--muted)">program</text>

<!-- Arrow 2: relu.tilelib (Col 1) -> tileiras (Col 3) -->
<line x1="390" y1="446" x2="838" y2="446" marker-end="url(#arrow)" style="stroke: var(--fg); stroke-width: 1.4"/>
<text x="615" y="436" text-anchor="middle" style="font: 400 11px var(--mono); fill: var(--muted)">-l relu.tilelib</text>


<!-- ================= COLUMN 3: TILE COMPILER ================= -->
<rect x="840" y="196" width="360" height="278" rx="6" style="fill: var(--panel); stroke: var(--line); stroke-width: 1.6"/>
<text x="854" y="220" text-anchor="start" style="font: 600 11.5px var(--mono); fill: var(--fg)">tileiras --preview=simt prog.tilebc</text>
<text x="854" y="238" text-anchor="start" style="font: 600 11.5px var(--mono); fill: var(--fg)">         -l relu.tilelib -o kernel.cubin</text>
<line x1="854" y1="250" x2="1186" y2="250" style="stroke: var(--line); stroke-width: 1"/>

<circle cx="866" cy="272" r="9" style="fill: var(--meta-fill); stroke: var(--meta); stroke-width: 1.2"/>
<text x="866" y="276" text-anchor="middle" style="font: 600 10.5px var(--sans); fill: var(--fg)">1</text>
<text x="884" y="272" text-anchor="start" style="font: 600 11.5px var(--sans); fill: var(--fg)">Read declaration (.nvtlifc)</text>
<text x="884" y="288" text-anchor="start" style="font: 400 11px var(--sans); fill: var(--muted)">Splices @relu into the Tile module</text>

<circle cx="866" cy="322" r="9" style="fill: var(--meta-fill); stroke: var(--meta); stroke-width: 1.2"/>
<text x="866" y="326" text-anchor="middle" style="font: 600 10.5px var(--sans); fill: var(--fg)">2</text>
<text x="884" y="322" text-anchor="start" style="font: 600 11.5px var(--sans); fill: var(--fg)">Match implementation (.nvtl.0)</text>
<text x="884" y="338" text-anchor="start" style="font: 400 11px var(--sans); fill: var(--muted)">Selects @relu_impl whose fragmap fits the call</text>

<circle cx="866" cy="372" r="9" style="fill: var(--meta-fill); stroke: var(--meta); stroke-width: 1.2"/>
<text x="866" y="376" text-anchor="middle" style="font: 600 10.5px var(--sans); fill: var(--fg)">3</text>
<text x="884" y="372" text-anchor="start" style="font: 600 11.5px var(--sans); fill: var(--fg)">Lower the Tile-to-SIMT boundary</text>
<text x="884" y="388" text-anchor="start" style="font: 400 11px var(--sans); fill: var(--muted)">Partitions tile into per-thread buffers &amp; calls relu_impl</text>

<circle cx="866" cy="422" r="9" style="fill: var(--code-fill); stroke: var(--code); stroke-width: 1.2"/>
<text x="866" y="426" text-anchor="middle" style="font: 600 10.5px var(--sans); fill: var(--fg)">4</text>
<text x="884" y="422" text-anchor="start" style="font: 600 11.5px var(--sans); fill: var(--fg)">Link device code (.nvtl.1 via nvJitLink)</text>
<text x="884" y="438" text-anchor="start" style="font: 400 11px var(--sans); fill: var(--muted)">Cross-module LTO of Tile code + relu.ltoir -&gt; SASS</text>

<line x1="1020" y1="474" x2="1020" y2="504" marker-end="url(#arrow)" style="stroke: var(--fg); stroke-width: 1.4"/>

<rect x="860" y="506" width="320" height="50" rx="6" style="fill: var(--code-fill); stroke: var(--code); stroke-width: 1.6"/>
<text x="1020" y="527" text-anchor="middle" style="font: 600 13px var(--mono); fill: var(--fg)">kernel.cubin</text>
<text x="1020" y="545" text-anchor="middle" style="font: 400 11px var(--sans); fill: var(--muted)">Tile kernel + Rust relu_impl linked in one binary</text>


<!-- ================= BOTTOM SUMMARY STRIP ================= -->
<line x1="40" y1="580" x2="1200" y2="580" style="stroke: var(--line); stroke-width: 1"/>

<text x="40" y="604" text-anchor="start" style="font: 600 11px var(--sans); fill: var(--muted)">METADATA vs. DEVICE CODE</text>
<rect x="40" y="618" width="10" height="14" rx="2" style="fill: var(--meta)"/>
<text x="58" y="630" text-anchor="start" style="font: 600 12px var(--mono); fill: var(--fg)">.tilebc</text>
<text x="124" y="630" text-anchor="start" style="font: 400 12px var(--sans); fill: var(--fg)">Tile IR metadata read by tileiras: names, tile shapes, fragment layouts, and sync scope.</text>
<text x="58" y="648" text-anchor="start" style="font: 400 11.5px var(--sans); fill: var(--muted)">Contains no device instructions. Generated by oxide-tilebc from #[tile_export].</text>

<rect x="40" y="666" width="10" height="14" rx="2" style="fill: var(--code)"/>
<text x="58" y="678" text-anchor="start" style="font: 600 12px var(--mono); fill: var(--fg)">.ltoir</text>
<text x="124" y="678" text-anchor="start" style="font: 400 12px var(--sans); fill: var(--fg)">Compiled NVVM bitcode finalized to SASS by nvJitLink at link time.</text>
<text x="58" y="696" text-anchor="start" style="font: 400 11.5px var(--sans); fill: var(--muted)">Opaque to the Tile frontend; produced by cuda-oxide's standard emit-ltoir pipeline.</text>

<text x="660" y="604" text-anchor="start" style="font: 600 11px var(--sans); fill: var(--muted)">GENERATED SIMT WRAPPER ABI</text>
<text x="660" y="630" text-anchor="start" style="font: 400 12px var(--mono); fill: var(--fg)">fn relu(x: f32) -&gt; f32</text>
<text x="826" y="630" text-anchor="start" style="font: 400 11.5px var(--sans); fill: var(--muted)">-&gt;</text>
<text x="850" y="630" text-anchor="start" style="font: 600 12px var(--mono); fill: var(--fg)">extern "C" fn relu_impl(x: f32, out: *mut f32)</text>
<text x="660" y="654" text-anchor="start" style="font: 400 11.5px var(--sans); fill: var(--muted)">• Read-only scalars (x: T) pass by value; &amp;T, &amp;mut T, and return values pass as pointers.</text>
<text x="660" y="674" text-anchor="start" style="font: 400 11.5px var(--sans); fill: var(--muted)">• Runs on hardware threads (threadIdx.x) per element (sync="none") or per warp (sync="warp").</text>
<text x="660" y="694" text-anchor="start" style="font: 400 11.5px var(--sans); fill: var(--muted)">• Operates in registers and local fragment buffers (no SharedArray allocations).</text>
</svg>
