<defs>
  <marker id="arr-dev" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path class="arrhead" d="M2 1L8 5L2 9"/>
  </marker>
</defs>

<rect class="bg" width="1040" height="470" rx="10"/>
<text class="title l" x="36" y="32">Track 1: Moving Development &amp; Repo Toolchains to Stable Rust</text>
<text class="ts l" x="36" y="54">Pins an official stable Rust release (`1.99.1`) in `cuda-oxide/rust-toolchain.toml` while keeping `rustc_private` and `rustc_public`.</text>

<!-- Top Row: Before -->
<text class="sec l" x="36" y="88">BEFORE · DAILY NIGHTLY PIN IN CUDA-OXIDE</text>
<rect class="k-coral" x="36" y="102" width="460" height="118" rx="8" stroke-width="0.9"/>
<text class="th tx-coral l" x="56" y="126">Nightly Pin in cuda-oxide/rust-toolchain.toml</text>
<line class="hair" x1="56" y1="142" x2="476" y2="142" stroke-width="0.8"/>
<text class="tm tx-coral l" x="56" y="164">Root + cutile-rs:  channel = "1.98.0" (Stable)</text>
<text class="tm tx-coral l" x="56" y="186">cuda-oxide/:       channel = "nightly-2026-10-11"</text>
<text class="ts tx-coral l" x="56" y="206">Result: daily snapshot drift and mid-cycle rustc churn.</text>

<line class="arr" x1="496" y1="161" x2="540" y2="161" marker-end="url(#arr-dev)"/>

<rect class="k-box" x="544" y="102" width="460" height="118" rx="8" stroke-width="0.9"/>
<text class="th tx-box l" x="564" y="126">Why Nightly Was Used Originally</text>
<line class="hair" x1="564" y1="142" x2="984" y2="142" stroke-width="0.8"/>
<text class="ts tx-box l" x="564" y="164">• Needed #![feature(rustc_private)] for rustc-codegen-cuda</text>
<text class="ts tx-box l" x="564" y="184">• Needed rustc_public (stable_mir) for mir-importer</text>
<text class="ts tx-box l" x="564" y="204">• Needed -Z codegen-backend and -Z mir-enable-passes</text>

<!-- Bottom Row: Unified Stable -->
<text class="sec l" x="36" y="252">NEW WORKFLOW · PINNED STABLE RELEASE (1.99.1)</text>

<rect class="k-teal" x="36" y="266" width="308" height="172" rx="8" stroke-width="0.9"/>
<text class="th tx-teal l" x="56" y="290">Step 1: Pin Stable Toolchain</text>
<line class="hair" x1="56" y1="306" x2="324" y2="306" stroke-width="0.8"/>
<rect class="k-box" x="56" y="318" width="268" height="58" rx="5" stroke-width="0.7"/>
<text class="tm tx-box l" x="68" y="336">channel = "1.99.1" # Stable!</text>
<text class="tm tx-box l" x="68" y="358">components = ["rustc-dev", ...]</text>
<text class="ts tx-teal l" x="56" y="398">Ships LLVM 23.1.1 with NVPTX.</text>
<text class="ts tx-teal l" x="56" y="418">librustc_public.rlib included!</text>

<line class="arr" x1="344" y1="352" x2="362" y2="352" marker-end="url(#arr-dev)"/>

<rect class="k-purple" x="366" y="266" width="308" height="172" rx="8" stroke-width="0.9"/>
<text class="th tx-purple l" x="386" y="290">Step 2: cargo-oxide Sets Env</text>
<line class="hair" x1="386" y1="306" x2="654" y2="306" stroke-width="0.8"/>
<rect class="k-box" x="386" y="318" width="268" height="58" rx="5" stroke-width="0.7"/>
<text class="tm tx-box l" x="398" y="336">cmd.env("RUSTC_BOOTSTRAP", "1")</text>
<text class="tm tx-box l" x="398" y="358">-Z codegen-backend=...</text>
<text class="ts tx-purple l" x="386" y="398">Works for both building the .so</text>
<text class="ts tx-purple l" x="386" y="418">and compiling kernel crates.</text>

<line class="arr" x1="674" y1="352" x2="692" y2="352" marker-end="url(#arr-dev)"/>

<rect class="k-amber" x="696" y="266" width="308" height="172" rx="8" stroke-width="0.9"/>
<text class="th tx-amber l" x="716" y="290">Step 3: 6-Week Release Cadence</text>
<line class="hair" x1="716" y1="306" x2="984" y2="306" stroke-width="0.8"/>
<rect class="k-box" x="716" y="318" width="268" height="58" rx="5" stroke-width="0.7"/>
<text class="tm tx-box l" x="728" y="336">1.99.1 -&gt; 1.100.0 -&gt; 1.101.0</text>
<text class="ts tx-box l" x="728" y="358">Vetted through 6 weeks of beta</text>
<text class="ts tx-amber l" x="716" y="398">No daily nightly regressions.</text>
<text class="ts tx-amber l" x="716" y="418">Same model as Microsoft UTC.</text>
</svg>
