<rect class="bg" width="1040" height="510" rx="10"/>
<text class="title l" x="36" y="32">The Ecosystem Playbook &amp; Why Stable rustc Already Has Everything We Need</text>
<text class="ts l" x="36" y="54">Official stable Rust releases ship the exact same backend hooks and rustc_public crates as nightly behind RUSTC_BOOTSTRAP=1.</text>

<!-- Left Half: Ecosystem -->
<text class="sec l" x="36" y="88">1 · WHAT OTHER RUST COMPILER / BACKEND PROJECTS DO</text>

<rect class="k-box" x="36" y="102" width="460" height="84" rx="8" stroke-width="0.9"/>
<text class="th tx-box l" x="54" y="124">A. Reimplement Frontend (rust-analyzer, cutile-rs)</text>
<text class="ts tx-box l" x="54" y="146">• Zero rustc code; custom parser + type solver on stable.</text>
<text class="ts tx-box l" x="54" y="166">• Works for IDEs, not codegen (no borrowck, mono, or LLVM).</text>

<rect class="k-amber" x="36" y="198" width="460" height="84" rx="8" stroke-width="0.9"/>
<text class="th tx-amber l" x="54" y="220">B. Out-of-Tree Nightly Pin (rust-gpu, Kani, Charon)</text>
<text class="ts tx-amber l" x="54" y="242">• Uses #![feature(rustc_private)] on a daily nightly pin.</text>
<text class="ts tx-amber l" x="54" y="262">• Pain point: users need nightly; daily builds can hit ICEs.</text>

<rect class="k-purple" x="36" y="294" width="460" height="84" rx="8" stroke-width="0.9"/>
<text class="th tx-purple l" x="54" y="316">C. In-Tree Upstream (rustc_codegen_cranelift / gcc)</text>
<text class="ts tx-purple l" x="54" y="338">• Lives inside rust-lang/rust; built by upstream Rust CI.</text>
<text class="ts tx-purple l" x="54" y="358">• Only possible if upstream Rust owns your target backend.</text>

<rect class="k-teal" x="36" y="390" width="460" height="94" rx="8" stroke-width="1.2"/>
<text class="th tx-teal l" x="54" y="412">D. Stable-Tag SDK Bundle (MS codegen_utc, Ferrocene)</text>
<text class="ts tx-teal l" x="54" y="434">• Uses the exact same CodegenBackend trait we use!</text>
<text class="ts tx-teal l" x="54" y="454">• Builds against a vetted STABLE release (e.g. 1.90 / 1.99)</text>
<text class="ts tx-teal l" x="54" y="472">  and ships rustc + .so + sysroot as one standalone bundle.</text>

<!-- Right Half: Inside Stable rustc -->
<text class="sec l" x="530" y="88">2 · WHAT IS ACTUALLY INSIDE AN OFFICIAL STABLE RUST RELEASE</text>

<rect class="dash" x="530" y="102" width="474" height="382" rx="10" stroke-width="1.2"/>
<text class="th tx-box l" x="550" y="128">Official rustup Stable Toolchain (e.g. 1.99.1)</text>

<!-- Gatekeeper box -->
<rect class="k-coral" x="550" y="148" width="434" height="68" rx="7" stroke-width="0.9"/>
<text class="th tx-coral l" x="568" y="170">Startup Gatekeeper in rustc</text>
<text class="tm tx-coral l" x="568" y="194">if channel == "nightly" || RUSTC_BOOTSTRAP == "1"</text>

<line class="arr" x1="767" y1="216" x2="767" y2="246" marker-end="url(#arr-eco)"/>
<text class="ts" x="838" y="232">Unlocks on Stable:</text>

<!-- Unlocked capabilities -->
<rect class="k-purple" x="550" y="250" width="434" height="62" rx="7" stroke-width="0.9"/>
<text class="th tx-purple l" x="568" y="271">1. Unstable Compiler Flags (-Z)</text>
<text class="tm tx-purple l" x="568" y="293">-Z codegen-backend=...  -Z mir-enable-passes=...</text>

<rect class="k-teal" x="550" y="324" width="434" height="68" rx="7" stroke-width="0.9"/>
<text class="th tx-teal l" x="568" y="345">2. rustc-dev Component (Ships on Stable rustup!)</text>
<text class="tm tx-teal l" x="568" y="366">librustc_driver.so + librustc_public.rlib</text>
<text class="ts tx-teal l" x="568" y="382">(Verified: rustc_public &amp; bridge come for free!)</text>

<rect class="k-amber" x="550" y="404" width="434" height="62" rx="7" stroke-width="0.9"/>
<text class="th tx-amber l" x="568" y="425">3. Scoped Feature Gate (-Z allow-features=...)</text>
<text class="ts tx-amber l" x="568" y="447">Unlocks rustc_private for us; user code stays stable.</text>
</svg>
