<defs>
  <marker id="arr-pkg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path class="arrhead" d="M2 1L8 5L2 9"/>
  </marker>
</defs>

<rect class="bg" width="1040" height="510" rx="10"/>
<text class="title l" x="36" y="32">Track 2: Bundling Everything for Users &amp; the CUDA Toolkit (Option B)</text>
<text class="ts l" x="36" y="54">Users never install rustc-dev or compile the backend. Everything ships prebuilt in one ~120 MB compressed package.</text>

<!-- Left Column: What stays in CI vs What ships -->
<text class="sec l" x="36" y="88">1 · MEASURED SIZE BREAKDOWN (x86_64-unknown-linux-gnu)</text>

<rect class="k-coral" x="36" y="102" width="468" height="106" rx="8" stroke-width="0.9"/>
<text class="th tx-coral l" x="56" y="126">Stays in NVIDIA CI Only (Not Shipped): ~1.15 GB</text>
<line class="hair" x1="56" y1="142" x2="484" y2="142" stroke-width="0.8"/>
<text class="tm tx-coral l" x="56" y="164">• rustc-dev (librustc_*.rlib compiler libs):  ~930 MB</text>
<text class="tm tx-coral l" x="56" y="186">• llvm-tools &amp; unstripped debug artifacts:    ~220 MB</text>

<line class="arr" x1="270" y1="208" x2="270" y2="238" marker-end="url(#arr-pkg)"/>
<text class="ts" x="355" y="224">CI builds &amp; strips bundle</text>

<rect class="k-teal" x="36" y="242" width="468" height="238" rx="8" stroke-width="1.1"/>
<text class="th tx-teal l" x="56" y="266">Shipped in CUDA Toolkit / Standalone Bundle</text>
<line class="hair" x1="56" y1="282" x2="484" y2="282" stroke-width="0.8"/>
<rect class="k-box" x="56" y="294" width="428" height="28" rx="5" stroke-width="0.7"/>
<text class="tm tx-box l" x="70" y="308">librustc_codegen_cuda.so</text>
<text class="tm tx-box r" x="470" y="308">34 MB (8.6 MB zst)</text>

<rect class="k-box" x="56" y="328" width="428" height="28" rx="5" stroke-width="0.7"/>
<text class="tm tx-box l" x="70" y="342">librustc_driver.so (frontend)</text>
<text class="tm tx-box r" x="470" y="342">159 MB (~42 MB zst)</text>

<rect class="k-box" x="56" y="362" width="428" height="28" rx="5" stroke-width="0.7"/>
<text class="tm tx-box l" x="70" y="376">libLLVM.so (host LLVM backend)</text>
<text class="tm tx-box r" x="470" y="376">199 MB (~52 MB zst)</text>

<rect class="k-box" x="56" y="396" width="428" height="28" rx="5" stroke-width="0.7"/>
<text class="tm tx-box l" x="70" y="410">Pre-encoded sysroot + bins</text>
<text class="tm tx-box r" x="470" y="410">61 MB (~17 MB zst)</text>

<text class="th tx-teal l" x="56" y="452">Total Bundle: ~453 MB on disk  |  ~120 MB compressed</text>

<!-- Right Column: How it runs & How we fix bugs -->
<text class="sec l" x="536" y="88">2 · ZERO-CONFIG USER FLOW &amp; BUG OWNERSHIP</text>

<rect class="k-purple" x="536" y="102" width="468" height="154" rx="8" stroke-width="0.9"/>
<text class="th tx-purple l" x="556" y="126">User Experience: Zero rustup or Nightly Setup</text>
<line class="hair" x1="556" y1="142" x2="984" y2="142" stroke-width="0.8"/>
<text class="tm tx-purple l" x="556" y="164">$ cargo oxide build</text>
<text class="ts tx-purple l" x="556" y="188">1. cargo-oxide points RUSTC at bundled cuda-oxide-rustc</text>
<text class="ts tx-purple l" x="556" y="208">2. Uses bundled sysroot (built with -Z always-encode-mir)</text>
<text class="ts tx-purple l" x="556" y="228">3. Emits host binary + embedded PTX/CUBIN in one pass</text>

<rect class="k-amber" x="536" y="274" width="468" height="206" rx="8" stroke-width="0.9"/>
<text class="th tx-amber l" x="556" y="298">How We Fix Bugs Without Maintaining a rustc Fork</text>
<line class="hair" x1="556" y1="314" x2="984" y2="314" stroke-width="0.8"/>
<rect class="k-box" x="556" y="326" width="428" height="62" rx="5" stroke-width="0.7"/>
<text class="th tx-box l" x="570" y="345">Bucket 1 (~95% of bugs): In cuda-oxide crates</text>
<text class="ts tx-box l" x="570" y="367">Fix in mir-importer/lower -&gt; ship 8.6 MB .so hotfix only.</text>

<rect class="k-box" x="556" y="398" width="428" height="62" rx="5" stroke-width="0.7"/>
<text class="th tx-box l" x="570" y="417">Bucket 2 (~5% of bugs): Upstream rustc passes</text>
<text class="ts tx-box l" x="570" y="439">Toggle pass flag in driver (-JumpThreading) or bump tag.</text>
</svg>
