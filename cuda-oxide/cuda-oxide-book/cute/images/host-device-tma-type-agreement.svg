<svg class="cute-rs-preview" xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
<title>Host and device TMA agreement through a shared Rust layout type</title>
<style>.cute-rs-preview text { dominant-baseline:central; text-anchor:middle } .cute-rs-preview .l { text-anchor:start } .cute-rs-preview .bg { fill:#faf9f5 } .cute-rs-preview .title { font-size:17px; font-weight:700; fill:#1e1e1e } .cute-rs-preview .th { font-size:14px; font-weight:600; fill:#1e1e1e } .cute-rs-preview .t { font-size:13px; fill:#2b2b2b } .cute-rs-preview .ts { font-size:12.5px; fill:#5c5c5c } .cute-rs-preview .tm { font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size:12px; font-weight:500 } .cute-rs-preview .k-box { fill:#f1efe9; stroke:#c8c5be } .cute-rs-preview .tx-box { fill:#1e1e1e } .cute-rs-preview .k-purple { fill:#ebe9fb; stroke:#7f77dd } .cute-rs-preview .tx-purple { fill:#3a3490 } .cute-rs-preview .k-teal { fill:#dff3ec; stroke:#3aa47f } .cute-rs-preview .tx-teal { fill:#1f5c47 } .cute-rs-preview .k-amber { fill:#fdeed3; stroke:#ef9f27 } .cute-rs-preview .tx-amber { fill:#6b4100 } .cute-rs-preview .arr { fill:none; stroke:#7b7b7b; stroke-width:1.5 } .cute-rs-preview .arrhead { fill:none; stroke:#7b7b7b; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round } @media (prefers-color-scheme: dark) { .cute-rs-preview .bg { fill:#1b1d23 } .cute-rs-preview .title, .cute-rs-preview .th { fill:#f5f6f8 } .cute-rs-preview .t { fill:#eceef2 } .cute-rs-preview .ts { fill:#cfd4de } .cute-rs-preview .k-box { fill:#2e323c; stroke:#5c6375 } .cute-rs-preview .tx-box { fill:#f5f6f8 } .cute-rs-preview .arr, .cute-rs-preview .arrhead { stroke:#b6bcc8 } .cute-rs-preview .k-purple { fill:#524e7d; stroke:#bab5f4 } .cute-rs-preview .tx-purple { fill:#f6f5ff } .cute-rs-preview .k-teal { fill:#346357; stroke:#7ed8bb } .cute-rs-preview .tx-teal { fill:#f0fdf8 } .cute-rs-preview .k-amber { fill:#735a3c; stroke:#f4c474 } .cute-rs-preview .tx-amber { fill:#fff8eb } }</style>
<defs><marker id="arrow-tma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrhead" d="M2 1L8 5L2 9"/></marker></defs>
<rect class="bg" width="1040" height="430" rx="10"/>
<text class="title l" x="36" y="34">One Rust layout type binds host TMA encoding to device TMA &amp; MMA</text>
<text class="ts l" x="36" y="56">Host and device never drift: both sides reference the same ComposedLayout&lt;Swizzle, Offset, Layout&gt; type definition.</text>

<!-- Shared Type Box at Top -->
<rect class="k-purple" x="180" y="82" width="680" height="78" rx="8" stroke-width="0.9"/>
<text class="th tx-purple" x="520" y="104">Shared Rust Layout Type (compiled for both host &amp; device)</text>
<rect class="k-box" x="216" y="118" width="608" height="30" rx="5" stroke-width="0.7"/>
<text class="tm tx-box" x="520" y="133">pub type ASmem = ComposedLayout&lt;Swizzle&lt;3, 3, 3&gt;, 0, RowMajor&lt;128, 64&gt;&gt;;</text>

<!-- Branches to Host and Device -->
<path class="arr" d="M340 160 V192" marker-end="url(#arrow-tma)"/>
<path class="arr" d="M700 160 V192" marker-end="url(#arrow-tma)"/>

<!-- Left: Host Encoder -->
<rect class="k-amber" x="36" y="198" width="452" height="196" rx="8" stroke-width="0.9"/>
<text class="th tx-amber l" x="56" y="222">Host (CPU) — Descriptor Encoding &amp; Launch</text>
<rect class="k-box" x="56" y="240" width="412" height="30" rx="5" stroke-width="0.7"/>
<text class="tm tx-box l" x="70" y="255">create_tensor_map_tiled::&lt;f16, ASmem&gt;(ptr, m, k, ...)</text>
<text class="ts tx-amber l" x="56" y="290">• Reads tile shape (128×64) and 128B swizzle from ASmem</text>
<text class="ts tx-amber l" x="56" y="312">• Validates base alignment &amp; calls cuTensorMapEncodeTiled</text>
<text class="ts tx-amber l" x="56" y="334">• Produces TensorMap&lt;f16, ASmem&gt; (128B, 64B-aligned)</text>
<text class="ts tx-amber l" x="56" y="366">Passed by value in launch params (no extra device alloc)</text>

<!-- Arrow from Host to Device #[grid_constant] -->
<line class="arr" x1="488" y1="255" x2="546" y2="255" marker-end="url(#arrow-tma)"/>
<text class="tm ts" x="517" y="240">128B</text>

<!-- Right: Device Kernel -->
<rect class="k-teal" x="552" y="198" width="452" height="196" rx="8" stroke-width="0.9"/>
<text class="th tx-teal l" x="572" y="222">Device (GPU) — Kernel &amp; Compile-Time Lowering</text>
<rect class="k-box" x="572" y="240" width="412" height="30" rx="5" stroke-width="0.7"/>
<text class="tm tx-box l" x="586" y="255">#[grid_constant] a: &amp;TensorMap&lt;f16, ASmem&gt;</text>
<rect class="k-box" x="572" y="278" width="412" height="30" rx="5" stroke-width="0.7"/>
<text class="tm tx-box l" x="586" y="293">Sm100SharedTile&lt;ASmem, OperandA&gt;</text>
<text class="ts tx-teal l" x="572" y="328">• Type system enforces matching ASmem on copy &amp; MMA</text>
<text class="ts tx-teal l" x="572" y="350">• mir-importer proves ASmem swizzle phase alignment</text>
<text class="ts tx-teal l" x="572" y="372">• Lowers to cute_nvgpu TMA &amp; tensor-core MMA ops</text>
</svg>
