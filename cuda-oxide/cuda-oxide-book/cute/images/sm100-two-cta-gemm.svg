<title>SM100 two-CTA GEMM combining cute-rs and ctm-rs</title>
<style>.cute-rs-preview text { dominant-baseline:central; text-anchor:middle } .cute-rs-preview .l { text-anchor:start } .cute-rs-preview .bg { fill:#faf9f5 } .cute-rs-preview .title { font-size:17px; font-weight:700; fill:#1e1e1e } .cute-rs-preview .sec { font-size:11px; font-weight:700; letter-spacing:0.05em; fill:#5c5c5c } .cute-rs-preview .th { font-size:14px; font-weight:600; fill:#1e1e1e } .cute-rs-preview .ts { font-size:12.5px; fill:#5c5c5c } .cute-rs-preview .tm { font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size:12px; font-weight:500 } .cute-rs-preview .k-box { fill:#f1efe9; stroke:#c8c5be } .cute-rs-preview .tx-box { fill:#1e1e1e } .cute-rs-preview .k-purple { fill:#ebe9fb; stroke:#7f77dd } .cute-rs-preview .tx-purple { fill:#3a3490 } .cute-rs-preview .k-teal { fill:#dff3ec; stroke:#3aa47f } .cute-rs-preview .tx-teal { fill:#1f5c47 } .cute-rs-preview .k-amber { fill:#fdeed3; stroke:#ef9f27 } .cute-rs-preview .tx-amber { fill:#6b4100 } .cute-rs-preview .dash { fill:none; stroke:#b8b4ac; stroke-dasharray:5 4 } .cute-rs-preview .arr { fill:none; stroke:#7b7b7b; stroke-width:1.5 } .cute-rs-preview .arrhead { fill:none; stroke:#7b7b7b; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round } @media (prefers-color-scheme: dark) { .cute-rs-preview .bg { fill:#1b1d23 } .cute-rs-preview .title, .cute-rs-preview .th { fill:#f5f6f8 } .cute-rs-preview .sec { fill:#b8beca } .cute-rs-preview .ts { fill:#cfd4de } .cute-rs-preview .k-box { fill:#2e323c; stroke:#5c6375 } .cute-rs-preview .tx-box { fill:#f5f6f8 } .cute-rs-preview .dash { stroke:#606675 } .cute-rs-preview .arr, .cute-rs-preview .arrhead { stroke:#b6bcc8 } .cute-rs-preview .k-purple { fill:#524e7d; stroke:#bab5f4 } .cute-rs-preview .tx-purple { fill:#f6f5ff } .cute-rs-preview .k-teal { fill:#346357; stroke:#7ed8bb } .cute-rs-preview .tx-teal { fill:#f0fdf8 } .cute-rs-preview .k-amber { fill:#735a3c; stroke:#f4c474 } .cute-rs-preview .tx-amber { fill:#fff8eb } }</style>
<defs><marker id="arrow-sm100" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrhead" d="M2 1L8 5L2 9"/></marker></defs>
<rect class="bg" width="1040" height="460" rx="10"/>
<text class="title l" x="36" y="34">Combining cute-rs and ctm-rs in one kernel (fp16_gemm_256x352_cute, SM100a)</text>
<text class="ts l" x="36" y="56">Teal boxes use cute-rs (dialect-cute); purple boxes use ctm-rs instruction primitives (dialect-nvvm) in the same Pliron module.</text>
<rect class="k-teal" x="36" y="88" width="298" height="226" rx="8" stroke-width="0.9"/>
<text class="sec l" x="56" y="110">TMA WARP (WARP 5)</text>
<text class="th tx-teal l" x="56" y="132">5-Stage Cluster TMA Load</text>
<rect class="k-box" x="56" y="150" width="258" height="32" rx="5" stroke-width="0.7"/><text class="tm tx-box" x="185" y="166">PipelineTmaUmma&lt;5, 77_824&gt;</text>
<rect class="k-box" x="56" y="190" width="258" height="32" rx="5" stroke-width="0.7"/><text class="tm tx-box" x="185" y="206">Sm100ClusterTmaCopy::copy</text>
<rect class="k-box" x="56" y="230" width="258" height="32" rx="5" stroke-width="0.7"/><text class="tm tx-box" x="185" y="246">ASmem (128×64) + B0/B1Smem</text>
<text class="ts tx-teal" x="185" y="286">All 32 lanes participate per CTA</text>
<line class="arr" x1="334" y1="200" x2="366" y2="200" marker-end="url(#arrow-sm100)"/>
<rect class="k-teal" x="371" y="88" width="298" height="226" rx="8" stroke-width="0.9"/>
<text class="sec l" x="391" y="110">MMA WARP (WARP 4, CTA 0)</text>
<text class="th tx-teal l" x="391" y="132">Paired 2-CTA MMA → TMEM</text>
<rect class="k-box" x="391" y="150" width="258" height="32" rx="5" stroke-width="0.7"/><text class="tm tx-box" x="520" y="166">Sm100TiledMma&lt;..., 192, 160&gt;</text>
<rect class="k-box" x="391" y="190" width="258" height="32" rx="5" stroke-width="0.7"/><text class="tm tx-box" x="520" y="206">256×192 fills A collector</text>
<rect class="k-box" x="391" y="230" width="258" height="32" rx="5" stroke-width="0.7"/><text class="tm tx-box" x="520" y="246">256×160 reuses A collector</text>
<text class="ts tx-teal" x="520" y="286">Accumulates in 512 TMEM columns</text>
<line class="arr" x1="669" y1="200" x2="701" y2="200" marker-end="url(#arrow-sm100)"/>
<rect class="k-teal" x="706" y="88" width="298" height="226" rx="8" stroke-width="0.9"/>
<text class="sec l" x="726" y="110">EPILOGUE WARPS (WARPS 0..3)</text>
<text class="th tx-teal l" x="726" y="132">TMEM → Shared C → TMA</text>
<rect class="k-box" x="726" y="150" width="258" height="32" rx="5" stroke-width="0.7"/><text class="tm tx-box" x="855" y="166">Sm100TmemEpilogue::&lt;CSmem&gt;</text>
<rect class="k-box" x="726" y="190" width="258" height="32" rx="5" stroke-width="0.7"/><text class="tm tx-box" x="855" y="206">11 × (128×32) slices + bias</text>
<rect class="k-box" x="726" y="230" width="258" height="32" rx="5" stroke-width="0.7"/><text class="tm tx-box" x="855" y="246">sm100::PipelineTmaStore&lt;2&gt;</text>
<text class="ts tx-teal" x="855" y="286">FP32 → FP16 rounded &amp; TMA stored</text>
<rect class="k-purple" x="36" y="338" width="968" height="94" rx="8" stroke-width="0.9"/>
<text class="th tx-purple l" x="56" y="362">ctm-rs Instruction Primitives in the Same Kernel (dialect-nvvm)</text>
<rect class="k-box" x="56" y="380" width="296" height="34" rx="5" stroke-width="0.7"/><text class="tm tx-box" x="204" y="397">cluster_ctarank() / warp_id()</text>
<rect class="k-box" x="372" y="380" width="296" height="34" rx="5" stroke-width="0.7"/><text class="tm tx-box" x="520" y="397">barrier::barrier_cta_sync + fences</text>
<rect class="k-box" x="688" y="380" width="296" height="34" rx="5" stroke-width="0.7"/><text class="tm tx-box" x="836" y="397">TmemGuard::&lt;..., 512, CtaGroup2&gt;</text>
</svg>
