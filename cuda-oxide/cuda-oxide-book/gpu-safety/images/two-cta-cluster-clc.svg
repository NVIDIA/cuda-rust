<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 385" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <style>
    :root, svg {
      --bg: #ffffff;
      --bg-stroke: #e2e8f0;
      --panel: #f8fafc;
      --panel-stroke: #cbd5e1;
      --box: #ffffff;
      --box-stroke: #cbd5e1;
      --fg: #0f172a;
      --text: #334155;
      --sub: #475569;
      --muted: #64748b;
      --green: #15803d;
      --green-text: #14532d;
      --green-sub: #166534;
      --green-soft: #f0fdf4;
      --green-border: #86efac;
      --blue: #2563eb;
      --blue-text: #1e3a8a;
      --blue-soft: #eff6ff;
      --blue-border: #93c5fd;
    }
    @media (prefers-color-scheme: dark) {
      :root, svg {
        --bg: #161b22;
        --bg-stroke: #30363d;
        --panel: #1e242c;
        --panel-stroke: #3d444d;
        --box: #13171d;
        --box-stroke: #3d444d;
        --fg: #f0f6fc;
        --text: #c9d1d9;
        --sub: #b1bac4;
        --muted: #8b949e;
        --green: #3fb950;
        --green-text: #7ee787;
        --green-sub: #56d364;
        --green-soft: #12261e;
        --green-border: #2ea043;
        --blue: #58a6ff;
        --blue-text: #a5d6ff;
        --blue-soft: #132238;
        --blue-border: #388bfd;
      }
    }
  </style>
  <defs>
    <marker id="arrow-g8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0.8 L 7.5 4 L 0 7.2 Z" style="fill: var(--green)"/>
    </marker>
    <marker id="arrow-b8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0.8 L 7.5 4 L 0 7.2 Z" style="fill: var(--blue)"/>
    </marker>
  </defs>

  <rect width="1080" height="385" rx="14" style="fill: var(--bg); stroke: var(--bg-stroke)" stroke-width="1.5"/>

  <text x="40" y="40" font-size="18" font-weight="700" style="fill: var(--fg)">2-CTA Cluster DSMEM Exchange &amp; Hardware Work-Stealing</text>
  <text x="40" y="62" font-size="13" style="fill: var(--muted)">Lean 4 proves partner CTA rank bounds (<tspan font-family="'Roboto Mono', monospace">rank ^ 1 &lt; 2</tspan>), cluster sync ordering, and 16-byte CLC responses.</text>

  <!-- CTA 0 -->
  <g transform="translate(36, 86)">
    <rect width="340" height="178" rx="10" style="fill: var(--panel); stroke: var(--panel-stroke)" stroke-width="1.5"/>
    <text x="170" y="28" text-anchor="middle" font-size="14.5" font-weight="700" style="fill: var(--fg)">Block 0 (CTA Rank 0)</text>
    <text x="170" y="48" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="11.5" style="fill: var(--blue)">peer = 0 ^ 1 = 1 (in bounds &lt; 2)</text>

    <rect x="22" y="64" width="296" height="44" rx="6" style="fill: var(--box); stroke: var(--box-stroke)"/>
    <text x="170" y="91" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="11.5" style="fill: var(--fg)">Stage LOCAL_TILE[tid]</text>

    <rect x="22" y="118" width="296" height="44" rx="6" style="fill: var(--blue-soft); stroke: var(--blue-border)"/>
    <text x="170" y="145" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="11" style="fill: var(--blue-text)">map_shared_rank(LOCAL_TILE, 1)</text>
  </g>

  <!-- Center Cluster Sync + DSMEM Link -->
  <g transform="translate(396, 86)">
    <rect width="288" height="178" rx="10" style="fill: var(--green-soft); stroke: var(--green)" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="144" y="34" text-anchor="middle" font-size="13.5" font-weight="700" style="fill: var(--green-text)">2-CTA CLUSTER LINK</text>
    <text x="144" y="58" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="11.5" style="fill: var(--green)">cluster::cluster_sync()</text>

    <line x1="24"  y1="96"  x2="264" y2="96"  style="stroke: var(--green)" stroke-width="2" marker-end="url(#arrow-g8)"/>
    <line x1="264" y1="120" x2="24"  y2="120" style="stroke: var(--green)" stroke-width="2" marker-end="url(#arrow-g8)"/>

    <text x="144" y="154" text-anchor="middle" font-size="11.5" style="fill: var(--green-sub)">Required before DSMEM read</text>
  </g>

  <!-- CTA 1 -->
  <g transform="translate(704, 86)">
    <rect width="340" height="178" rx="10" style="fill: var(--panel); stroke: var(--panel-stroke)" stroke-width="1.5"/>
    <text x="170" y="28" text-anchor="middle" font-size="14.5" font-weight="700" style="fill: var(--fg)">Block 1 (CTA Rank 1)</text>
    <text x="170" y="48" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="11.5" style="fill: var(--blue)">peer = 1 ^ 1 = 0 (in bounds &lt; 2)</text>

    <rect x="22" y="64" width="296" height="44" rx="6" style="fill: var(--box); stroke: var(--box-stroke)"/>
    <text x="170" y="91" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="11.5" style="fill: var(--fg)">Stage LOCAL_TILE[tid]</text>

    <rect x="22" y="118" width="296" height="44" rx="6" style="fill: var(--blue-soft); stroke: var(--blue-border)"/>
    <text x="170" y="145" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="11" style="fill: var(--blue-text)">map_shared_rank(LOCAL_TILE, 0)</text>
  </g>

  <!-- Bottom CLC Work-Stealing Bar -->
  <g transform="translate(36, 282)">
    <rect width="1008" height="76" rx="10" style="fill: var(--blue-soft); stroke: var(--blue-border)" stroke-width="1.5"/>
    <text x="28" y="31" font-size="13.5" font-weight="700" style="fill: var(--blue-text)">Hardware Work-Stealing (CLC):</text>
    <text x="28" y="54" font-size="12" style="fill: var(--text)">16-byte response (<tspan font-family="'Roboto Mono', monospace">SharedArray&lt;u64, 2, 16&gt;</tspan>) proved in bounds and awaited before reading.</text>

    <rect x="692" y="18" width="294" height="40" rx="6" style="fill: var(--box); stroke: var(--green-border)"/>
    <text x="839" y="43" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="11" font-weight="600" style="fill: var(--green-text)">expect_tx(16) -&gt; try_cancel -&gt; wait</text>
  </g>
</svg>
