<svg xmlns="http://www.w3.org/2000/svg" width="900" height="342" viewBox="0 0 900 342" role="img" aria-labelledby="title desc">
  <title id="title">Rust CuTe compilation through CUTLASS</title>
  <desc id="desc">Read left to right across the top, then right to left across the bottom. cute-rs layouts, tiles, and pipelines become dialect-cute operations. Common preparation and whole-module verification precede CUTLASS MLIR mapping into CuTe, CuTeNVGPU, and reviewed architecture leaves. The pinned libCutlassCompiler 4.7 produces a validated cubin embedded in the host artifact for CUDA launch.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="342" rx="12" fill="#f8fafc"/>
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 276 78 H 314"/>
    <path d="M 576 78 H 614"/>
    <path d="M 750 132 V 200"/>
    <path d="M 624 264 H 586"/>
    <path d="M 324 264 H 286"/>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5">
    <rect x="24" y="24" width="252" height="108" rx="9" fill="#eaf2fc"/>
    <rect x="324" y="24" width="252" height="108" rx="9" fill="#eaf2fc"/>
    <rect x="624" y="24" width="252" height="108" rx="9" fill="#eaf2fc"/>
    <rect x="624" y="210" width="252" height="108" rx="9" fill="#eef5f0"/>
    <rect x="324" y="210" width="252" height="108" rx="9" fill="#eef5f0"/>
    <rect x="24" y="210" width="252" height="108" rx="9" fill="#eef5f0"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle" fill="#172033">
    <g font-size="21" font-weight="600">
      <text x="150" y="60">cute-rs</text>
      <text x="450" y="60">dialect-cute</text>
      <text x="750" y="60">Prepare + verify</text>
      <text x="750" y="246">CUTLASS MLIR</text>
      <text x="450" y="246">libCutlassCompiler</text>
      <text x="150" y="246">Validated cubin</text>
    </g>
    <g font-size="16" fill="#334155">
      <text x="150" y="88">Rust layouts, tiles,</text>
      <text x="150" y="110">and pipelines</text>
      <text x="450" y="88">Semantic operations</text>
      <text x="750" y="88">Common preparation</text>
      <text x="750" y="110">Whole-module verification</text>
      <text x="750" y="274">CuTe / CuTeNVGPU</text>
      <text x="750" y="296">+ architecture leaves</text>
      <text x="450" y="274">Pinned version 4.7</text>
      <text x="150" y="274">Embedded host artifact</text>
      <text x="150" y="296">CUDA launch</text>
    </g>
  </g>
</svg>
