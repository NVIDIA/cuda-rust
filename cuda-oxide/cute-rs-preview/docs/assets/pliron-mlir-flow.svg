<svg xmlns="http://www.w3.org/2000/svg" width="840" height="672" viewBox="0 0 840 672" role="img" aria-labelledby="title desc">
  <title id="title">From Pliron operations to a GPU binary</title>
  <desc id="desc">Current CUTLASS backend, top to bottom: one Pliron module contains MIR, CuTe and NVVM operations. After shared preparation and safety verification, cuda-oxide-mlir-export applies its mapping rules and builds a checked target graph. Upstream pliron-mlir-interop prints its operations, regions, blocks and value connections. The pinned CUTLASS compiler produces a cubin which cuda-oxide validates and embeds for GPU execution.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#52647b"/>
    </marker>
  </defs>
  <rect width="840" height="672" rx="14" fill="#f8fafc"/>
  <text x="420" y="32" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#475569">Current CUTLASS backend</text>
  <g fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 420 148 V 172"/>
    <path d="M 420 268 V 292"/>
    <path d="M 420 508 V 532"/>
  </g>
  <g stroke="#8aa1bb" stroke-width="1.5">
    <rect x="88" y="52" width="664" height="96" rx="10" fill="#eaf2fc"/>
    <rect x="88" y="176" width="664" height="92" rx="10" fill="#eaf2fc"/>
    <rect x="88" y="296" width="664" height="212" rx="10" fill="#f1f5f9"/>
    <rect x="104" y="348" width="306" height="112" rx="8" fill="#eef5f0"/>
    <rect x="430" y="348" width="306" height="112" rx="8" fill="#eaf2fc"/>
    <rect x="88" y="536" width="664" height="104" rx="10" fill="#eef5f0"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle" fill="#172033">
    <g font-size="22" font-weight="600">
      <text x="420" y="89">One Pliron module</text>
      <text x="420" y="212">Prepare and verify</text>
      <text x="420" y="332">Translate to MLIR</text>
      <text x="420" y="574">CUTLASS compiler → GPU binary</text>
    </g>
    <g font-size="20" font-weight="600">
      <text x="257" y="380">cuda-oxide-mlir-export</text>
      <text x="583" y="380">pliron-mlir-interop</text>
    </g>
    <g font-size="17" fill="#334155">
      <text x="420" y="119">dialect-mir + dialect-cute + dialect-nvvm</text>
      <text x="420" y="241">Check types, layouts, and represented CuTe protocol state</text>
      <text x="257" y="414">Rust, CuTe, and GPU rules</text>
      <text x="257" y="440">Build a checked target graph</text>
      <text x="583" y="414">Generic MLIR syntax</text>
      <text x="583" y="440">Operations, regions, and SSA</text>
      <text x="420" y="490">Our target adapters use the upstream generic printer.</text>
      <text x="420" y="605">Compile MLIR; cuda-oxide validates and embeds the cubin</text>
    </g>
  </g>
</svg>
