[package]
name = "sm100_mla_decode_fp16_cute"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Paged SM100 FP16 MLA decode through CuTe Rust"

[workspace]

[dependencies]
ctm-rs = { path = "../../ctm-rs" }
cute-rs = { path = "../../cute-rs", features = ["host"] }
cuda-device = { path = "../../../crates/cuda-device" }
cuda-host = { path = "../../../crates/cuda-host" }
cuda-core = { path = "../../../../cuda-core", features = ["f16"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
