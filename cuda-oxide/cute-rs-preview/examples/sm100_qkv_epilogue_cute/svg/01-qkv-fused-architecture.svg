<svg class="qtts" xmlns="http://www.w3.org/2000/svg" width="680" height="525" viewBox="0 0 680 525" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
<title>One Fused QKV GEMM and Its Three Epilogue Paths</title>
<style>.qtts .bg { fill:#faf9f5 } .qtts .th { font-size:14px; font-weight:600; fill:#1e1e1e } .qtts .t { font-size:13px; fill:#2b2b2b } .qtts .ts { font-size:12px; fill:#5c5c5c } .qtts .k-box { fill:#f1efe9; stroke:#c8c5be } .qtts .tx-box { fill:#1e1e1e } .qtts .k-purple { fill:#ebe9fb; stroke:#7f77dd } .qtts .tx-purple { fill:#3a3490 } .qtts .k-teal { fill:#dff3ec; stroke:#3aa47f } .qtts .tx-teal { fill:#1f5c47 } .qtts .k-coral { fill:#fde7e2; stroke:#e0735c } .qtts .tx-coral { fill:#7d2f1f } .qtts .k-amber { fill:#fdeed3; stroke:#ef9f27 } .qtts .tx-amber { fill:#6b4100 } .qtts .k-gray { fill:#e8e6e0; stroke:#a9a69f } .qtts .tx-gray { fill:#2b2b2b } .qtts .dash { fill:none; stroke:#b8b4ac; stroke-dasharray:4 3 } .qtts .arr { fill:none; stroke:#7b7b7b; stroke-width:1.5 } .qtts .arrhead { fill:none; stroke:#7b7b7b; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round } @media (prefers-color-scheme: dark) { .qtts .bg { fill: #1b1d23 } .qtts .th { fill: #f5f6f8 } .qtts .t { fill: #eceef2 } .qtts .ts { fill: #cfd4de } .qtts .k-box { fill: #2e323c; stroke: #5c6375 } .qtts .tx-box { fill: #f5f6f8 } .qtts .dash { stroke: #606675 } .qtts .arr, .qtts .arrhead { stroke: #b6bcc8 } .qtts .k-purple { fill: #524e7d; stroke: #bab5f4 } .qtts .tx-purple { fill: #f6f5ff } .qtts .k-teal { fill: #346357; stroke: #7ed8bb } .qtts .tx-teal { fill: #f0fdf8 } .qtts .k-coral { fill: #6b443e; stroke: #f29b8a } .qtts .tx-coral { fill: #fff0ed } .qtts .k-amber { fill: #735a3c; stroke: #f4c474 } .qtts .tx-amber { fill: #fff8eb } .qtts .k-gray { fill: #414654; stroke: #7c8496 } .qtts .tx-gray { fill: #f2f4f7 } }</style>
<defs><marker id="arrow-01" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrhead" d="M2 1L8 5L2 9"/></marker></defs>
<rect class="bg" width="680" height="525" rx="10"/>

<text class="th" x="340" y="26" text-anchor="middle" dominant-baseline="central">Pre-Attention QKV Projection + Fused Epilogue (1 Kernel)</text>

<rect class="k-box" x="36" y="48" width="176" height="62" rx="8" stroke-width="0.75"/>
<text class="th tx-box" x="124" y="69" text-anchor="middle" dominant-baseline="central">Input Tokens X</text>
<text class="ts tx-box" x="124" y="90" text-anchor="middle" dominant-baseline="central">[M, 4096] (FP16)</text>

<text class="th" x="228" y="79" text-anchor="middle" dominant-baseline="central">×</text>

<rect class="k-purple" x="244" y="48" width="160" height="62" rx="6" stroke-width="0.75"/>
<text class="th tx-purple" x="324" y="69" text-anchor="middle" dominant-baseline="central">W_Q</text>
<text class="ts tx-purple" x="324" y="90" text-anchor="middle" dominant-baseline="central">[4096, 4096]</text>

<rect class="k-teal" x="412" y="48" width="112" height="62" rx="6" stroke-width="0.75"/>
<text class="th tx-teal" x="468" y="69" text-anchor="middle" dominant-baseline="central">W_K</text>
<text class="ts tx-teal" x="468" y="90" text-anchor="middle" dominant-baseline="central">[4096, 1024]</text>

<rect class="k-amber" x="532" y="48" width="112" height="62" rx="6" stroke-width="0.75"/>
<text class="th tx-amber" x="588" y="69" text-anchor="middle" dominant-baseline="central">W_V</text>
<text class="ts tx-amber" x="588" y="90" text-anchor="middle" dominant-baseline="central">[4096, 1024]</text>

<text class="ts" x="444" y="128" text-anchor="middle" dominant-baseline="central">Stacked W_qkv [4096, 6144] — 1 GEMM on 5th-Gen Tensor Cores</text>

<line class="arr" x1="340" y1="142" x2="340" y2="164" marker-end="url(#arrow-01)"/>

<rect class="dash" x="36" y="168" width="608" height="84" rx="10" stroke-width="1"/>
<text class="ts" x="340" y="188" text-anchor="middle" dominant-baseline="central">GEMM Output in Tensor Memory (TMEM, FP32) — [M, 6144] (0 HBM writes)</text>

<rect class="k-purple" x="60" y="204" width="212" height="36" rx="6" stroke-width="0.75"/>
<text class="th tx-purple" x="166" y="222" text-anchor="middle" dominant-baseline="central">Q (cols 0..4096)</text>

<rect class="k-teal" x="284" y="204" width="168" height="36" rx="6" stroke-width="0.75"/>
<text class="th tx-teal" x="368" y="222" text-anchor="middle" dominant-baseline="central">K (4096..5120)</text>

<rect class="k-amber" x="464" y="204" width="156" height="36" rx="6" stroke-width="0.75"/>
<text class="th tx-amber" x="542" y="222" text-anchor="middle" dominant-baseline="central">V (5120..6144)</text>

<line class="arr" x1="166" y1="252" x2="166" y2="276" marker-end="url(#arrow-01)"/>
<line class="arr" x1="368" y1="252" x2="368" y2="276" marker-end="url(#arrow-01)"/>
<line class="arr" x1="542" y1="252" x2="542" y2="276" marker-end="url(#arrow-01)"/>

<rect class="k-purple" x="60" y="280" width="212" height="58" rx="8" stroke-width="0.75"/>
<text class="th tx-purple" x="166" y="300" text-anchor="middle" dominant-baseline="central">1. RMSNorm (128)</text>
<text class="ts tx-purple" x="166" y="320" text-anchor="middle" dominant-baseline="central">32 heads × gamma_q</text>

<rect class="k-teal" x="284" y="280" width="168" height="58" rx="8" stroke-width="0.75"/>
<text class="th tx-teal" x="368" y="300" text-anchor="middle" dominant-baseline="central">1. RMSNorm (128)</text>
<text class="ts tx-teal" x="368" y="320" text-anchor="middle" dominant-baseline="central">8 heads × gamma_k</text>

<rect class="k-gray" x="464" y="280" width="156" height="58" rx="8" stroke-width="0.75"/>
<text class="th tx-gray" x="542" y="300" text-anchor="middle" dominant-baseline="central">1. Skip RMSNorm</text>
<text class="ts tx-gray" x="542" y="320" text-anchor="middle" dominant-baseline="central">8 heads unchanged</text>

<line class="arr" x1="166" y1="338" x2="166" y2="364" marker-end="url(#arrow-01)"/>
<line class="arr" x1="368" y1="338" x2="368" y2="364" marker-end="url(#arrow-01)"/>
<line class="arr" x1="542" y1="338" x2="542" y2="364" marker-end="url(#arrow-01)"/>

<rect class="k-coral" x="60" y="368" width="560" height="46" rx="8" stroke-width="0.75"/>
<text class="th tx-coral" x="340" y="391" text-anchor="middle" dominant-baseline="central">2. Hardware FP8 Quantization (cvt.rn.satfinite.e4m3x2.f32)</text>

<line class="arr" x1="194" y1="414" x2="194" y2="440" marker-end="url(#arrow-01)"/>
<line class="arr" x1="486" y1="414" x2="486" y2="440" marker-end="url(#arrow-01)"/>

<rect class="k-purple" x="60" y="444" width="268" height="60" rx="8" stroke-width="0.75"/>
<text class="th tx-purple" x="194" y="464" text-anchor="middle" dominant-baseline="central">3a. Store Q Contiguously</text>
<text class="ts tx-purple" x="194" y="485" text-anchor="middle" dominant-baseline="central">Q_out [M, 32, 128] (FP8 E4M3)</text>

<rect class="k-teal" x="352" y="444" width="268" height="60" rx="8" stroke-width="0.75"/>
<text class="th tx-teal" x="486" y="464" text-anchor="middle" dominant-baseline="central">3b. Scatter K &amp; V to Cache</text>
<text class="ts tx-teal" x="486" y="485" text-anchor="middle" dominant-baseline="central">KV_cache[slot[m], 8, 128] (FP8)</text>
</svg>
