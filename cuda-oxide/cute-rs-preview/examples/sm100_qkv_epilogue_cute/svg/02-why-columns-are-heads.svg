<svg class="qtts" xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
<title>Where Attention Heads Come From: Slicing One Output Row into 128-Wide Chunks</title>
<style>.qtts .bg { fill:#faf9f5 } .qtts .th { font-size:14px; font-weight:600; fill:#1e1e1e } .qtts .t { font-size:13px; fill:#2b2b2b } .qtts .ts { font-size:12px; fill:#5c5c5c } .qtts .k-box { fill:#f1efe9; stroke:#c8c5be } .qtts .tx-box { fill:#1e1e1e } .qtts .k-purple { fill:#ebe9fb; stroke:#7f77dd } .qtts .tx-purple { fill:#3a3490 } .qtts .k-teal { fill:#dff3ec; stroke:#3aa47f } .qtts .tx-teal { fill:#1f5c47 } .qtts .k-coral { fill:#fde7e2; stroke:#e0735c } .qtts .tx-coral { fill:#7d2f1f } .qtts .k-amber { fill:#fdeed3; stroke:#ef9f27 } .qtts .tx-amber { fill:#6b4100 } .qtts .k-gray { fill:#e8e6e0; stroke:#a9a69f } .qtts .tx-gray { fill:#2b2b2b } .qtts .dash { fill:none; stroke:#b8b4ac; stroke-dasharray:4 3 } .qtts .arr { fill:none; stroke:#7b7b7b; stroke-width:1.5 } .qtts .arrhead { fill:none; stroke:#7b7b7b; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round } @media (prefers-color-scheme: dark) { .qtts .bg { fill: #1b1d23 } .qtts .th { fill: #f5f6f8 } .qtts .t { fill: #eceef2 } .qtts .ts { fill: #cfd4de } .qtts .k-box { fill: #2e323c; stroke: #5c6375 } .qtts .tx-box { fill: #f5f6f8 } .qtts .dash { stroke: #606675 } .qtts .arr, .qtts .arrhead { stroke: #b6bcc8 } .qtts .k-purple { fill: #524e7d; stroke: #bab5f4 } .qtts .tx-purple { fill: #f6f5ff } .qtts .k-teal { fill: #346357; stroke: #7ed8bb } .qtts .tx-teal { fill: #f0fdf8 } .qtts .k-coral { fill: #6b443e; stroke: #f29b8a } .qtts .tx-coral { fill: #fff0ed } .qtts .k-amber { fill: #735a3c; stroke: #f4c474 } .qtts .tx-amber { fill: #fff8eb } .qtts .k-gray { fill: #414654; stroke: #7c8496 } .qtts .tx-gray { fill: #f2f4f7 } }</style>
<defs><marker id="arrow-02" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrhead" d="M2 1L8 5L2 9"/></marker></defs>
<rect class="bg" width="680" height="490" rx="10"/>

<text class="th" x="340" y="26" text-anchor="middle" dominant-baseline="central">Where "Heads" Come From: 6,144 Output Columns = 48 Slices of 128</text>

<rect class="k-box" x="36" y="48" width="608" height="62" rx="8" stroke-width="0.75"/>
<text class="th tx-box" x="340" y="69" text-anchor="middle" dominant-baseline="central">During the GEMM (X × W_qkv): One Flat Row of 6,144 Numbers</text>
<text class="ts tx-box" x="340" y="90" text-anchor="middle" dominant-baseline="central">Tensor Cores just multiply [M, 4096] × [4096, 6144] = [M, 6144]</text>

<line class="arr" x1="340" y1="110" x2="340" y2="134" marker-end="url(#arrow-02)"/>

<rect class="dash" x="36" y="138" width="608" height="202" rx="10" stroke-width="1"/>
<text class="th" x="340" y="160" text-anchor="middle" dominant-baseline="central">During the Epilogue: Every 128 Columns Is 1 Attention Head</text>

<rect class="k-purple" x="56" y="182" width="96" height="56" rx="6" stroke-width="0.75"/>
<text class="th tx-purple" x="104" y="201" text-anchor="middle" dominant-baseline="central">Q Head 0</text>
<text class="ts tx-purple" x="104" y="221" text-anchor="middle" dominant-baseline="central">0 .. 128</text>

<rect class="k-purple" x="158" y="182" width="96" height="56" rx="6" stroke-width="0.75"/>
<text class="th tx-purple" x="206" y="201" text-anchor="middle" dominant-baseline="central">Q Head 1</text>
<text class="ts tx-purple" x="206" y="221" text-anchor="middle" dominant-baseline="central">128 .. 256</text>

<text class="th tx-purple" x="268" y="210" text-anchor="middle" dominant-baseline="central">···</text>

<rect class="k-purple" x="282" y="182" width="104" height="56" rx="6" stroke-width="0.75"/>
<text class="th tx-purple" x="334" y="201" text-anchor="middle" dominant-baseline="central">Q Head 31</text>
<text class="ts tx-purple" x="334" y="221" text-anchor="middle" dominant-baseline="central">3968 .. 4096</text>

<rect class="k-teal" x="396" y="182" width="114" height="56" rx="6" stroke-width="0.75"/>
<text class="th tx-teal" x="453" y="201" text-anchor="middle" dominant-baseline="central">8 K Heads</text>
<text class="ts tx-teal" x="453" y="221" text-anchor="middle" dominant-baseline="central">8 × 128 cols</text>

<rect class="k-amber" x="518" y="182" width="106" height="56" rx="6" stroke-width="0.75"/>
<text class="th tx-amber" x="571" y="201" text-anchor="middle" dominant-baseline="central">8 V Heads</text>
<text class="ts tx-amber" x="571" y="221" text-anchor="middle" dominant-baseline="central">8 × 128 cols</text>

<rect class="k-coral" x="56" y="254" width="454" height="68" rx="8" stroke-width="0.75"/>
<text class="th tx-coral" x="283" y="276" text-anchor="middle" dominant-baseline="central">Independent Per-Head RMSNorm (Width 128)</text>
<text class="ts tx-coral" x="283" y="298" text-anchor="middle" dominant-baseline="central">Each 128-number head normalizes only its own 128 numbers</text>

<rect class="k-gray" x="518" y="254" width="106" height="68" rx="8" stroke-width="0.75"/>
<text class="th tx-gray" x="571" y="276" text-anchor="middle" dominant-baseline="central">Skip Norm</text>
<text class="ts tx-gray" x="571" y="298" text-anchor="middle" dominant-baseline="central">8 V heads</text>

<line class="arr" x1="340" y1="340" x2="340" y2="364" marker-end="url(#arrow-02)"/>

<rect class="k-teal" x="36" y="368" width="608" height="98" rx="8" stroke-width="0.75"/>
<text class="th tx-teal" x="340" y="390" text-anchor="middle" dominant-baseline="central">Why 128-Wide Heads Make the Epilogue Fast (0 Shuffles / 0 SMEM)</text>
<text class="ts tx-teal" x="340" y="414" text-anchor="middle" dominant-baseline="central">Averaging all 4,096 columns at once would require cross-block sync</text>
<text class="ts tx-teal" x="340" y="436" text-anchor="middle" dominant-baseline="central">With 128-wide heads, 1 GPU thread holds all 128 numbers in registers</text>
</svg>
