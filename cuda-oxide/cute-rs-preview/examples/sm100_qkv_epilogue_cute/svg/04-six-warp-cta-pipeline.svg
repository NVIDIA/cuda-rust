<svg class="qtts" xmlns="http://www.w3.org/2000/svg" width="680" height="476" viewBox="0 0 680 476" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
<title>Inside One 2-CTA Cluster: 6-Warp (192-Thread) Persistent Pipeline on SM100</title>
<style>.qtts .th { font-size:14px; font-weight:600; fill:#1e1e1e } .qtts .t { font-size:13px; fill:#2b2b2b } .qtts .ts { font-size:12px; fill:#5c5c5c } .qtts .k-box { fill:#f7f6f3; stroke:#c8c5be } .qtts .tx-box { fill:#1e1e1e } .qtts .k-purple { fill:#ebe9fb; stroke:#7f77dd } .qtts .tx-purple { fill:#3a3490 } .qtts .k-teal { fill:#dff3ec; stroke:#3aa47f } .qtts .tx-teal { fill:#1f5c47 } .qtts .k-coral { fill:#fde7e2; stroke:#e0735c } .qtts .tx-coral { fill:#7d2f1f } .qtts .k-amber { fill:#fdeed3; stroke:#ef9f27 } .qtts .tx-amber { fill:#6b4100 } .qtts .k-gray { fill:#eeedea; stroke:#a9a69f } .qtts .tx-gray { fill:#333 } .qtts .dash { fill:none; stroke:#c8c5be; stroke-dasharray:4 3 } .qtts .arr { fill:none; stroke:#7b7b7b; stroke-width:1.5 } .qtts .arrhead { fill:none; stroke:#7b7b7b; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round } @media (prefers-color-scheme: dark) { .qtts .th { fill: #f2f2f2 } .qtts .t { fill: #e6e6e6 } .qtts .ts { fill: #b8b8b8 } .qtts .k-box { fill: #2a2a2e; stroke: #4a4a50 } .qtts .tx-box { fill: #f2f2f2 } .qtts .dash { stroke: #55555c } .qtts .arr, .qtts .arrhead { stroke: #a3a3a3 } .qtts .k-purple { fill: #3a3490; stroke: #9a93ea } .qtts .tx-purple { fill: #e9e7fb } .qtts .k-teal { fill: #1f5c47; stroke: #5fc6a0 } .qtts .tx-teal { fill: #dff3ec } .qtts .k-coral { fill: #7d2f1f; stroke: #f08b76 } .qtts .tx-coral { fill: #fde7e2 } .qtts .k-amber { fill: #6b4100; stroke: #f3b65a } .qtts .tx-amber { fill: #fdeed3 } .qtts .k-gray { fill: #3a3a3e; stroke: #77777d } .qtts .tx-gray { fill: #e6e6e6 } }</style>
<defs><marker id="arrow-04" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrhead" d="M2 1L8 5L2 9"/></marker></defs>

<text class="th" x="340" y="26" text-anchor="middle" dominant-baseline="central">Inside One 2-CTA Cluster: 6-Warp (192-Thread) Persistent Pipeline</text>

<rect class="dash" x="36" y="46" width="608" height="410" rx="10" stroke-width="1"/>
<text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central">74 persistent 2-CTA clusters · 128×256 tile · 197 KB SMEM · 512 TMEM cols</text>

<rect class="k-amber" x="60" y="88" width="560" height="78" rx="8" stroke-width="0.75"/>
<text class="th tx-amber" x="340" y="110" text-anchor="middle" dominant-baseline="central">Warp 5 — Cluster TMA Producer (40 Regs / Thread)</text>
<text class="ts tx-amber" x="340" y="131" text-anchor="middle" dominant-baseline="central">8-stage SMEM ring (8 KB XLayout + 16 KB WLayout = 24 KB per CTA)</text>
<text class="ts tx-amber" x="340" y="150" text-anchor="middle" dominant-baseline="central">Group-M (G = 8) L2 swizzle keeps 1,024 rows of X (8 MB) hot in L2</text>

<line class="arr" x1="340" y1="166" x2="340" y2="188" marker-end="url(#arrow-04)"/>

<rect class="k-coral" x="60" y="192" width="560" height="78" rx="8" stroke-width="0.75"/>
<text class="th tx-coral" x="340" y="214" text-anchor="middle" dominant-baseline="central">Warp 4 — 2-CTA tcgen05.mma Producer (40 Regs / Thread)</text>
<text class="ts tx-coral" x="340" y="235" text-anchor="middle" dominant-baseline="central">Issues MmaSs&lt;XLayout, WLayout, 128, 256, 64, 2&gt; (128 tokens × 2 heads)</text>
<text class="ts tx-coral" x="340" y="254" text-anchor="middle" dominant-baseline="central">Ping-pongs between TMEM_0 (cols 0..128) and TMEM_1 (cols 128..256)</text>

<path class="arr" d="M340 270 V284 H194 V298" marker-end="url(#arrow-04)"/>
<path class="arr" d="M340 284 H486 V298" marker-end="url(#arrow-04)"/>

<rect class="k-purple" x="60" y="302" width="268" height="134" rx="8" stroke-width="0.75"/>
<text class="th tx-purple" x="194" y="324" text-anchor="middle" dominant-baseline="central">Warps 0..1 — Head 2h</text>
<text class="ts tx-purple" x="194" y="346" text-anchor="middle" dominant-baseline="central">Reads TMEM rows 0..64 (128 cols)</text>
<text class="ts tx-purple" x="194" y="366" text-anchor="middle" dominant-baseline="central">Releases TMEM_i immediately</text>
<text class="ts tx-purple" x="194" y="386" text-anchor="middle" dominant-baseline="central">In-register RMSNorm + FP8 pack</text>
<text class="ts tx-purple" x="194" y="406" text-anchor="middle" dominant-baseline="central">4 × 256-bit no_allocate stores</text>

<rect class="k-teal" x="352" y="302" width="268" height="134" rx="8" stroke-width="0.75"/>
<text class="th tx-teal" x="486" y="324" text-anchor="middle" dominant-baseline="central">Warps 2..3 — Head 2h + 1</text>
<text class="ts tx-teal" x="486" y="346" text-anchor="middle" dominant-baseline="central">Reads TMEM rows 64..128 (128 cols)</text>
<text class="ts tx-teal" x="486" y="366" text-anchor="middle" dominant-baseline="central">Releases TMEM_i immediately</text>
<text class="ts tx-teal" x="486" y="386" text-anchor="middle" dominant-baseline="central">In-register RMSNorm + FP8 pack</text>
<text class="ts tx-teal" x="486" y="406" text-anchor="middle" dominant-baseline="central">4 × 256-bit no_allocate stores</text>
</svg>
