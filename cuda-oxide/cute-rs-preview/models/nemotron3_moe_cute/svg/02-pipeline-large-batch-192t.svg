<text class="th" x="340" y="26" text-anchor="middle" dominant-baseline="central">Regime 2: 6-Warp (192-Thread) Persistent Pipeline (B = 2,048 .. 16,384)</text>

<rect class="dash" x="36" y="46" width="608" height="390" rx="10" stroke-width="1"/>
<text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central">128 persistent CTAs · tile_n = 128 · 0 spills · 100% TMA / MMA / Epilogue overlap</text>

<rect class="k-amber" x="60" y="88" width="560" height="78" rx="8" stroke-width="0.75"/>
<text class="th tx-amber" x="340" y="110" text-anchor="middle" dominant-baseline="central">Warp 5 — Act128Pipeline Producer (4-Stage TMA)</text>
<text class="ts tx-amber" x="340" y="131" text-anchor="middle" dominant-baseline="central">Startup: loads stationary W (64 KB) + SFA (8 KB) once per CTA</text>
<text class="ts tx-amber" x="340" y="150" text-anchor="middle" dominant-baseline="central">Mainloop: 4-stage TMA ring via copy_tma_2d (32 KB B + 4 KB SFB/stage)</text>

<line class="arr" x1="340" y1="166" x2="340" y2="188" marker-end="url(#arrow-c2)"/>

<rect class="k-coral" x="60" y="192" width="560" height="78" rx="8" stroke-width="0.75"/>
<text class="th tx-coral" x="340" y="214" text-anchor="middle" dominant-baseline="central">Warp 4 — TiledMma128 (2-Stage TMEM Ping-Pong)</text>
<text class="ts tx-coral" x="340" y="235" text-anchor="middle" dominant-baseline="central">Startup: stages all 16 SharedWeightScales (Mkl) atoms into TMEM once</text>
<text class="ts tx-coral" x="340" y="254" text-anchor="middle" dominant-baseline="central">Mainloop: Op A = Tokens, Op B = Weights → 2-stage TMEM[0..1]</text>

<path class="arr" d="M340 270 V282 H194 V294" marker-end="url(#arrow-c2)"/>
<path class="arr" d="M340 282 H486 V294" marker-end="url(#arrow-c2)"/>

<rect class="k-teal" x="60" y="298" width="268" height="118" rx="8" stroke-width="0.75"/>
<text class="th tx-teal" x="194" y="320" text-anchor="middle" dominant-baseline="central">Warps 0..3 — FC1 Epilogue</text>
<text class="ts tx-teal" x="194" y="342" text-anchor="middle" dominant-baseline="central">2 × load_32x32b_x64 (128 threads)</text>
<text class="ts tx-teal" x="194" y="361" text-anchor="middle" dominant-baseline="central">releases tmem_free_bar[slot]</text>
<text class="ts tx-teal" x="194" y="380" text-anchor="middle" dominant-baseline="central">in-register ReLU² + NVFP4 (0 SMEM)</text>
<text class="ts tx-teal" x="194" y="399" text-anchor="middle" dominant-baseline="central">coalesced u128 + u32 global stores</text>

<rect class="k-purple" x="352" y="298" width="268" height="118" rx="8" stroke-width="0.75"/>
<text class="th tx-purple" x="486" y="320" text-anchor="middle" dominant-baseline="central">Warps 0..3 — FC2 Epilogue</text>
<text class="ts tx-purple" x="486" y="342" text-anchor="middle" dominant-baseline="central">2 × load_32x32b_x64 (128 threads)</text>
<text class="ts tx-purple" x="486" y="361" text-anchor="middle" dominant-baseline="central">releases tmem_free_bar[slot]</text>
<text class="ts tx-purple" x="486" y="380" text-anchor="middle" dominant-baseline="central">BF16 → Swizzle&lt;2,3,3&gt; (2 × 8 KB)</text>
<text class="ts tx-purple" x="486" y="399" text-anchor="middle" dominant-baseline="central">hardware 2D TMA Store (S2G)</text>

<path class="arr" d="M486 416 V446 H340 V458" marker-end="url(#arrow-c2)"/>

<rect class="k-box" x="60" y="462" width="560" height="58" rx="8" stroke-width="0.75"/>
<text class="th tx-box" x="340" y="482" text-anchor="middle" dominant-baseline="central">Kernel 4 — Top-4 Weighted Combine (1 Warp / Token)</text>
<text class="ts tx-box" x="340" y="502" text-anchor="middle" dominant-baseline="central">Coalesced StridedTensor&lt;u128&gt; loads across 4 expert rows → Output [B, 1024]</text>
