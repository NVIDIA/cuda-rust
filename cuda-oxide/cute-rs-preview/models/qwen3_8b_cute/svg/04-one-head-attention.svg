<svg class="qtts" xmlns="http://www.w3.org/2000/svg" width="680" height="365" viewBox="0 0 680 365" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
<title>Attention for one head, then merging the 32 heads</title>
<style>.qtts .th { font-size:14px; font-weight:600; fill:#1e1e1e } .qtts .t { font-size:13px; fill:#2b2b2b } .qtts .ts { font-size:12px; fill:#5c5c5c } .qtts .k-box { fill:#f7f6f3; stroke:#c8c5be } .qtts .tx-box { fill:#1e1e1e } .qtts .k-purple { fill:#ebe9fb; stroke:#7f77dd } .qtts .tx-purple { fill:#3a3490 } .qtts .k-teal { fill:#dff3ec; stroke:#3aa47f } .qtts .tx-teal { fill:#1f5c47 } .qtts .k-gray { fill:#eeedea; stroke:#a9a69f } .qtts .tx-gray { fill:#333 } .qtts .arr { fill:none; stroke:#7b7b7b; stroke-width:1.5 } .qtts .arrhead { fill:none; stroke:#7b7b7b; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round } @media (prefers-color-scheme: dark) { .qtts .th { fill: #f2f2f2 } .qtts .t { fill: #e6e6e6 } .qtts .ts { fill: #b8b8b8 } .qtts .k-box { fill: #2a2a2e; stroke: #4a4a50 } .qtts .tx-box { fill: #f2f2f2 } .qtts .arr, .qtts .arrhead { stroke: #a3a3a3 } .qtts .k-purple { fill: #3a3490; stroke: #9a93ea } .qtts .tx-purple { fill: #e9e7fb } .qtts .k-teal { fill: #1f5c47; stroke: #5fc6a0 } .qtts .tx-teal { fill: #dff3ec } .qtts .k-gray { fill: #3a3a3e; stroke: #77777d } .qtts .tx-gray { fill: #e6e6e6 } }</style>
<defs><marker id="arrow-04" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrhead" d="M2 1L8 5L2 9"/></marker></defs>
<rect class="k-purple" x="40" y="64" width="60" height="120" rx="4" stroke-width="0.5"/><text class="th tx-purple" x="70" y="124" text-anchor="middle" dominant-baseline="central">Qₕ</text>
<text class="t" x="118" y="124" text-anchor="middle" dominant-baseline="central">×</text>
<rect class="k-teal" x="136" y="94" width="120" height="60" rx="4" stroke-width="0.5"/><text class="th tx-teal" x="196" y="124" text-anchor="middle" dominant-baseline="central">Kᵀₕ/₄</text>
<text class="t" x="274" y="124" text-anchor="middle" dominant-baseline="central">=</text>
<rect class="k-gray" x="292" y="64" width="120" height="120" rx="4" stroke-width="0.5"/>
<polygon points="293,65 293,183 411,183" fill="#ef9f27" opacity="0.55"/>
<text class="ts" x="380" y="89" text-anchor="middle" dominant-baseline="central">masked</text>
<text class="t" x="334" y="152" text-anchor="middle" dominant-baseline="central">÷ √128</text>
<text class="ts" x="334" y="170" text-anchor="middle" dominant-baseline="central">softmax</text>
<text class="t" x="430" y="124" text-anchor="middle" dominant-baseline="central">×</text>
<rect class="k-teal" x="448" y="64" width="60" height="120" rx="4" stroke-width="0.5"/><text class="th tx-teal" x="478" y="124" text-anchor="middle" dominant-baseline="central">Vₕ/₄</text>
<text class="t" x="526" y="124" text-anchor="middle" dominant-baseline="central">=</text>
<rect class="k-purple" x="544" y="64" width="60" height="120" rx="4" stroke-width="0.5"/><text class="th tx-purple" x="574" y="124" text-anchor="middle" dominant-baseline="central">Oₕ</text>
<text class="ts" x="70" y="206" text-anchor="middle" dominant-baseline="central">[T, 128]</text>
<text class="ts" x="196" y="206" text-anchor="middle" dominant-baseline="central">[128, S]</text>
<text class="ts" x="352" y="206" text-anchor="middle" dominant-baseline="central">[T, S]</text>
<text class="ts" x="478" y="206" text-anchor="middle" dominant-baseline="central">[S, 128]</text>
<text class="ts" x="574" y="206" text-anchor="middle" dominant-baseline="central">[T, 128]</text>
<text class="ts" x="352" y="228" text-anchor="middle" dominant-baseline="central">shaded = visible keys (1..S); causal mask hides future keys</text>
<text class="ts" x="340" y="258" text-anchor="middle" dominant-baseline="central">Repeat for all 32 Q heads, then lay the 32 outputs side by side</text>
<rect class="k-purple" x="44" y="286" width="32" height="28" rx="2"/><text class="ts tx-purple" x="60" y="300" text-anchor="middle" dominant-baseline="central">O₀</text>
<rect class="k-purple" x="80" y="286" width="32" height="28" rx="2"/><text class="ts tx-purple" x="96" y="300" text-anchor="middle" dominant-baseline="central">O₁</text>
<rect class="k-purple" x="116" y="286" width="32" height="28" rx="2"/><text class="ts tx-purple" x="132" y="300" text-anchor="middle" dominant-baseline="central">O₂</text>
<rect class="k-purple" x="152" y="286" width="44" height="28" rx="2"/><text class="ts tx-purple" x="174" y="300" text-anchor="middle" dominant-baseline="central">…</text>
<rect class="k-purple" x="200" y="286" width="34" height="28" rx="2"/><text class="ts tx-purple" x="217" y="300" text-anchor="middle" dominant-baseline="central">O₃₀</text>
<rect class="k-purple" x="238" y="286" width="34" height="28" rx="2"/><text class="ts tx-purple" x="255" y="300" text-anchor="middle" dominant-baseline="central">O₃₁</text>
<text class="ts" x="158" y="334" text-anchor="middle" dominant-baseline="central">32 × 128 = [T, 4096]</text>
<line class="arr" x1="276" y1="300" x2="318" y2="300" marker-end="url(#arrow-04)"/>
<rect class="k-box" x="322" y="272" width="166" height="56" rx="8" stroke-width="0.5"/>
<text class="th tx-box" x="405" y="290" text-anchor="middle" dominant-baseline="central">Wo projection</text>
<text class="ts tx-box" x="405" y="308" text-anchor="middle" dominant-baseline="central">4096 → 4096</text>
<line class="arr" x1="488" y1="300" x2="520" y2="300" marker-end="url(#arrow-04)"/>
<rect class="k-box" x="524" y="272" width="120" height="56" rx="8" stroke-width="0.5"/>
<text class="th tx-box" x="584" y="290" text-anchor="middle" dominant-baseline="central">+ residual</text>
<text class="ts tx-box" x="584" y="308" text-anchor="middle" dominant-baseline="central">[T, 4096]</text>
</svg>