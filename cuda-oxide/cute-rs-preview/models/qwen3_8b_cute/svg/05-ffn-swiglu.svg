<svg class="qtts" xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
<title>Inside the SwiGLU FFN: 4096 to 12288 to 4096</title>
<style>.qtts .th { font-size:14px; font-weight:600; fill:#1e1e1e } .qtts .t { font-size:13px; fill:#2b2b2b } .qtts .ts { font-size:12px; fill:#5c5c5c } .qtts .k-box { fill:#f7f6f3; stroke:#c8c5be } .qtts .tx-box { fill:#1e1e1e } .qtts .k-purple { fill:#ebe9fb; stroke:#7f77dd } .qtts .tx-purple { fill:#3a3490 } .qtts .k-teal { fill:#dff3ec; stroke:#3aa47f } .qtts .tx-teal { fill:#1f5c47 } .qtts .k-coral { fill:#fde7e2; stroke:#e0735c } .qtts .tx-coral { fill:#7d2f1f } .qtts .k-amber { fill:#fdeed3; stroke:#ef9f27 } .qtts .tx-amber { fill:#6b4100 } .qtts .arr { fill:none; stroke:#7b7b7b; stroke-width:1.5 } .qtts .arrhead { fill:none; stroke:#7b7b7b; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round } @media (prefers-color-scheme: dark) { .qtts .th { fill: #f2f2f2 } .qtts .t { fill: #e6e6e6 } .qtts .ts { fill: #b8b8b8 } .qtts .k-box { fill: #2a2a2e; stroke: #4a4a50 } .qtts .tx-box { fill: #f2f2f2 } .qtts .arr, .qtts .arrhead { stroke: #a3a3a3 } .qtts .k-purple { fill: #3a3490; stroke: #9a93ea } .qtts .tx-purple { fill: #e9e7fb } .qtts .k-teal { fill: #1f5c47; stroke: #5fc6a0 } .qtts .tx-teal { fill: #dff3ec } .qtts .k-coral { fill: #7d2f1f; stroke: #f08b76 } .qtts .tx-coral { fill: #fde7e2 } .qtts .k-amber { fill: #6b4100; stroke: #f3b65a } .qtts .tx-amber { fill: #fdeed3 } }</style>
<defs><marker id="arrow-05" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrhead" d="M2 1L8 5L2 9"/></marker></defs>
<rect class="k-box" x="170" y="28" width="340" height="54" rx="8" stroke-width="0.5"/>
<text class="th tx-box" x="340" y="46" text-anchor="middle" dominant-baseline="central">Input X (after RMSNorm)</text>
<text class="ts tx-box" x="340" y="64" text-anchor="middle" dominant-baseline="central">[T, 4096] — one row per token</text>
<path class="arr" d="M340 82 V104 H180 V124" marker-end="url(#arrow-05)"/>
<path class="arr" d="M340 104 H500 V124" marker-end="url(#arrow-05)"/>
<rect class="k-coral" x="45" y="128" width="270" height="54" rx="8" stroke-width="0.5"/>
<text class="th tx-coral" x="180" y="146" text-anchor="middle" dominant-baseline="central">Gate = X · W_gate</text>
<text class="ts tx-coral" x="180" y="164" text-anchor="middle" dominant-baseline="central">4096 → 12288 · [T, 12288]</text>
<rect class="k-teal" x="365" y="128" width="270" height="54" rx="8" stroke-width="0.5"/>
<text class="th tx-teal" x="500" y="146" text-anchor="middle" dominant-baseline="central">Up = X · W_up</text>
<text class="ts tx-teal" x="500" y="164" text-anchor="middle" dominant-baseline="central">4096 → 12288 · [T, 12288]</text>
<line class="arr" x1="180" y1="182" x2="180" y2="210" marker-end="url(#arrow-05)"/>
<rect class="k-amber" x="60" y="214" width="240" height="48" rx="8" stroke-width="0.5"/>
<text class="th tx-amber" x="180" y="231" text-anchor="middle" dominant-baseline="central">SiLU(g) = g / (1 + e⁻ᵍ)</text>
<text class="ts tx-amber" x="180" y="249" text-anchor="middle" dominant-baseline="central">per number · [T, 12288]</text>
<path class="arr" d="M180 262 V294 H322" marker-end="url(#arrow-05)"/>
<path class="arr" d="M500 182 V294 H358" marker-end="url(#arrow-05)"/>
<circle class="k-box" cx="340" cy="294" r="14" stroke-width="0.5"/>
<text class="th" x="340" y="294" text-anchor="middle" dominant-baseline="central">⊙</text>
<text class="ts" x="362" y="318" text-anchor="start" dominant-baseline="central">elementwise [T, 12288]</text>
<line class="arr" x1="340" y1="308" x2="340" y2="334" marker-end="url(#arrow-05)"/>
<rect class="k-purple" x="160" y="338" width="360" height="54" rx="8" stroke-width="0.5"/>
<text class="th tx-purple" x="340" y="356" text-anchor="middle" dominant-baseline="central">Down = Product · W_down (12288 → 4096)</text>
<text class="ts tx-purple" x="340" y="374" text-anchor="middle" dominant-baseline="central">back to [T, 4096], then + skip residual</text>
<text class="ts" x="340" y="416" text-anchor="middle" dominant-baseline="central">In NVFP4 mode, Input X is quantized once and shared across Gate and Up</text>
</svg>