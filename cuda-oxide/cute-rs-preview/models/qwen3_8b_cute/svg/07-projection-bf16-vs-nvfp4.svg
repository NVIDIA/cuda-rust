<svg class="qtts" xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
<title>Inside one projection: BF16 vs. NVFP4 (E2M1 + E4M3)</title>
<style>.qtts .th { font-size:14px; font-weight:600; fill:#1e1e1e } .qtts .t { font-size:13px; fill:#2b2b2b } .qtts .ts { font-size:12px; fill:#5c5c5c } .qtts .k-box { fill:#f7f6f3; stroke:#c8c5be } .qtts .tx-box { fill:#1e1e1e } .qtts .k-purple { fill:#ebe9fb; stroke:#7f77dd } .qtts .tx-purple { fill:#3a3490 } .qtts .k-teal { fill:#dff3ec; stroke:#3aa47f } .qtts .tx-teal { fill:#1f5c47 } .qtts .k-coral { fill:#fde7e2; stroke:#e0735c } .qtts .tx-coral { fill:#7d2f1f } .qtts .k-amber { fill:#fdeed3; stroke:#ef9f27 } .qtts .tx-amber { fill:#6b4100 } .qtts .dash { fill:none; stroke:#c8c5be; stroke-dasharray:4 3 } .qtts .arr { fill:none; stroke:#7b7b7b; stroke-width:1.5 } .qtts .arrhead { fill:none; stroke:#7b7b7b; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round } @media (prefers-color-scheme: dark) { .qtts .th { fill: #f2f2f2 } .qtts .t { fill: #e6e6e6 } .qtts .ts { fill: #b8b8b8 } .qtts .k-box { fill: #2a2a2e; stroke: #4a4a50 } .qtts .tx-box { fill: #f2f2f2 } .qtts .dash { stroke: #55555c } .qtts .arr, .qtts .arrhead { stroke: #a3a3a3 } .qtts .k-purple { fill: #3a3490; stroke: #9a93ea } .qtts .tx-purple { fill: #e9e7fb } .qtts .k-teal { fill: #1f5c47; stroke: #5fc6a0 } .qtts .tx-teal { fill: #dff3ec } .qtts .k-coral { fill: #7d2f1f; stroke: #f08b76 } .qtts .tx-coral { fill: #fde7e2 } .qtts .k-amber { fill: #6b4100; stroke: #f3b65a } .qtts .tx-amber { fill: #fdeed3 } }</style>
<defs><marker id="arrow-07" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrhead" d="M2 1L8 5L2 9"/></marker></defs>
<text class="th" x="40" y="34" text-anchor="start" dominant-baseline="central">One group of 16 numbers along K inside a projection (X · Wᵀ):</text>
<!-- Mode A: BF16 -->
<rect class="dash" x="36" y="54" width="608" height="132" rx="8" stroke-width="0.5"/>
<text class="th tx-teal" x="52" y="76" text-anchor="start" dominant-baseline="central">Mode A · BF16 (16 bits per number = 32 bytes per 16 numbers)</text>
<rect class="k-teal" x="52" y="96" width="310" height="44" rx="6"/><text class="ts tx-teal" x="207" y="118" text-anchor="middle" dominant-baseline="central">16 × Bf16 weights (32 bytes)</text>
<line class="arr" x1="362" y1="118" x2="404" y2="118" marker-end="url(#arrow-07)"/>
<rect class="k-box" x="408" y="94" width="216" height="48" rx="6" stroke-width="0.5"/>
<text class="th tx-box" x="516" y="109" text-anchor="middle" dominant-baseline="central">m16n8k16 Tensor Core</text>
<text class="ts tx-box" x="516" y="128" text-anchor="middle" dominant-baseline="central">12.94 GiB across 36 blocks</text>
<text class="ts" x="52" y="164" text-anchor="start" dominant-baseline="central">Reads 12.94 GiB per token from DRAM → 69.8 tok/s decode (14.32 ms/tok)</text>
<!-- Mode B: NVFP4 -->
<rect class="dash" x="36" y="204" width="608" height="214" rx="8" stroke-width="0.5"/>
<text class="th tx-coral" x="52" y="226" text-anchor="start" dominant-baseline="central">Mode B · True NVFP4 (16 × 4-bit E2M1 + 1 × 8-bit E4M3 scale = 9 bytes)</text>
<rect class="k-coral" x="52" y="246" width="160" height="40" rx="6"/><text class="ts tx-coral" x="132" y="266" text-anchor="middle" dominant-baseline="central">16 × E2M1 (8 B)</text>
<text class="th" x="222" y="266" text-anchor="middle" dominant-baseline="central">×</text>
<rect class="k-amber" x="234" y="246" width="116" height="40" rx="6"/><text class="ts tx-amber" x="292" y="266" text-anchor="middle" dominant-baseline="central">1 × E4M3 (1 B)</text>
<line class="arr" x1="350" y1="266" x2="380" y2="266" marker-end="url(#arrow-07)"/>
<rect class="k-purple" x="384" y="242" width="240" height="48" rx="6" stroke-width="0.5"/>
<text class="th tx-purple" x="504" y="257" text-anchor="middle" dominant-baseline="central">cute.scaled_view_load</text>
<text class="ts tx-purple" x="504" y="276" text-anchor="middle" dominant-baseline="central">nvgpu.cvt_fpext (hardware)</text>
<rect class="k-box" x="52" y="306" width="572" height="58" rx="6" stroke-width="0.5"/>
<text class="th tx-box" x="338" y="325" text-anchor="middle" dominant-baseline="central">32-lane warp along K: 32 × (K=64 tile) = 1 KB coalesced read</text>
<text class="ts tx-box" x="338" y="345" text-anchor="middle" dominant-baseline="central">each lane accumulates FP32 → warp_sum_f32 across 32 lanes → 1 Bf16 output</text>
<text class="ts" x="52" y="392" text-anchor="start" dominant-baseline="central">Reads 3.64 GiB (3.56× less) → 114.0 tok/s decode (8.77 ms/tok) · 632.8 tok/s prefill</text>
</svg>