<svg class="qtts" xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
<title>The fix: for each decode shape, run the adder the reference runs</title>
<style>.qtts .th { font-size:11px; font-weight:600; fill:#5c5c5c; letter-spacing:.05em } .qtts .t { font-size:12.5px; fill:#1e1e1e } .qtts .ts { font-size:11.5px; fill:#5c5c5c } .qtts .tx-teal { fill:#1f5c47; font-weight:600 } .qtts .tx-coral { fill:#9a3b26; font-weight:600 } .qtts .tx-purple { fill:#3a3490; font-weight:600 } .qtts .k-coral { fill:#fde7e2; stroke:#e0735c; stroke-width:1.2 } .qtts .k-teal { fill:#dff3ec; stroke:#3aa47f; stroke-width:1.2 } .qtts .k-purple { fill:#ebe9fb; stroke:#7f77dd; stroke-width:1.2 } .qtts .rule { stroke:#c8c5be; stroke-width:1 } .qtts .wire { stroke:#1e1e1e; stroke-width:1.5; fill:none }</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs>
<text class="th" x="20" y="24">DECODE SHAPE (rows, K → N)</text>
<text class="th" x="300" y="24">BEFORE: WHAT WE RAN</text>
<text class="th" x="590" y="24">NOW: WHAT CUBLAS RUNS, SO WE RUN IT TOO</text>

<line class="rule" x1="20" y1="34" x2="880" y2="34"/>
<text class="t" x="20" y="62">1 row, most shapes</text>
<text class="ts" x="20" y="80">14 of 15 predictor steps, every Talker step</text>
<rect class="k-coral" x="300" y="46" width="250" height="42" rx="6"/><text class="t tx-coral" x="312" y="72">one tensor-core chain</text>
<line class="wire" x1="553" y1="67" x2="582" y2="67" marker-end="url(#ar)"/>
<rect class="k-teal" x="590" y="46" width="290" height="42" rx="6"/><text class="t tx-teal" x="602" y="72">16 FP32 FMA chains, merge 8·4·2·1</text>

<line class="rule" x1="20" y1="100" x2="880" y2="100"/>
<text class="t" x="20" y="128">1 row, 1024 → 1024</text>
<text class="ts" x="20" y="146">predictor K and V</text>
<rect class="k-coral" x="300" y="112" width="250" height="42" rx="6"/><text class="t tx-coral" x="312" y="138">one tensor-core chain</text>
<line class="wire" x1="553" y1="133" x2="582" y2="133" marker-end="url(#ar)"/>
<rect class="k-teal" x="590" y="112" width="290" height="42" rx="6"/><text class="t tx-teal" x="602" y="138">32 FP32 FMA chains, merge 16·8·4·2·1</text>

<line class="rule" x1="20" y1="166" x2="880" y2="166"/>
<text class="t" x="20" y="194">1 row, 6144 → 2048 · Talker down</text>
<text class="ts" x="20" y="212">2 rows, 3072 → 1024 · predictor down</text>
<rect class="k-coral" x="300" y="178" width="250" height="42" rx="6"/><text class="t tx-coral" x="312" y="204">one tensor-core chain</text>
<line class="wire" x1="553" y1="199" x2="582" y2="199" marker-end="url(#ar)"/>
<rect class="k-teal" x="590" y="178" width="300" height="42" rx="6"/><text class="t tx-teal" x="602" y="197">tensor-core chain per K slice</text><text class="ts tx-teal" x="602" y="213" font-size="11">slices 1280×4+1024 and 192×16, summed in order</text>

<line class="rule" x1="20" y1="232" x2="880" y2="232"/>
<text class="t" x="20" y="260">2 rows, other shapes</text>
<text class="ts" x="20" y="278">predictor step 0</text>
<rect class="k-purple" x="300" y="244" width="250" height="42" rx="6"/><text class="t tx-purple" x="312" y="270">one tensor-core chain</text>
<line class="wire" x1="553" y1="265" x2="582" y2="265" marker-end="url(#ar)"/>
<rect class="k-purple" x="590" y="244" width="290" height="42" rx="6"/><text class="t tx-purple" x="602" y="270">unchanged: already bit-identical</text>

<line class="rule" x1="20" y1="298" x2="880" y2="298"/>
<text class="t tx-teal" x="20" y="320">Checked on every saved reference input: 0 of 2,053,120 output values differ.</text>
