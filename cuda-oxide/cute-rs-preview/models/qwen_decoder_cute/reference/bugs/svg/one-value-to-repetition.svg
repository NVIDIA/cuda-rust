<svg class="qtts" xmlns="http://www.w3.org/2000/svg" width="900" height="130" viewBox="0 0 900 130" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
<title>How one wrongly rounded value becomes a repeating voice</title>
<style>.qtts .th { font-size:11px; font-weight:600; fill:#5c5c5c; letter-spacing:.04em } .qtts .t { font-size:12.5px; fill:#1e1e1e } .qtts .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size:12px; fill:#1e1e1e } .qtts .k-box { fill:#f7f6f3; stroke:#c8c5be; stroke-width:1.2 } .qtts .k-coral { fill:#fde7e2; stroke:#e0735c; stroke-width:1.2 } .qtts .wire { stroke:#1e1e1e; stroke-width:1.5; fill:none }</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs>
<rect class="k-coral" x="20" y="20" width="195" height="90" rx="6"/>
<text class="th" x="32" y="42">LAYER 3, STEP 6</text>
<text class="t" x="32" y="64">column 17 rounds to</text>
<text class="mono" x="32" y="84">−0.10791 not −0.10840</text>
<line class="wire" x1="218" y1="65" x2="246" y2="65" marker-end="url(#ar)"/>
<rect class="k-box" x="250" y="20" width="195" height="90" rx="6"/>
<text class="th" x="262" y="42">LAYER 4</text>
<text class="t" x="262" y="64">stores a different key/value</text>
<text class="t" x="262" y="84">at cache position 7</text>
<line class="wire" x1="448" y1="65" x2="476" y2="65" marker-end="url(#ar)"/>
<rect class="k-box" x="480" y="20" width="195" height="90" rx="6"/>
<text class="th" x="492" y="42">GROUP 11</text>
<text class="t" x="492" y="64">a tie breaks the other way:</text>
<text class="t" x="492" y="84">code 606 instead of 102</text>
<line class="wire" x1="678" y1="65" x2="706" y2="65" marker-end="url(#ar)"/>
<rect class="k-coral" x="710" y="20" width="170" height="90" rx="6"/>
<text class="th" x="722" y="42">FRAMES 15 TO 127</text>
<text class="t" x="722" y="64">Vivian repeats to the cap;</text>
<text class="t" x="722" y="84">only “Hello” is heard</text>
</svg>
