<svg class="qtts" xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
<title>The failing value: predictor layer 3, step 6, column 17</title>
<style>.qtts .th { font-size:13px; font-weight:600; fill:#1e1e1e } .qtts .t { font-size:11.5px; fill:#2b2b2b } .qtts .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size:12px; fill:#1e1e1e } .qtts .tx-teal { fill:#1f5c47; font-weight:600 } .qtts .tx-coral { fill:#9a3b26; font-weight:600 } .qtts .axis { stroke:#1e1e1e; stroke-width:2; fill:none } .qtts .dash { stroke:#1e1e1e; stroke-width:1; stroke-dasharray:3 3; fill:none } .qtts .funnel { stroke:#5c5c5c; stroke-width:1; stroke-dasharray:4 3; fill:none } .qtts .band-teal { fill:#dff3ec } .qtts .band-coral { fill:#fde7e2 } .qtts .dot-teal { fill:#3aa47f } .qtts .dot-coral { fill:#e0735c } .qtts .arrow-coral { stroke:#e0735c; stroke-width:1.5; fill:none }</style>
<defs><marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e0735c"/></marker></defs>

<g class="axis"><line x1="120" y1="60" x2="780" y2="60"/><line x1="120" y1="50" x2="120" y2="70"/><line x1="780" y1="50" x2="780" y2="70"/></g>
<line class="dash" x1="450" y1="48" x2="450" y2="72"/>
<g class="mono" text-anchor="middle"><text x="120" y="38">−0.10839844</text><text x="780" y="38">−0.10791016</text><text x="450" y="38">midpoint −0.1081543</text></g>
<g class="t" text-anchor="middle"><text x="120" y="90">BF16 value, correct</text><text x="780" y="90">BF16 value, wrong</text><text x="450" y="90">one BF16 step is 4.9e-4 wide; the zoom below covers 6e-7 of it</text></g>
<g class="funnel"><line x1="447" y1="72" x2="120" y2="150"/><line x1="453" y1="72" x2="780" y2="150"/></g>

<rect class="band-teal" x="120" y="150" width="330" height="100"/>
<rect class="band-coral" x="450" y="150" width="330" height="100"/>
<text class="tx-teal" x="128" y="167" font-size="11.5">rounds to −0.10839844</text>
<text class="tx-coral" x="772" y="167" font-size="11.5" text-anchor="end">rounds to −0.10791016</text>
<line class="axis" x1="120" y1="215" x2="780" y2="215"/>
<line class="dash" x1="450" y1="150" x2="450" y2="250"/>
<g class="mono" text-anchor="middle" font-size="11"><text x="120" y="268">−40 ulp</text><text x="450" y="268">midpoint</text><text x="780" y="268">+40 ulp</text></g>
<text class="t" x="780" y="286" text-anchor="middle">1 ulp = 7.5e-9, the FP32 spacing here</text>

<polygon points="403,207 410,215 403,223 396,215" fill="#1e1e1e"/>
<text class="th" x="394" y="200" text-anchor="end" font-size="11.5">exact sum, −5.65 ulp</text>
<circle class="dot-teal" cx="400" cy="215" r="5"/>
<text class="tx-teal" x="394" y="240" text-anchor="end" font-size="11.5">reference FP32 sum, 0.35 ulp from exact</text>
<line class="arrow-coral" x1="412" y1="215" x2="672" y2="215" marker-end="url(#arc)"/>
<circle class="dot-coral" cx="681" cy="215" r="6"/>
<text class="tx-coral" x="580" y="200" text-anchor="middle" font-size="11.5">our FP32 sum, 34 ulp toward zero after 128 truncations</text>
</svg>
