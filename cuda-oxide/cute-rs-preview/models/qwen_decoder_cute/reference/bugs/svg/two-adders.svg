<svg class="qtts" xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
<title>The two adders: one tensor-core chain versus sixteen FP32 FMA chains</title>
<style>.qtts .th { font-size:14px; font-weight:600; fill:#1e1e1e } .qtts .t { font-size:12px; fill:#2b2b2b } .qtts .ts { font-size:11.5px; fill:#5c5c5c } .qtts .tx-teal { fill:#1f5c47 } .qtts .tx-coral { fill:#9a3b26 } .qtts .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size:11px; fill:#2b2b2b } .qtts .wire { stroke:#1e1e1e; stroke-width:1.5; fill:none } .qtts .wire-thin { stroke:#1e1e1e; stroke-width:1.2; fill:none } .qtts .node-coral { fill:#fde7e2; stroke:#e0735c; stroke-width:1.5 } .qtts .node-teal { fill:#dff3ec; stroke:#3aa47f; stroke-width:1.5 } .qtts .plus-coral { fill:#9a3b26; font-size:13px; font-weight:600 } .qtts .plus-teal { fill:#1f5c47; font-size:12px; font-weight:600 } .qtts .merge { stroke:#3aa47f; stroke-width:1.5; fill:none }</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker>
<marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3aa47f"/></marker>
</defs>

<text class="th tx-coral" x="20" y="24">cuda-oxide before · one tensor-core chain</text>
<text class="th tx-teal" x="480" y="24">reference · cuBLAS FP32 FMA chains</text>

<line class="wire" x1="40" y1="130" x2="395" y2="130" marker-end="url(#ar)"/>
<g class="mono" text-anchor="middle">
<text x="75" y="68">k 0–15</text><text x="140" y="68">k 16–31</text><text x="205" y="68">k 32–47</text><text x="270" y="68">…</text><text x="335" y="68">k 2032–2047</text>
</g>
<g class="wire-thin">
<line x1="75" y1="74" x2="75" y2="112" marker-end="url(#ar)"/><line x1="140" y1="74" x2="140" y2="112" marker-end="url(#ar)"/><line x1="205" y1="74" x2="205" y2="112" marker-end="url(#ar)"/><line x1="335" y1="74" x2="335" y2="112" marker-end="url(#ar)"/>
</g>
<g class="node-coral"><circle cx="75" cy="130" r="11"/><circle cx="140" cy="130" r="11"/><circle cx="205" cy="130" r="11"/><circle cx="335" cy="130" r="11"/></g>
<g class="plus-coral" text-anchor="middle"><text x="75" y="134.5">+</text><text x="140" y="134.5">+</text><text x="205" y="134.5">+</text><text x="270" y="134.5">…</text><text x="335" y="134.5">+</text></g>
<text class="th" x="410" y="134" font-size="12">BF16</text>
<text class="t" x="40" y="170">one chain, 128 steps</text>
<text class="t tx-coral" x="40" y="188">each + aligns 17 terms to the largest, keeps 2 guard bits,</text>
<text class="t tx-coral" x="40" y="204">drops the rest and rounds toward zero</text>
<text class="t tx-coral" x="40" y="220">→ the sum drifts toward zero, one step at a time</text>

<g class="mono" text-anchor="end"><text x="548" y="63">k mod 16 = 0</text><text x="548" y="88">1</text><text x="548" y="113">2</text><text x="548" y="138">…</text><text x="548" y="163">15</text></g>
<g class="wire"><line x1="556" y1="59" x2="690" y2="59" marker-end="url(#ar)"/><line x1="556" y1="84" x2="690" y2="84" marker-end="url(#ar)"/><line x1="556" y1="109" x2="690" y2="109" marker-end="url(#ar)"/><line x1="556" y1="159" x2="690" y2="159" marker-end="url(#ar)"/></g>
<text class="ts tx-teal" x="623" y="52" text-anchor="middle">128 round-to-nearest adds</text>
<g class="merge"><path d="M692,59 L720,71 M692,84 L720,71 M692,109 L720,134 M692,159 L720,134 M722,71 L756,102 M722,134 L756,102 M758,102 L800,109"/><line x1="802" y1="109" x2="845" y2="109" marker-end="url(#art)"/></g>
<g class="node-teal"><circle cx="720" cy="71" r="9"/><circle cx="720" cy="134" r="9"/><circle cx="756" cy="102" r="9"/><circle cx="800" cy="109" r="9"/></g>
<g class="plus-teal" text-anchor="middle"><text x="720" y="75">+</text><text x="720" y="138">+</text><text x="756" y="106">+</text><text x="800" y="113">+</text></g>
<text class="th" x="858" y="113" font-size="12">BF16</text>
<text class="t" x="480" y="200">16 chains in parallel, each 128 terms long,</text>
<text class="t" x="480" y="216">merged by XOR offsets 8, 4, 2, 1</text>
<text class="t tx-teal" x="480" y="232">every add rounds to nearest → no drift</text>
</svg>
