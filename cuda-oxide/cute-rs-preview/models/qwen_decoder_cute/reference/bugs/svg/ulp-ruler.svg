<svg class="qtts" xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
<title>What an ulp is: one tick on the number ruler</title>
<style>.qtts .th { font-size:15px; font-weight:600; fill:#1e1e1e } .qtts .t { font-size:13px; fill:#2b2b2b } .qtts .ts { font-size:12px; fill:#5c5c5c } .qtts .tx-teal { fill:#1f5c47; font-weight:600 } .qtts .tx-coral { fill:#9a3b26; font-weight:600 } .qtts .ruler { stroke:#1e1e1e; stroke-width:2; fill:none } .qtts .tick { stroke:#1e1e1e; stroke-width:2 } .qtts .fine { stroke:#2b2b2b; stroke-width:1 } .qtts .faint { stroke:#5c5c5c; stroke-width:1; opacity:.5 } .qtts .brace { stroke:#1e1e1e; stroke-width:1.5; fill:none } .qtts .halfway { stroke:#1e1e1e; stroke-width:1.5; stroke-dasharray:4 3 } .qtts .band-teal { fill:#dff3ec } .qtts .band-coral { fill:#fde7e2 } .qtts .dot-teal { fill:#3aa47f } .qtts .dot-coral { fill:#e0735c } .qtts .arrow-coral { stroke:#e0735c; stroke-width:2; fill:none }</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3aa47f"/></marker>
<marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e0735c"/></marker>
</defs>

<text class="th" x="40" y="34">1 · A computer stores numbers on a ruler. It can only hold the ticks.</text>
<line class="ruler" x1="60" y1="100" x2="800" y2="100"/>
<g class="tick"><path d="M60,88 V112 M134,88 V112 M208,88 V112 M282,88 V112 M356,88 V112 M430,88 V112 M504,88 V112 M578,88 V112 M652,88 V112 M726,88 V112 M800,88 V112"/></g>
<path class="brace" d="M282,70 L282,62 L356,62 L356,70"/>
<text class="th" x="319" y="56" text-anchor="middle" font-size="13">1 ulp = the gap between two ticks</text>
<circle class="dot-teal" cx="560" cy="100" r="6"/>
<text class="tx-teal" x="560" y="134" text-anchor="middle" font-size="13">a real value</text>
<line x1="566" y1="84" x2="574" y2="84" stroke="#3aa47f" stroke-width="1.5" marker-end="url(#ar)"/>
<text class="tx-teal" x="610" y="78" font-size="12">snaps to the nearest tick</text>

<text class="th" x="40" y="190">2 · We add on a fine ruler and store on a coarse one.</text>
<text class="t" x="60" y="222">FP32, the ruler the sum is built on · tiny steps</text>
<line class="ruler" x1="60" y1="245" x2="800" y2="245" stroke-width="1.5"/>
<g class="fine"><path d="M60,238 V252 M66,238 V252 M72,238 V252 M78,238 V252 M84,238 V252 M90,238 V252 M96,238 V252 M102,238 V252 M108,238 V252 M114,238 V252 M120,238 V252 M126,238 V252 M132,238 V252 M138,238 V252 M144,238 V252 M150,238 V252 M156,238 V252 M162,238 V252 M168,238 V252 M174,238 V252 M180,238 V252 M186,238 V252 M192,238 V252 M198,238 V252 M204,238 V252 M210,238 V252 M216,238 V252 M222,238 V252 M228,238 V252 M234,238 V252 M240,238 V252 M246,238 V252 M252,238 V252 M258,238 V252 M264,238 V252 M270,238 V252 M276,238 V252 M282,238 V252 M288,238 V252 M294,238 V252 M300,238 V252 M306,238 V252 M312,238 V252 M318,238 V252 M324,238 V252 M330,238 V252 M336,238 V252 M342,238 V252 M348,238 V252 M354,238 V252 M360,238 V252 M366,238 V252 M372,238 V252 M378,238 V252 M384,238 V252 M390,238 V252 M396,238 V252 M402,238 V252 M408,238 V252 M414,238 V252 M420,238 V252 M426,238 V252 M432,238 V252 M438,238 V252 M444,238 V252 M450,238 V252 M456,238 V252 M462,238 V252 M468,238 V252 M474,238 V252 M480,238 V252 M486,238 V252 M492,238 V252 M498,238 V252 M504,238 V252 M510,238 V252 M516,238 V252 M522,238 V252 M528,238 V252 M534,238 V252 M540,238 V252 M546,238 V252 M552,238 V252 M558,238 V252 M564,238 V252 M570,238 V252 M576,238 V252 M582,238 V252 M588,238 V252 M594,238 V252 M600,238 V252 M606,238 V252 M612,238 V252 M618,238 V252 M624,238 V252 M630,238 V252 M636,238 V252 M642,238 V252 M648,238 V252 M654,238 V252 M660,238 V252 M666,238 V252 M672,238 V252 M678,238 V252 M684,238 V252 M690,238 V252 M696,238 V252 M702,238 V252 M708,238 V252 M714,238 V252 M720,238 V252 M726,238 V252 M732,238 V252 M738,238 V252 M744,238 V252 M750,238 V252 M756,238 V252 M762,238 V252 M768,238 V252 M774,238 V252 M780,238 V252 M786,238 V252 M792,238 V252 M798,238 V252"/></g>
<text class="t" x="60" y="292">BF16, the ruler the result is stored on · big steps</text>
<line class="ruler" x1="60" y1="315" x2="800" y2="315"/>
<g class="tick"><path d="M60,300 V330 M800,300 V330"/></g>
<path class="brace" d="M60,345 L60,352 L800,352 L800,345"/>
<text class="th" x="430" y="372" text-anchor="middle" font-size="13">one big step = 65,536 tiny steps</text>

<text class="th" x="40" y="420">3 · Zoom on the halfway line between two big ticks. Halfway decides which way a value snaps.</text>
<rect class="band-teal" x="60" y="436" width="370" height="100"/>
<rect class="band-coral" x="430" y="436" width="370" height="100"/>
<text class="tx-teal" x="68" y="454" font-size="12">← snaps to −0.1084, the correct tick</text>
<text class="tx-coral" x="792" y="454" font-size="12" text-anchor="end">snaps to −0.1079, the wrong tick →</text>
<line class="ruler" x1="60" y1="500" x2="800" y2="500" stroke-width="1.5"/>
<g class="faint"><path d="M60,494 V506 M69.25,494 V506 M78.5,494 V506 M87.75,494 V506 M97,494 V506 M106.25,494 V506 M115.5,494 V506 M124.75,494 V506 M134,494 V506 M143.25,494 V506 M152.5,494 V506 M161.75,494 V506 M171,494 V506 M180.25,494 V506 M189.5,494 V506 M198.75,494 V506 M208,494 V506 M217.25,494 V506 M226.5,494 V506 M235.75,494 V506 M245,494 V506 M254.25,494 V506 M263.5,494 V506 M272.75,494 V506 M282,494 V506 M291.25,494 V506 M300.5,494 V506 M309.75,494 V506 M319,494 V506 M328.25,494 V506 M337.5,494 V506 M346.75,494 V506 M356,494 V506 M365.25,494 V506 M374.5,494 V506 M383.75,494 V506 M393,494 V506 M402.25,494 V506 M411.5,494 V506 M420.75,494 V506 M430,494 V506 M439.25,494 V506 M448.5,494 V506 M457.75,494 V506 M467,494 V506 M476.25,494 V506 M485.5,494 V506 M494.75,494 V506 M504,494 V506 M513.25,494 V506 M522.5,494 V506 M531.75,494 V506 M541,494 V506 M550.25,494 V506 M559.5,494 V506 M568.75,494 V506 M578,494 V506 M587.25,494 V506 M596.5,494 V506 M605.75,494 V506 M615,494 V506 M624.25,494 V506 M633.5,494 V506 M642.75,494 V506 M652,494 V506 M661.25,494 V506 M670.5,494 V506 M679.75,494 V506 M689,494 V506 M698.25,494 V506 M707.5,494 V506 M716.75,494 V506 M726,494 V506 M735.25,494 V506 M744.5,494 V506 M753.75,494 V506 M763,494 V506 M772.25,494 V506 M781.5,494 V506 M790.75,494 V506 M800,494 V506"/></g>
<line class="halfway" x1="430" y1="436" x2="430" y2="536"/>
<text class="ts" x="430" y="552" text-anchor="middle">halfway · each small tick is one tiny step · 40 steps shown on each side</text>
<polygon points="377.7,492 384.7,500 377.7,508 370.7,500" fill="#1e1e1e"/>
<text class="th" x="369" y="482" text-anchor="end" font-size="13">true sum</text>
<circle class="dot-teal" cx="374.5" cy="500" r="5"/>
<text class="tx-teal" x="395" y="526" text-anchor="end" font-size="13">reference sum (on top of it)</text>
<line class="arrow-coral" x1="387.7" y1="500" x2="680" y2="500" marker-end="url(#arc)"/>
<circle class="dot-coral" cx="689" cy="500" r="6"/>
<text class="tx-coral" x="560" y="482" text-anchor="middle" font-size="13">our sum slid 34 tiny steps toward zero</text>
</svg>
