<svg class="qtts" xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
<title>Inside One 2-CTA Cluster: 7-Stage TMA Ring, 2-Stage TMEM &amp; CLC Work-Stealing on B200</title>
<style>.qtts .bg { fill:#faf9f5 } .qtts .th { font-size:14px; font-weight:600; fill:#1e1e1e } .qtts .t { font-size:13px; fill:#2b2b2b } .qtts .ts { font-size:12px; fill:#5c5c5c } .qtts .k-box { fill:#f1efe9; stroke:#c8c5be } .qtts .tx-box { fill:#1e1e1e } .qtts .k-purple { fill:#ebe9fb; stroke:#7f77dd } .qtts .tx-purple { fill:#3a3490 } .qtts .k-teal { fill:#dff3ec; stroke:#3aa47f } .qtts .tx-teal { fill:#1f5c47 } .qtts .k-coral { fill:#fde7e2; stroke:#e0735c } .qtts .tx-coral { fill:#7d2f1f } .qtts .k-amber { fill:#fdeed3; stroke:#ef9f27 } .qtts .tx-amber { fill:#6b4100 } .qtts .k-gray { fill:#e8e6e0; stroke:#a9a69f } .qtts .tx-gray { fill:#2b2b2b } .qtts .dash { fill:none; stroke:#b8b4ac; stroke-dasharray:4 3 } .qtts .arr { fill:none; stroke:#7b7b7b; stroke-width:1.5 } .qtts .arrhead { fill:none; stroke:#7b7b7b; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round } @media (prefers-color-scheme: dark) { .qtts .bg { fill: #1b1d23 } .qtts .th { fill: #f5f6f8 } .qtts .t { fill: #eceef2 } .qtts .ts { fill: #cfd4de } .qtts .k-box { fill: #2e323c; stroke: #5c6375 } .qtts .tx-box { fill: #f5f6f8 } .qtts .dash { stroke: #606675 } .qtts .arr, .qtts .arrhead { stroke: #b6bcc8 } .qtts .k-purple { fill: #524e7d; stroke: #bab5f4 } .qtts .tx-purple { fill: #f6f5ff } .qtts .k-teal { fill: #346357; stroke: #7ed8bb } .qtts .tx-teal { fill: #f0fdf8 } .qtts .k-coral { fill: #6b443e; stroke: #f29b8a } .qtts .tx-coral { fill: #fff0ed } .qtts .k-amber { fill: #735a3c; stroke: #f4c474 } .qtts .tx-amber { fill: #fff8eb } .qtts .k-gray { fill: #414654; stroke: #7c8496 } .qtts .tx-gray { fill: #f2f4f7 } }</style>
<defs><marker id="arrow-g1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrhead" d="M2 1L8 5L2 9"/></marker></defs>
<rect class="bg" width="680" height="490" rx="10"/>

<text class="th" x="340" y="26" text-anchor="middle" dominant-baseline="central">Inside One 2-CTA Cluster: 7-Stage TMA + 2-Stage TMEM + CLC Pipeline</text>

<rect class="dash" x="36" y="46" width="608" height="422" rx="10" stroke-width="1"/>
<text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central">2-CTA Cluster (cta_group::2) · 224 KiB SMEM (7 stages) · 512 TMEM cols (2 stages)</text>

<rect class="k-amber" x="60" y="88" width="268" height="84" rx="8" stroke-width="0.75"/>
<text class="th tx-amber" x="194" y="110" text-anchor="middle" dominant-baseline="central">Warp 4: 7-Stage TMA Producer</text>
<text class="ts tx-amber" x="194" y="131" text-anchor="middle" dominant-baseline="central">Streams 128×64 A &amp; B tiles (224 KiB)</text>
<text class="ts tx-amber" x="194" y="150" text-anchor="middle" dominant-baseline="central">Multicast cg2 + L2 N-band swizzle</text>

<rect class="k-gray" x="352" y="88" width="268" height="84" rx="8" stroke-width="0.75"/>
<text class="th tx-gray" x="486" y="110" text-anchor="middle" dominant-baseline="central">Overlapped CLC Work-Stealing</text>
<text class="ts tx-gray" x="486" y="131" text-anchor="middle" dominant-baseline="central">clc.try_cancel.multicast2</text>
<text class="ts tx-gray" x="486" y="150" text-anchor="middle" dominant-baseline="central">Fetches next tile while MMA runs</text>

<path class="arr" d="M194 172 V190 H340 V206" marker-end="url(#arrow-g1)"/>
<path class="arr" d="M486 172 V190 H340" />

<rect class="k-coral" x="60" y="210" width="560" height="82" rx="8" stroke-width="0.75"/>
<text class="th tx-coral" x="340" y="232" text-anchor="middle" dominant-baseline="central">Warp 5: 5th-Gen Tensor Core UMMA (tcgen05.mma.cta_group::2)</text>
<text class="ts tx-coral" x="340" y="253" text-anchor="middle" dominant-baseline="central">Ping-pongs FP32 accumulators across TMEM_0 (cols 0..255) &amp; TMEM_1 (cols 256..511)</text>
<text class="ts tx-coral" x="340" y="272" text-anchor="middle" dominant-baseline="central">Wave-tail tile balancing: switches to M256×N192 / M256×N224 on edge waves</text>

<line class="arr" x1="340" y1="292" x2="340" y2="316" marker-end="url(#arrow-g1)"/>

<rect class="k-teal" x="60" y="320" width="560" height="82" rx="8" stroke-width="0.75"/>
<text class="th tx-teal" x="340" y="342" text-anchor="middle" dominant-baseline="central">Warps 0..3: Register-Direct Vectorized Epilogue</text>
<text class="ts tx-teal" x="340" y="363" text-anchor="middle" dominant-baseline="central">tcgen05.ld.16x256b.x8 → releases TMEM stage immediately for next tile's MMA</text>
<text class="ts tx-teal" x="340" y="382" text-anchor="middle" dominant-baseline="central">cvt.rn.bf16x2.f32 → 128-bit vectorized global stores (U32x4 / STG.E.128)</text>

<rect class="k-purple" x="60" y="416" width="560" height="36" rx="6" stroke-width="0.75"/>
<text class="th tx-purple" x="340" y="434" text-anchor="middle" dominant-baseline="central">Sustains up to 2.121 PFLOP/s on NVIDIA B200 (102.7% of cuBLASLt top-8)</text>
</svg>
