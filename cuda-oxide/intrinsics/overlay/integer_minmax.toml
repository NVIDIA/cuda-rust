# Extended integer min/max forms from the PTX ISA 8.0 DPX surface.

schema = 62
family = "integer_minmax"

#
# These instructions have no NVVM intrinsic records in the pinned LLVM
# import: LLVM reaches them from generic `llvm.smin`/`llvm.smax` selection
# patterns, so they enter the catalog as PTX-native contracts, following the
# packed-ALU precedent. The plain scalar `s32` forms are deliberately absent:
# ordinary Rust `min`/`max` already lowers to native `min.s32`/`max.s32`,
# so only the `.relu` qualifier and the packed 16-bit pairs need an
# intrinsic surface.

[[intrinsic]]
id = "min_relu_s32"
abi_id = "i0987"
operation_key = "integer.minmax.s32.min.relu"
family = "integer_minmax"
source = { kind = "ptx_native", instruction = "min.relu.s32" }
rust_module = "int"
rust_name = "min_relu_s32"
rust_arguments = ["i32", "i32"]
rust_result = "i32"
safe = true
must_use = true
safe_allowlist_reason = "Scalar integer min/max has no memory, pointer, synchronization, or participation preconditions."
public_rust_path = "cuda_intrinsics::int::min_relu_s32"
compatibility_rust_paths = ["cuda_device::int::min_relu_s32"]
dialect_op_type = "MinReluS32Op"
dialect_op_name = "nvvm.min_relu_s32"
dialect_operands = ["i32", "i32"]
dialect_results = ["i32"]
pure = true
memory = "none"
convergent = false
execution_scope = "thread"
minimum_ptx = "8.0"
minimum_sm = "sm_90"
ptx_result = "i32"
targets = "all"
ptx_isa_version = "9.3"
ptx_isa_section = "9.7.1.13 Integer Arithmetic Instructions: min"
ptx_isa_url = "https://docs.nvidia.com/cuda/parallel-thread-execution/#integer-arithmetic-instructions-min"
lowering = "generated_integer_minmax_inline_ptx"
backend_lowerings = [
    { backend = "llvm_nvptx", mechanism = "inline_ptx", evidence_profile = "rust-llvm-23.1.0-16696adc" },
]
integer_minmax = { format = "s32", native_minimum_sm = 90, operation = "min", relu = true }
expected_ptx = { mnemonic = "min", modifiers = ["relu", "s32"], operands = [{ kind = "register" }, { kind = "register" }, { kind = "register" }] }
summary = "Computes the signed 32-bit minimum and clamps the result to 0 if negative."

