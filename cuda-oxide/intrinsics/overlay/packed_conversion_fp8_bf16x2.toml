#
# Reviewed bf16x2-to-packed-FP8 conversions.
#
# Pack only. The source arrives already packed in one register. The pinned
# LLVM import has no unscaled unpack record for bf16x2 (its reverse records are
# the block-scaled `scale_n2_ue8m0` forms); the PTX ISA 9.2 unpack forms are a
# later admission.

schema = 65
family = "packed_conversion"

[packed_conversion_fp8_bf16x2]
llvm_evidence_profile = "rust-llvm-23.1.3-aab11ee0"
libnvvm_evidence_profile = "cuda-13.3-libnvvm-13.3.73"
runtime_validation = "unexecuted"
fp8_formats = ["e4m3x2", "e5m2x2"]
relu_variants = true
product_count = 4
