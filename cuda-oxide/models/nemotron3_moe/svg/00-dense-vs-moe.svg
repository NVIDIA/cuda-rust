<svg class="qtts" xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
<title>Dense FFN vs. Mixture-of-Experts (MoE)</title>
<style>.qtts .th { font-size:14px; font-weight:600; fill:#1e1e1e } .qtts .t { font-size:13px; fill:#2b2b2b } .qtts .ts { font-size:12px; fill:#5c5c5c } .qtts .k-box { fill:#f7f6f3; stroke:#c8c5be } .qtts .tx-box { fill:#1e1e1e } .qtts .k-purple { fill:#ebe9fb; stroke:#7f77dd } .qtts .tx-purple { fill:#3a3490 } .qtts .k-teal { fill:#dff3ec; stroke:#3aa47f } .qtts .tx-teal { fill:#1f5c47 } .qtts .k-coral { fill:#fde7e2; stroke:#e0735c } .qtts .tx-coral { fill:#7d2f1f } .qtts .k-amber { fill:#fdeed3; stroke:#ef9f27 } .qtts .tx-amber { fill:#6b4100 } .qtts .k-gray { fill:#eeedea; stroke:#a9a69f } .qtts .tx-gray { fill:#333 } .qtts .dash { fill:none; stroke:#c8c5be; stroke-dasharray:4 3 } .qtts .arr { fill:none; stroke:#7b7b7b; stroke-width:1.5 } .qtts .arrhead { fill:none; stroke:#7b7b7b; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round } @media (prefers-color-scheme: dark) { .qtts .th { fill: #f2f2f2 } .qtts .t { fill: #e6e6e6 } .qtts .ts { fill: #b8b8b8 } .qtts .k-box { fill: #2a2a2e; stroke: #4a4a50 } .qtts .tx-box { fill: #f2f2f2 } .qtts .dash { stroke: #55555c } .qtts .arr, .qtts .arrhead { stroke: #a3a3a3 } .qtts .k-purple { fill: #3a3490; stroke: #9a93ea } .qtts .tx-purple { fill: #e9e7fb } .qtts .k-teal { fill: #1f5c47; stroke: #5fc6a0 } .qtts .tx-teal { fill: #dff3ec } .qtts .k-coral { fill: #7d2f1f; stroke: #f08b76 } .qtts .tx-coral { fill: #fde7e2 } .qtts .k-amber { fill: #6b4100; stroke: #f3b65a } .qtts .tx-amber { fill: #fdeed3 } .qtts .k-gray { fill: #3a3a3e; stroke: #77777d } .qtts .tx-gray { fill: #e6e6e6 } }</style>
<defs><marker id="arrow-00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrhead" d="M2 1L8 5L2 9"/></marker></defs>
<rect class="dash" x="18" y="20" width="290" height="430" rx="10" stroke-width="1"/>
<text class="th" x="163" y="44" text-anchor="middle" dominant-baseline="central">Dense FFN (e.g. Qwen3-8B)</text>
<text class="ts" x="163" y="64" text-anchor="middle" dominant-baseline="central">1 generalist brain · reads 100% of weights</text>
<rect class="k-box" x="63" y="88" width="200" height="44" rx="8" stroke-width="0.5"/>
<text class="th tx-box" x="163" y="104" text-anchor="middle" dominant-baseline="central">1 Token Row X</text>
<text class="ts tx-box" x="163" y="120" text-anchor="middle" dominant-baseline="central">[1, 4096]</text>
<line class="arr" x1="163" y1="132" x2="163" y2="168" marker-end="url(#arrow-00)"/>
<rect class="k-coral" x="43" y="172" width="240" height="168" rx="8" stroke-width="0.5"/>
<text class="th tx-coral" x="163" y="218" text-anchor="middle" dominant-baseline="central">1 Giant Monolithic FFN</text>
<text class="ts tx-coral" x="163" y="242" text-anchor="middle" dominant-baseline="central">Gate + Up + Down (4096 ↔ 12288)</text>
<text class="ts tx-coral" x="163" y="266" text-anchor="middle" dominant-baseline="central">Every token streams ALL weights</text>
<text class="ts tx-coral" x="163" y="290" text-anchor="middle" dominant-baseline="central">out of HBM memory</text>
<line class="arr" x1="163" y1="340" x2="163" y2="376" marker-end="url(#arrow-00)"/>
<rect class="k-box" x="63" y="380" width="200" height="48" rx="8" stroke-width="0.5"/>
<text class="th tx-box" x="163" y="397" text-anchor="middle" dominant-baseline="central">Output Row [1, 4096]</text>
<text class="ts tx-box" x="163" y="415" text-anchor="middle" dominant-baseline="central">30B capacity = 30B memory traffic</text>
<rect class="dash" x="328" y="20" width="334" height="430" rx="10" stroke-width="1"/>
<text class="th" x="495" y="44" text-anchor="middle" dominant-baseline="central">MoE FFN (Nemotron-3-Nano 30B-A3B)</text>
<text class="ts" x="495" y="64" text-anchor="middle" dominant-baseline="central">128 specialists · wakes only 6 per token (~5%)</text>
<rect class="k-box" x="395" y="88" width="200" height="44" rx="8" stroke-width="0.5"/>
<text class="th tx-box" x="495" y="104" text-anchor="middle" dominant-baseline="central">1 Token Row X</text>
<text class="ts tx-box" x="495" y="120" text-anchor="middle" dominant-baseline="central">[1, 2688]</text>
<line class="arr" x1="495" y1="132" x2="495" y2="156" marker-end="url(#arrow-00)"/>
<rect class="k-amber" x="375" y="160" width="240" height="44" rx="8" stroke-width="0.5"/>
<text class="th tx-amber" x="495" y="176" text-anchor="middle" dominant-baseline="central">Router ("Switchboard")</text>
<text class="ts tx-amber" x="495" y="192" text-anchor="middle" dominant-baseline="central">scores 128 experts → picks Top-6</text>
<line class="arr" x1="495" y1="204" x2="495" y2="228" marker-end="url(#arrow-00)"/>
<rect class="k-box" x="348" y="232" width="294" height="108" rx="8" stroke-width="0.5"/>
<rect class="k-gray" x="360" y="244" width="40" height="24" rx="4" stroke-width="0.5"/><text class="ts tx-gray" x="380" y="256" text-anchor="middle" dominant-baseline="central">E0</text>
<rect class="k-teal" x="406" y="244" width="40" height="24" rx="4" stroke-width="1"/><text class="th tx-teal" x="426" y="256" text-anchor="middle" dominant-baseline="central">E1</text>
<rect class="k-gray" x="452" y="244" width="40" height="24" rx="4" stroke-width="0.5"/><text class="ts tx-gray" x="472" y="256" text-anchor="middle" dominant-baseline="central">E2</text>
<rect class="k-gray" x="498" y="244" width="40" height="24" rx="4" stroke-width="0.5"/><text class="ts tx-gray" x="518" y="256" text-anchor="middle" dominant-baseline="central">E3</text>
<rect class="k-teal" x="544" y="244" width="40" height="24" rx="4" stroke-width="1"/><text class="th tx-teal" x="564" y="256" text-anchor="middle" dominant-baseline="central">E4</text>
<rect class="k-gray" x="590" y="244" width="40" height="24" rx="4" stroke-width="0.5"/><text class="ts tx-gray" x="610" y="256" text-anchor="middle" dominant-baseline="central">E5</text>
<rect class="k-teal" x="360" y="274" width="40" height="24" rx="4" stroke-width="1"/><text class="th tx-teal" x="380" y="286" text-anchor="middle" dominant-baseline="central">E6</text>
<rect class="k-gray" x="406" y="274" width="40" height="24" rx="4" stroke-width="0.5"/><text class="ts tx-gray" x="426" y="286" text-anchor="middle" dominant-baseline="central">E7</text>
<rect class="k-teal" x="452" y="274" width="40" height="24" rx="4" stroke-width="1"/><text class="th tx-teal" x="472" y="286" text-anchor="middle" dominant-baseline="central">E8</text>
<rect class="k-teal" x="498" y="274" width="40" height="24" rx="4" stroke-width="1"/><text class="th tx-teal" x="518" y="286" text-anchor="middle" dominant-baseline="central">E9</text>
<rect class="k-gray" x="544" y="274" width="40" height="24" rx="4" stroke-width="0.5"/><text class="ts tx-gray" x="564" y="286" text-anchor="middle" dominant-baseline="central">···</text>
<rect class="k-teal" x="590" y="274" width="40" height="24" rx="4" stroke-width="1"/><text class="th tx-teal" x="610" y="286" text-anchor="middle" dominant-baseline="central">E127</text>
<text class="ts tx-teal" x="495" y="320" text-anchor="middle" dominant-baseline="central">6 active experts run (+ 1 shared) · 122 stay asleep in HBM</text>
<line class="arr" x1="495" y1="340" x2="495" y2="376" marker-end="url(#arrow-00)"/>
<rect class="k-purple" x="365" y="380" width="260" height="48" rx="8" stroke-width="0.5"/>
<text class="th tx-purple" x="495" y="397" text-anchor="middle" dominant-baseline="central">Weighted Sum → Output [1, 2688]</text>
<text class="ts tx-purple" x="495" y="415" text-anchor="middle" dominant-baseline="central">30B capacity for ~3B memory traffic!</text>
</svg>
