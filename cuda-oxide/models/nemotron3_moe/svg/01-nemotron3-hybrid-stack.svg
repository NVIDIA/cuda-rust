<svg class="qtts" xmlns="http://www.w3.org/2000/svg" width="680" height="510" viewBox="0 0 680 510" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
<title>Nemotron-3-Nano: 52-layer hybrid stack and what the microsecond timer measures</title>
<style>.qtts .bg { fill:#faf9f5 } .qtts .th { font-size:14px; font-weight:600; fill:#1e1e1e } .qtts .t { font-size:13px; fill:#2b2b2b } .qtts .ts { font-size:12px; fill:#5c5c5c } .qtts .k-box { fill:#f1efe9; stroke:#c8c5be } .qtts .tx-box { fill:#1e1e1e } .qtts .k-purple { fill:#ebe9fb; stroke:#7f77dd } .qtts .tx-purple { fill:#3a3490 } .qtts .k-teal { fill:#dff3ec; stroke:#3aa47f } .qtts .tx-teal { fill:#1f5c47 } .qtts .k-coral { fill:#fde7e2; stroke:#e0735c } .qtts .tx-coral { fill:#7d2f1f } .qtts .k-amber { fill:#fdeed3; stroke:#ef9f27 } .qtts .tx-amber { fill:#6b4100 } .qtts .k-gray { fill:#e8e6e0; stroke:#a9a69f } .qtts .tx-gray { fill:#2b2b2b } .qtts .dash { fill:none; stroke:#b8b4ac; stroke-dasharray:4 3 } .qtts .arr { fill:none; stroke:#7b7b7b; stroke-width:1.5 } .qtts .arrhead { fill:none; stroke:#7b7b7b; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round } @media (prefers-color-scheme: dark) { .qtts .bg { fill: #1b1d23 } .qtts .th { fill: #f5f6f8 } .qtts .t { fill: #eceef2 } .qtts .ts { fill: #cfd4de } .qtts .k-box { fill: #2e323c; stroke: #5c6375 } .qtts .tx-box { fill: #f5f6f8 } .qtts .dash { stroke: #606675 } .qtts .arr, .qtts .arrhead { stroke: #b6bcc8 } .qtts .k-purple { fill: #524e7d; stroke: #bab5f4 } .qtts .tx-purple { fill: #f6f5ff } .qtts .k-teal { fill: #346357; stroke: #7ed8bb } .qtts .tx-teal { fill: #f0fdf8 } .qtts .k-coral { fill: #6b443e; stroke: #f29b8a } .qtts .tx-coral { fill: #fff0ed } .qtts .k-amber { fill: #735a3c; stroke: #f4c474 } .qtts .tx-amber { fill: #fff8eb } .qtts .k-gray { fill: #414654; stroke: #7c8496 } .qtts .tx-gray { fill: #f2f4f7 } }</style>
<defs><marker id="arrow-01" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrhead" d="M2 1L8 5L2 9"/></marker></defs>
<rect class="bg" width="680" height="510" rx="10"/>
<rect class="k-box" x="110" y="24" width="320" height="46" rx="8" stroke-width="0.5"/>
<text class="th tx-box" x="270" y="40" text-anchor="middle" dominant-baseline="central">Input Token Rows X [T, 2688]</text>
<text class="ts tx-box" x="270" y="57" text-anchor="middle" dominant-baseline="central">prefill: T = prompt len · decode: T = 1 (or batch B)</text>
<line class="arr" x1="270" y1="70" x2="270" y2="94" marker-end="url(#arrow-01)"/>
<rect class="dash" x="60" y="98" width="420" height="316" rx="10" stroke-width="1"/>
<text class="th" x="270" y="120" text-anchor="middle" dominant-baseline="central">Nemotron-3-Nano — 52 Hybrid Blocks (M E M E M * E ···)</text>
<rect class="k-gray" x="90" y="138" width="360" height="44" rx="6" stroke-width="0.5"/>
<text class="th tx-gray" x="270" y="153" text-anchor="middle" dominant-baseline="central">Block 0 — Mamba-2 SSM ("M", 23 total)</text>
<text class="ts tx-gray" x="270" y="170" text-anchor="middle" dominant-baseline="central">fast sequence state mixer · tiny fixed-size SSM state</text>
<line class="arr" x1="270" y1="182" x2="270" y2="200" marker-end="url(#arrow-01)"/>
<rect class="k-teal" x="90" y="204" width="360" height="58" rx="8" stroke-width="1.5"/>
<text class="th tx-teal" x="270" y="224" text-anchor="middle" dominant-baseline="central">Block 1 — Mixture-of-Experts FFN ("E", 23 total)</text>
<text class="ts tx-teal" x="270" y="244" text-anchor="middle" dominant-baseline="central">128 NVFP4 ReLU² experts (top-6) + 1 shared expert</text>
<line class="arr" x1="490" y1="233" x2="454" y2="233" marker-end="url(#arrow-01)"/>
<rect class="k-amber" x="494" y="186" width="172" height="94" rx="8" stroke-width="1"/>
<text class="th tx-amber" x="580" y="208" text-anchor="middle" dominant-baseline="central">Timed Unit (µs)</text>
<text class="ts tx-amber" x="580" y="228" text-anchor="middle" dominant-baseline="central">1 MoE layer (B = 1..16K)</text>
<text class="ts tx-amber" x="580" y="246" text-anchor="middle" dominant-baseline="central">12.3–174 µs on B200</text>
<text class="ts tx-amber" x="580" y="264" text-anchor="middle" dominant-baseline="central">(1,000× CUDA Graph)</text>
<line class="arr" x1="270" y1="262" x2="270" y2="280" marker-end="url(#arrow-01)"/>
<rect class="k-purple" x="90" y="284" width="360" height="44" rx="6" stroke-width="0.5"/>
<text class="th tx-purple" x="270" y="299" text-anchor="middle" dominant-baseline="central">Block 5 — GQA Attention ("*", only 6 total)</text>
<text class="ts tx-purple" x="270" y="316" text-anchor="middle" dominant-baseline="central">32 Q : 2 KV heads · reads conversation K/V cache</text>
<line class="arr" x1="270" y1="328" x2="270" y2="346" marker-end="url(#arrow-01)"/>
<rect class="k-teal" x="90" y="350" width="360" height="46" rx="6" stroke-width="0.5"/>
<text class="th tx-teal" x="270" y="366" text-anchor="middle" dominant-baseline="central">··· Blocks 6–51 (repeats M, E, * pattern) ···</text>
<text class="ts tx-teal" x="270" y="383" text-anchor="middle" dominant-baseline="central">The 23 "E" blocks hold ~85% of the 30B model weights</text>
<line class="arr" x1="270" y1="414" x2="270" y2="438" marker-end="url(#arrow-01)"/>
<rect class="k-box" x="110" y="442" width="320" height="46" rx="8" stroke-width="0.5"/>
<text class="th tx-box" x="270" y="458" text-anchor="middle" dominant-baseline="central">Final RMSNorm → LM Head (2688 → 131,072)</text>
<text class="ts tx-box" x="270" y="475" text-anchor="middle" dominant-baseline="central">predicts next token → feeds back to top</text>
</svg>
