<svg class="qtts" xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
<title>Why Batched MoE Needs Routing and Bucketing Before Tensor Cores</title>
<style>.qtts .th { font-size:14px; font-weight:600; fill:#1e1e1e } .qtts .t { font-size:13px; fill:#2b2b2b } .qtts .ts { font-size:12px; fill:#5c5c5c } .qtts .k-box { fill:#f7f6f3; stroke:#c8c5be } .qtts .tx-box { fill:#1e1e1e } .qtts .k-purple { fill:#ebe9fb; stroke:#7f77dd } .qtts .tx-purple { fill:#3a3490 } .qtts .k-teal { fill:#dff3ec; stroke:#3aa47f } .qtts .tx-teal { fill:#1f5c47 } .qtts .k-coral { fill:#fde7e2; stroke:#e0735c } .qtts .tx-coral { fill:#7d2f1f } .qtts .k-amber { fill:#fdeed3; stroke:#ef9f27 } .qtts .tx-amber { fill:#6b4100 } .qtts .k-gray { fill:#eeedea; stroke:#a9a69f } .qtts .tx-gray { fill:#333 } .qtts .dash { fill:none; stroke:#c8c5be; stroke-dasharray:4 3 } .qtts .arr { fill:none; stroke:#7b7b7b; stroke-width:1.5 } .qtts .arrhead { fill:none; stroke:#7b7b7b; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round } @media (prefers-color-scheme: dark) { .qtts .th { fill: #f2f2f2 } .qtts .t { fill: #e6e6e6 } .qtts .ts { fill: #b8b8b8 } .qtts .k-box { fill: #2a2a2e; stroke: #4a4a50 } .qtts .tx-box { fill: #f2f2f2 } .qtts .dash { stroke: #55555c } .qtts .arr, .qtts .arrhead { stroke: #a3a3a3 } .qtts .k-purple { fill: #3a3490; stroke: #9a93ea } .qtts .tx-purple { fill: #e9e7fb } .qtts .k-teal { fill: #1f5c47; stroke: #5fc6a0 } .qtts .tx-teal { fill: #dff3ec } .qtts .k-coral { fill: #7d2f1f; stroke: #f08b76 } .qtts .tx-coral { fill: #fde7e2 } .qtts .k-amber { fill: #6b4100; stroke: #f3b65a } .qtts .tx-amber { fill: #fdeed3 } .qtts .k-gray { fill: #3a3a3e; stroke: #77777d } .qtts .tx-gray { fill: #e6e6e6 } }</style>
<defs><marker id="arrow-03" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrhead" d="M2 1L8 5L2 9"/></marker></defs>
<text class="th" x="130" y="28" text-anchor="middle" dominant-baseline="central">1. Incoming Tokens (Scattered Choices)</text>
<rect class="k-box" x="24" y="48" width="212" height="62" rx="8" stroke-width="0.5"/>
<text class="th tx-box" x="130" y="68" text-anchor="middle" dominant-baseline="central">Token 0 ("fn")</text>
<text class="ts tx-box" x="130" y="88" text-anchor="middle" dominant-baseline="central">picks: Expert 0, Expert 2</text>
<rect class="k-box" x="24" y="122" width="212" height="62" rx="8" stroke-width="0.5"/>
<text class="th tx-box" x="130" y="142" text-anchor="middle" dominant-baseline="central">Token 1 ("main")</text>
<text class="ts tx-box" x="130" y="162" text-anchor="middle" dominant-baseline="central">picks: Expert 1, Expert 2</text>
<rect class="k-box" x="24" y="196" width="212" height="62" rx="8" stroke-width="0.5"/>
<text class="th tx-box" x="130" y="216" text-anchor="middle" dominant-baseline="central">Token 2 ("(")</text>
<text class="ts tx-box" x="130" y="236" text-anchor="middle" dominant-baseline="central">picks: Expert 0, Expert 1</text>
<rect class="k-box" x="24" y="270" width="212" height="62" rx="8" stroke-width="0.5"/>
<text class="th tx-box" x="130" y="290" text-anchor="middle" dominant-baseline="central">Token 3 (")")</text>
<text class="ts tx-box" x="130" y="310" text-anchor="middle" dominant-baseline="central">picks: Expert 0, Expert 2</text>
<line class="arr" x1="236" y1="190" x2="274" y2="190" marker-end="url(#arrow-03)"/>
<rect class="k-amber" x="278" y="124" width="124" height="132" rx="8" stroke-width="0.5"/>
<text class="th tx-amber" x="340" y="158" text-anchor="middle" dominant-baseline="central">Routing</text>
<text class="th tx-amber" x="340" y="176" text-anchor="middle" dominant-baseline="central">Kernel</text>
<text class="ts tx-amber" x="340" y="200" text-anchor="middle" dominant-baseline="central">sorts &amp; pads into</text>
<text class="ts tx-amber" x="340" y="216" text-anchor="middle" dominant-baseline="central">TILE_N = 16</text>
<text class="ts tx-amber" x="340" y="232" text-anchor="middle" dominant-baseline="central">expert tiles</text>
<line class="arr" x1="402" y1="190" x2="440" y2="190" marker-end="url(#arrow-03)"/>
<text class="th" x="550" y="28" text-anchor="middle" dominant-baseline="central">2. Grouped Tiles (Tensor Core Ready)</text>
<rect class="k-teal" x="444" y="52" width="212" height="82" rx="8" stroke-width="0.5"/>
<text class="th tx-teal" x="550" y="74" text-anchor="middle" dominant-baseline="central">Group 0 → Expert 0</text>
<text class="ts tx-teal" x="550" y="94" text-anchor="middle" dominant-baseline="central">tokens: [T0, T2, T3, pad···]</text>
<text class="ts tx-teal" x="550" y="114" text-anchor="middle" dominant-baseline="central">1 Tensor Core tile × W_expert0</text>
<rect class="k-purple" x="444" y="148" width="212" height="82" rx="8" stroke-width="0.5"/>
<text class="th tx-purple" x="550" y="170" text-anchor="middle" dominant-baseline="central">Group 1 → Expert 1</text>
<text class="ts tx-purple" x="550" y="190" text-anchor="middle" dominant-baseline="central">tokens: [T1, T2, pad···]</text>
<text class="ts tx-purple" x="550" y="210" text-anchor="middle" dominant-baseline="central">1 Tensor Core tile × W_expert1</text>
<rect class="k-coral" x="444" y="244" width="212" height="82" rx="8" stroke-width="0.5"/>
<text class="th tx-coral" x="550" y="266" text-anchor="middle" dominant-baseline="central">Group 2 → Expert 2</text>
<text class="ts tx-coral" x="550" y="286" text-anchor="middle" dominant-baseline="central">tokens: [T0, T1, T3, pad···]</text>
<text class="ts tx-coral" x="550" y="306" text-anchor="middle" dominant-baseline="central">1 Tensor Core tile × W_expert2</text>
<rect class="dash" x="24" y="356" width="632" height="82" rx="8" stroke-width="1"/>
<text class="th" x="340" y="380" text-anchor="middle" dominant-baseline="central">Why this step exists: Tensor Cores multiply whole tiles (e.g. 128 × 16), not lone rows</text>
<text class="ts" x="340" y="402" text-anchor="middle" dominant-baseline="central">Routing builds `group_tokens [G, 16]` (which tokens sit in tile G), `group_experts [G]` (which expert weight matrix tile G loads),</text>
<text class="ts" x="340" y="420" text-anchor="middle" dominant-baseline="central">and `expanded_to_permuted [T, K]` (the return ticket so Finalize can scatter results back to each token).</text>
</svg>
