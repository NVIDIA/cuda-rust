<defs><marker id="arrow-05" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrhead" d="M2 1L8 5L2 9"/></marker></defs>
<rect class="bg" width="680" height="480" rx="10"/>
<text class="th" x="340" y="26" text-anchor="middle" dominant-baseline="central">One MoE Layer Captured in a Single CUDA Graph (1,000× Replay)</text>
<rect class="dash" x="36" y="46" width="608" height="394" rx="10" stroke-width="1"/>
<rect class="k-teal" x="60" y="66" width="264" height="60" rx="8" stroke-width="0.75"/>
<text class="th tx-teal" x="192" y="86" text-anchor="middle" dominant-baseline="central">Stage 1: Quantize BF16 → FP4</text>
<text class="ts tx-teal" x="192" y="106" text-anchor="middle" dominant-baseline="central">packed E2M1 + (32,4,4) E4M3 scales</text>
<line class="arr" x1="324" y1="96" x2="352" y2="96" marker-end="url(#arrow-05)"/>
<rect class="k-teal" x="356" y="66" width="264" height="60" rx="8" stroke-width="0.75"/>
<text class="th tx-teal" x="488" y="86" text-anchor="middle" dominant-baseline="central">Stage 2: Top-4 Expert Routing</text>
<text class="ts tx-teal" x="488" y="106" text-anchor="middle" dominant-baseline="central">buckets B × 4 pairs into TMA tiles</text>
<path class="arr" d="M488 126 V148 H340 V166" marker-end="url(#arrow-05)"/>
<rect class="k-amber" x="60" y="170" width="560" height="72" rx="8" stroke-width="0.75"/>
<text class="th tx-amber" x="340" y="192" text-anchor="middle" dominant-baseline="central">Stage 3: Grouped FC1 + ReLU² + NVFP4 Requant</text>
<text class="ts tx-amber" x="340" y="212" text-anchor="middle" dominant-baseline="central">5th-Gen Tensor Core (tcgen05.mma) · W_up [8, 1024, 1024] × Tokens</text>
<text class="ts tx-amber" x="340" y="229" text-anchor="middle" dominant-baseline="central">fuses ReLU²(x) = max(0, x)² and NVFP4 requantization in epilogue</text>
<line class="arr" x1="340" y1="242" x2="340" y2="266" marker-end="url(#arrow-05)"/>
<rect class="k-coral" x="60" y="270" width="560" height="72" rx="8" stroke-width="0.75"/>
<text class="th tx-coral" x="340" y="292" text-anchor="middle" dominant-baseline="central">Stage 4: Grouped FC2 (W_down NVFP4 GEMM → BF16)</text>
<text class="ts tx-coral" x="340" y="312" text-anchor="middle" dominant-baseline="central">B ≤ 1,024: fused atom_add_bf16x2 directly into Output [B, 1024]</text>
<text class="ts tx-coral" x="340" y="329" text-anchor="middle" dominant-baseline="central">B ≥ 2,048: 2-stage SWIZZLE_64B S2G TMA Store into grouped_out</text>
<line class="arr" x1="340" y1="342" x2="340" y2="366" marker-end="url(#arrow-05)"/>
<rect class="k-purple" x="110" y="370" width="460" height="52" rx="8" stroke-width="0.75"/>
<text class="th tx-purple" x="340" y="388" text-anchor="middle" dominant-baseline="central">Stage 5: Top-4 Weighted Combine (B ≥ 2,048 only)</text>
<text class="ts tx-purple" x="340" y="407" text-anchor="middle" dominant-baseline="central">1 warp per token combines 4 expert rows via u128 loads/stores</text>
<text class="ts" x="340" y="460" text-anchor="middle" dominant-baseline="central">B200 Latency: Native SIMT 12.3–174.8 µs · cute-rs 12.3–173.9 µs · FlashInfer SOTA 18.4–179.4 µs</text>
