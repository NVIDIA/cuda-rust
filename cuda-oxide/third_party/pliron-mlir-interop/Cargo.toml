[package]
name = "pliron-mlir-interop"
description = "IR translation between pliron and MLIR"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/pliron-org/pliron-mlir-interop"
categories = ["compilers"]
keywords = ["pliron", "mlir", "interop", "compiler"]

[dependencies]
pliron = "0.20.0"
pliron-llvm = { version = "0.20.0", default-features = false, features = ["std"] }
thiserror = "2"

[dev-dependencies]
expect-test = "1"
