[workspace]
resolver = "2"

members = [
    # Host CUDA crates live at the git root (Oxide workspace members).
    # This workspace path-depends on them; they cannot be members here.

    # cuTile Rust compiler. Requires cutile-ir + cuda-async.
    "cutile-compiler",

    # cuTile Rust macros. Requires cutile-compiler.
    "cutile-macro",

    # Pure Rust Tile IR representation and bytecode writer.
    "cutile-ir",

    # Main package (cuTile Rust). Requires cuda-async + cutile-compiler + cutile-macro
    "cutile",

    # Examples and benchmarks.
    "cutile-examples",
    "cutile-benchmarks",

    # Reusable cuTile Rust kernels.
    "cutile-kernels",

    # Thin wrapper around the cuda-tile C++ library; excluded from
    # default-members because its build downloads and compiles LLVM.
    "cuda-tile-rs",
]

default-members = [
    "cutile-compiler",
    "cutile-macro",
    "cutile-ir",
    "cutile",
    "cutile-kernels",
    "cutile-examples",
    "cutile-benchmarks",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["Melih Elibol"]
repository = "https://github.com/NVIDIA/cuda-rust"

[workspace.dependencies]
# ── Third-party ──────────────────────────────────────────────────────────────
syn = { version = "2.0", features = ["full", "extra-traits", "visit", "visit-mut", "fold"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1.0.35"
regex = "1.11.1"
uuid = { version = "1.17", features = ["v4"] }
prettyplease = "0.2.35"
half = { version = "2" }
itertools = "0.14.0"
num-traits = { version = "0" }
anyhow = "1"
stacker = "0.1"
libloading = "0.8"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
candle-core = { version = "0.9.2", features = [] }
candle-nn = { version = "0.9.2", features = [] }
criterion = { version = "0.7", features = ["html_reports", "async_tokio", "csv_output"] }
trybuild = { version = "1.0.49", features = ["diff"] }
convert_case = "0.8"
linkme = "0.3"
dashmap = "6"
rustc-hash = "2.0"
sha2 = "0.10"
once_cell = "1.19"

# ── Intra-workspace ──────────────────────────────────────────────────────────
cuda-bindings = { path = "../cuda-bindings", version = "=0.4.0" }
cuda-core = { path = "../cuda-core", version = "=0.4.0" }
cuda-async = { path = "../cuda-async", version = "=0.4.0" }
# Lockstep crates: the macro's generated code targets exact runtime items
# (and the compiler's registry/ast contract), so a floating requirement lets
# cargo pair an old runtime with a new macro and break the OLD published
# crate for downstreams (candle CI, 2026-09-04: cutile 0.3.0 resolved
# cutile-macro 0.3.1 and failed on 0.3.1-only symbols). Exact-pin, like
# serde pins serde_derive.
cutile-compiler = { path = "cutile-compiler", version = "=0.4.0" }
cutile-macro = { path = "cutile-macro", version = "=0.4.0" }
cutile = { path = "cutile", version = "=0.4.0" }
cutile-ir = { path = "cutile-ir", version = "=0.4.0" }

# Lint policy shared by every workspace crate (`[lints] workspace = true`).
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
missing_safety_doc = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
# Rewriting indexed loops over several parallel arrays and boxing large enum variants
# is invasive in the compiler; both stay allowed for now.
needless_range_loop = "allow"
large_enum_variant = "allow"
# `Tensor::slice` and friends take one `Range` per axis; a single-element range array is the
# rank-1 case, not a mistaken `vec![0..n]`.
single_range_in_vec_init = "allow"
