[package]
name = "launch-overhead-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[[bin]]
name = "launch_overhead"
path = "src/main.rs"

[[bin]]
name = "async_throughput"
path = "src/bin/async_throughput.rs"

[dependencies]
cuda-core = { path = "../../../../../cuda-core" }
cuda-async = { path = "../../../../../cuda-async" }
cutile = { path = "../../../../cutile" }
cutile-macro = { path = "../../../../cutile-macro" }
cutile-compiler = { path = "../../../../cutile-compiler" }
tokio = { version = "1", features = ["rt", "macros"] }

[profile.release]
opt-level = 3
lto = "thin"

[workspace]
