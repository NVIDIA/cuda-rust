[package]
name = "cutile"
description = "cuTile Rust lets programmers safely author and execute tile kernels directly in Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["mlir", "cutile", "cuda", "gpu", "async"]

[features]
default = []
# Kernel autotuning (`cutile::tune`). Experimental: enabling this feature
# opts into an API that may change in breaking ways between releases.
experimental-tune = []

[dependencies]
syn = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
num-traits = { workspace = true }
half = { workspace = true }
anyhow = { workspace = true }
cuda-core = { workspace = true }
cuda-async = { workspace = true }
cutile-compiler = { workspace = true }
cutile-macro = { workspace = true }
cutile-ir = { workspace = true }
linkme = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dashmap = { workspace = true }
once_cell = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
sha2 = { workspace = true }
trybuild = { workspace = true }

[lints]
workspace = true
