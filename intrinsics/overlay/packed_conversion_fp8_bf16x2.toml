#
# Reviewed bf16x2-to-packed-FP8 conversions.
#
# Pack only. The source arrives already packed in one register. The imported
# reverse conversions carry a block scale and are not admitted here.

schema = 65
family = "packed_conversion"

[packed_conversion_fp8_bf16x2]
llvm_evidence_profile = "rust-llvm-23.1.0-16696adc"
libnvvm_evidence_profile = "cuda-13.3-libnvvm-13.3.33"
runtime_validation = "unexecuted"
fp8_formats = ["e4m3x2", "e5m2x2"]
relu_variants = true
product_count = 4
