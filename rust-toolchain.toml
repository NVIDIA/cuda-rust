# Stable pin for the git-root host workspace (cuda-bindings, cuda-core,
# cuda-core-derive, cuda-async). rustup walks up from the working directory,
# so `cargo` at the git root does not inherit `cuda-oxide/rust-toolchain.toml`.
# Keep this channel in lockstep with cutile-rs/rust-toolchain.toml.
[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
